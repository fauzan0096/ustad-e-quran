<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Dictionary - Touch & Learn</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonts for Arabic and Urdu -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>📖 Quran & Namaz Dictionary</h1>
        <p>Lafz par touch karein aur uski aawaz sunein</p>
    </header>

    <div class="controls">
        <input type="text" id="searchBar" placeholder="🔍 Search Arabic, Roman, or Urdu...">
        <div class="tabs">
            <button class="tab-btn active" data-category="namaz">Namaz ki Duaen</button>
            <button class="tab-btn" data-category="quran326">Quran (326 Alfaz)</button>
            <button class="tab-btn" data-category="quran650">Quran (650 Alfaz)</button>
        </div>
    </div>

    <div class="grid-container" id="wordGrid">
        <!-- Words will be loaded here by JavaScript -->
    </div>

    <div id="toast" class="toast">Aawaz play ho rahi hai...</div>

    <script src="script.js"></script>
</body>
</html>
