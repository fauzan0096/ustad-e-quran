<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - Fahm-ul-Quran</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <script src="app.js"></script>
    <meta name="theme-color" content="#0F4C3A">
    <script src="sounds.js" defer></script>
    <script src="namaz.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0F4C3A; --secondary: #D4AF37; --bg: #F4F7F6; --card-bg: #fff; --text: #333; --text-light: #666; --border: #ddd; --kbc-bg: #0b3a2c; --kbc-gold: #D9B65A; --kbc-blue: #0F4C3A; }
        [data-theme="dark"] { --primary: #1a1a2e; --secondary: #6ee7b7; --bg: #0f0f23; --card-bg: #1e1e36; --text: #eee; --text-light: #aaa; --border: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 30px; }
        header { background: linear-gradient(135deg, #0F4C3A 0%, #17695171 60%, #0F4C3A 100%); color: white; padding: 15px; border-bottom: 3px solid var(--secondary); text-align: center; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: white; }
        .main-nav { display: flex; justify-content: flex-start; overflow-x: auto; gap: 10px; margin: 15px auto; padding: 0 15px; max-width: 1200px; scrollbar-width: none; }
        .main-nav::-webkit-scrollbar { display: none; }
        .nav-btn { padding: 10px 16px; border: none; border-radius: 20px; font-size: 13px; font-weight: 600; background: var(--card-bg); color: var(--text); box-shadow: 0 3px 10px rgba(0,0,0,0.1); cursor: pointer; white-space: nowrap; }
        .nav-btn.active { background: var(--primary); color: #fff; }
        .container { max-width: 800px; margin: 0 auto; padding: 0 15px; }
        .game-section { display: none; }
        .game-section.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }

        .cele-layer { position: fixed; inset: 0; pointer-events: none; z-index: 99998; overflow: hidden; }
        .cele-conf { position: absolute; top: -20px; width: 10px; height: 14px; opacity: .95; animation: celeFall linear forwards; }
        @keyframes celeFall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }
        .cele-balloon { position: absolute; bottom: -80px; font-size: 44px; animation: celeRise ease-in forwards; }
        @keyframes celeRise { to { transform: translateY(-115vh) translateX(var(--dx)); } }
        .cele-pop { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); }
        .cele-card { background: linear-gradient(135deg,#0F4C3A,#14735a); color: #fff; border: 3px solid #D4AF37; border-radius: 22px; padding: 26px 30px; text-align: center; max-width: 85%; box-shadow: 0 15px 50px rgba(0,0,0,.5); animation: celePop .5s cubic-bezier(.2,1.6,.4,1); }
        .cele-card .big { font-size: 56px; }
        .cele-card h2 { color: #f5c518; margin: 8px 0; font-size: 26px; }
        .cele-card p { font-size: 15px; margin-bottom: 14px; }
        .cele-card button { background: #D4AF37; color: #000; border: none; padding: 10px 26px; border-radius: 22px; font-weight: bold; font-size: 15px; cursor: pointer; }
        @keyframes celePop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        #kbc { background: var(--kbc-bg); border-radius: 15px; padding: 20px; margin-bottom: 20px; min-height: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
        #kbc::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(217,182,90,0.15), transparent 60%); pointer-events: none; }
        .kbc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; position: relative; z-index: 1; color: var(--kbc-gold); font-weight: bold; font-size: 13px; gap: 8px; }
        .kbc-day { background: rgba(217,182,90,0.2); padding: 5px 12px; border-radius: 15px; }
        .kbc-prize { background: rgba(217,182,90,0.2); padding: 5px 12px; border-radius: 15px; }
        .kbc-qnum { text-align: center; color: #aaa; font-size: 12px; margin-bottom: 10px; position: relative; z-index: 1; }
        .kbc-qnum b { color: var(--kbc-gold); }
        .kbc-question { color: #fff; font-size: 17px; font-weight: 600; text-align: center; padding: 20px 15px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid rgba(217,182,90,0.3); margin-bottom: 20px; min-height: 80px; display: flex; align-items: center; justify-content: center; line-height: 1.5; position: relative; z-index: 1; }
        .kbc-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; z-index: 1; }
        .kbc-opt { background: linear-gradient(135deg, #14614A, #0F4C3A); color: #fff; border: 2px solid #2f7a60; padding: 12px 10px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; display: flex; gap: 8px; align-items: center; }
        .kbc-opt b { color: var(--kbc-gold); font-weight: bold; }
        .kbc-opt.correct { background: linear-gradient(135deg, #1a5c2a, #0c3c1a); border-color: #2ea14a; }
        .kbc-opt.wrong { background: linear-gradient(135deg, #5c1a1a, #3c0c0c); border-color: #a12e2e; }
        .kbc-opt.sel { border-color: var(--kbc-gold); background: rgba(217,182,90,0.22); }
        .kbc-confirm { display: flex; gap: 8px; margin-top: 12px; position: relative; z-index: 1; }
        .kbc-confirm button { flex: 1; padding: 11px 8px; border-radius: 14px; font-weight: bold; font-size: 13px; cursor: pointer; border: 1px solid var(--kbc-gold); background: transparent; color: var(--kbc-gold); }
        .kbc-confirm button.yes { background: var(--kbc-gold); color: #000; }
        .kbc-quit { display: block; margin: 14px auto 0; background: transparent; border: 1px solid rgba(255,255,255,.3); color: #ddd; padding: 8px 16px; border-radius: 16px; font-size: 12px; cursor: pointer; position: relative; z-index: 1; }
        .kbc-note { text-align: center; color: #aaa; font-size: 11px; margin-top: 8px; position: relative; z-index: 1; }
        .kbc-opt.disabled { opacity: 0.4; cursor: not-allowed; }
        .kbc-lifelines { display: flex; justify-content: center; gap: 8px; margin-top: 15px; position: relative; z-index: 1; flex-wrap: wrap; }
        .kbc-life { background: rgba(217,182,90,0.15); color: var(--kbc-gold); border: 1px solid var(--kbc-gold); padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .kbc-life:disabled { opacity: 0.3; cursor: not-allowed; }
        .kbc-life.on { background: var(--kbc-gold); color: #000; }
        .kbc-result { text-align: center; padding: 25px 15px; color: #fff; position: relative; z-index: 1; }
        .kbc-result h2 { color: var(--kbc-gold); margin-bottom: 15px; font-size: 22px; }
        .kbc-result .prize { font-size: 28px; color: #4ade80; font-weight: bold; margin: 15px 0; }
        .kbc-btn { background: linear-gradient(135deg, var(--kbc-gold), #B8923A); color: #000; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .kbc-ladder { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 20px; position: relative; z-index: 1; }
        .kbc-ladder span { background: rgba(255,255,255,0.08); color: #aaa; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .kbc-ladder span.active { background: var(--kbc-gold); color: #000; }
        .kbc-ladder span.safe { border: 1px solid var(--kbc-gold); color: var(--kbc-gold); }
        .kbc-ladder span.done { background: rgba(74,222,128,0.25); color: #4ade80; }

        .sahaba-box { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 4px solid var(--secondary); }
        .sahaba-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sahaba-score { background: var(--secondary); color: #000; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .sahaba-q { font-size: 16px; font-weight: 600; margin-bottom: 15px; color: var(--text); }
        .sahaba-opt { width: 100%; padding: 12px 15px; margin-bottom: 8px; border: 2px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; }
        .sahaba-opt:hover { border-color: var(--primary); }
        .sahaba-opt.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .sahaba-opt.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .sahaba-story { background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05)); border: 1px solid var(--secondary); border-radius: 12px; padding: 15px; margin-top: 15px; }
        .sahaba-story h3 { color: var(--primary); margin-bottom: 8px; font-size: 15px; }
        .sahaba-story p { font-size: 13px; line-height: 1.6; color: var(--text); }
        .btn-primary { background: var(--primary); color: #fff; border: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 12px; width: 100%; }
        .btn-gold { background: var(--secondary); color: #000; }

        .memory-box { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
        .memory-info { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 13px; font-weight: bold; }
        .memory-info span { background: var(--secondary); color: #000; padding: 5px 12px; border-radius: 15px; }
        .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .mem-card { aspect-ratio: 1; background: linear-gradient(135deg, #0F4C3A, #1a7a5c); border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: transparent; user-select: none; position: relative; transition: all 0.3s; padding: 4px; text-align: center; }
        .mem-card::before { content: "؟"; color: #D4AF37; font-size: 24px; position: absolute; }
        .mem-card.flipped { background: var(--card-bg); border: 2px solid var(--secondary); color: var(--text); }
        .mem-card.flipped::before { content: none; }
        .mem-card.matched { background: #d4edda; border: 2px solid #28a745; color: #155724; cursor: default; }
        .mem-card.matched::before { content: "✓"; color: #28a745; font-size: 20px; }
        .mem-card .ar { font-family: 'Amiri', serif; font-size: 17px; direction: rtl; }
        .mem-card .ur { font-family: 'Noto Nastaliq Urdu', serif; font-size: 12px; direction: rtl; line-height: 1.4; }

        .emoji-box { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; border-top: 4px solid var(--secondary); }
        .emoji-display { font-size: 60px; line-height: 1.4; margin: 20px 0; padding: 20px; background: var(--bg); border-radius: 15px; }
        .emoji-score { display: inline-block; background: var(--secondary); color: #000; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        .emoji-question { font-size: 15px; font-weight: 600; margin-bottom: 15px; }
        .emoji-opt { width: 100%; padding: 12px 15px; margin-bottom: 8px; border: 2px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; cursor: pointer; text-align: center; font-size: 14px; font-weight: 500; }
        .emoji-opt.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .emoji-opt.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
<!-- ⚠️ Deeni disclaimer: tajweed / dua / asma / games / bazm -->
<div id="deeniNotice" role="note">
    <span>⚠️ <b>Zaroori:</b> ye app <b>aalim ya qaari ki jagah nahi</b>. Tajweed, namaz aur deeni ahkam kisi mustanad ustad se seekhein. App sirf seekhne mein madad ke liye hai. <a href="privacy.html">Tafseel</a></span>
    <button type="button" aria-label="Band karein" onclick="this.parentElement.style.display='none';try{sessionStorage.setItem('deeniNoticeHide','1')}catch(e){}">✕</button>
</div>
<style>
#deeniNotice{display:flex;align-items:flex-start;gap:8px;justify-content:center;background:#FFF3CD;border-bottom:2px solid #FFC107;color:#5a4400;padding:9px 12px;font:12.5px/1.6 system-ui,-apple-system,sans-serif;text-align:center}
#deeniNotice a{color:inherit;font-weight:700}
#deeniNotice button{flex:0 0 auto;background:transparent;border:none;color:inherit;font-weight:700;font-size:16px;line-height:1;cursor:pointer;padding:2px 6px;min-width:32px;min-height:32px}
[data-theme="dark"] #deeniNotice{background:#3a2f0b;border-bottom-color:#B8923A;color:#f3e6b5}
</style>
<script>(function(){try{if(sessionStorage.getItem('deeniNoticeHide')==='1')document.getElementById('deeniNotice').style.display='none';}catch(e){}})();</script>
    <header>
        <div class="header-top">
            <h1>🎮 Games</h1>
            <div>
                <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
                <a href="index.html" style="color:white; text-decoration:none; font-size:20px;">🏠</a>
            </div>
        </div>
    </header>
    <div class="main-nav">
        <button class="nav-btn active" onclick="switchGame('kbc', this)">🪜 Maratib-e-Ilm</button>
        <button class="nav-btn" onclick="switchGame('sahaba', this)">⭐ Sahaba</button>
        <button class="nav-btn" onclick="switchGame('memory', this)">🧠 Memory</button>
        <button class="nav-btn" onclick="switchGame('emoji', this)">😀 Emoji</button>
        <button class="nav-btn" onclick="location.href='bazm.html'">🎓 Bazm-e-Fahm</button>
    </div>
    <div class="container">
        <div id="kbc" class="game-section active"></div>
        <div id="sahaba" class="game-section"></div>
        <div id="memory" class="game-section"></div>
        <div id="emoji" class="game-section"></div>
    </div>

    <!-- Background Nasheed (Ahle Hadees: no music, only vocals) -->
    <audio id="kbcNasheed" loop preload="none">
        <source src="nasheed.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ==========================================
        // THEME
        // ==========================================
        let isDarkMode = localStorage.getItem('darkMode') === 'true';
        if (isDarkMode) document.body.setAttribute('data-theme', 'dark');
        function toggleTheme() { isDarkMode = !isDarkMode; document.body.setAttribute('data-theme', isDarkMode ? 'dark' : 'light'); document.getElementById('themeBtn').innerText = isDarkMode ? '☀️' : '🌙'; localStorage.setItem('darkMode', isDarkMode); }
        if (isDarkMode) document.getElementById('themeBtn').innerText = '☀️';

        // ==========================================
        // CELEBRATION
        // ==========================================
        function celeSound() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                const ctx = new AC();
                const t0 = ctx.currentTime + 0.05;
                const note = (f, t, d, type, vol) => {
                    const o = ctx.createOscillator(), g = ctx.createGain();
                    o.type = type || 'triangle'; o.frequency.value = f;
                    g.gain.setValueAtTime(0.0001, t0 + t);
                    g.gain.exponentialRampToValueAtTime(vol || 0.25, t0 + t + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + d);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(t0 + t); o.stop(t0 + t + d + 0.05);
                };
                [[523, 0], [659, 0.15], [784, 0.3], [1047, 0.45]].forEach(n => note(n[0], n[1], 0.25));
                [523, 659, 784, 1047].forEach(f => note(f, 0.7, 1.0, 'sine', 0.18));
                setTimeout(() => ctx.close && ctx.close(), 2500);
            } catch (e) {}
        }
        function celebrate(title, msg) {
            celeSound();
            const layer = document.createElement('div');
            layer.className = 'cele-layer';
            const colors = ['#f5c518', '#ff4d6d', '#4ade80', '#38bdf8', '#c084fc', '#fb923c'];
            for (let i = 0; i < 90; i++) {
                const c = document.createElement('i');
                c.className = 'cele-conf';
                c.style.left = Math.random() * 100 + '%';
                c.style.background = colors[i % colors.length];
                c.style.animationDuration = (2.2 + Math.random() * 2.2) + 's';
                c.style.animationDelay = (Math.random() * 0.8) + 's';
                c.style.borderRadius = i % 3 ? '2px' : '50%';
                layer.appendChild(c);
            }
            const balloons = ['🎈', '🎈', '🎈', '🎉', '🎊', '✨'];
            for (let i = 0; i < 14; i++) {
                const b = document.createElement('span');
                b.className = 'cele-balloon';
                b.textContent = balloons[i % balloons.length];
                b.style.left = (Math.random() * 90) + '%';
                b.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
                b.style.animationDuration = (3.5 + Math.random() * 2.5) + 's';
                b.style.animationDelay = (Math.random() * 1.2) + 's';
                layer.appendChild(b);
            }
            document.body.appendChild(layer);
            const pop = document.createElement('div');
            pop.className = 'cele-pop';
            pop.innerHTML = `<div class="cele-card"><div class="big">🏆</div><h2>${title || 'Mubarak Ho!'}</h2><p>${msg || 'Aap jeet gaye! Allah aap ko aur ilm de.'}</p><button>Shukriya 🤲</button></div>`;
            const close = () => { pop.remove(); };
            pop.querySelector('button').onclick = close;
            pop.onclick = e => { if (e.target === pop) close(); };
            document.body.appendChild(pop);
            setTimeout(close, 4500);
            setTimeout(() => layer.remove(), 7500);
        }

        function switchGame(game, btn) {
            document.querySelectorAll('.game-section').forEach(v => v.classList.remove('active'));
            document.getElementById(game).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (game === 'kbc') initKBC();
            else if (game === 'sahaba') initSahaba();
            else if (game === 'memory') initMemory();
            else if (game === 'emoji') initEmoji();
        }

        // ==========================================
        // NASHEED TOGGLE
        // (sounds.js isko behtar version se replace kar deta hai)
        // ==========================================
        function toggleNasheed() {
            const audio = document.getElementById('kbcNasheed');
            const btn = document.getElementById('nasheedBtn');
            if (!audio) return;
            if (audio.paused) {
                audio.volume = 0.25;
                audio.play().then(() => {
                    if (btn) { btn.textContent = '🔇 Nasheed Off'; btn.classList.add('on'); }
                }).catch(() => {
                    alert('Nasheed file nahi mili.\n"nasheed.mp3" file games.html ke saath isi folder mein rakhein.');
                });
            } else {
                audio.pause();
                if (btn) { btn.textContent = '🎵 Nasheed'; btn.classList.remove('on'); }
            }
        }

        // ==========================================
        // MARATIB-E-ILM DATA — 30 DAYS × 10 QUESTIONS
        // Format: [question, A, B, C, D, correctIdx, difficulty(1-3)]
        // Har din ke andar difficulty 1→3 badhti hai
        // SAARE SAWALAT AHLE HADEES MANHAJ KE MUTABIQ
        // ==========================================
        const KBC = [
        // ===== DAY 1 =====
        [
            ["Islam ke kitne arkaan hain?","3","5","7","10",1,1],
            ["Namaz din mein kitni baar farz hai?","3","4","5","6",2,1],
            ["Quran kis Nabi par nazil hua?","Musa (AS)","Isa (AS)","Muhammad ﷺ","Ibrahim (AS)",2,1],
            ["Roza kis mahine mein farz hai?","Ramzan","Shaban","Rajab","Muharram",0,1],
            ["Qibla kahan hai?","Madinah","Makkah","Jerusalem","Taif",1,1],
            ["Kaaba kis shehar mein hai?","Madinah","Makkah","Jeddah","Taif",1,2],
            ["Zakat kitne hisse par farz hai?","1%","2.5%","5%","10%",1,2],
            ["Pehle Nabi kaun the?","Nuh (AS)","Aadam (AS)","Ibrahim (AS)","Musa (AS)",1,2],
            ["Fajr ki farz rak'at kitni hain?","2","3","4","5",0,3],
            ["Quran mein kitni Surah hain?","100","114","120","99",1,3]
        ],
        // ===== DAY 2 =====
        [
            ["Quran ki pehli Surah kaun si hai?","Al-Baqarah","Al-Fatiha","Al-Ikhlas","An-Nas",1,1],
            ["Bismillah mein Allah ke kitne naam hain?","1","2","3","4",1,1],
            ["Quran kis zaban mein nazil hua?","Urdu","Farsi","Arabic","Hebrew",2,1],
            ["Juma ki namaz kis din farz hai?","Somwar","Mangal","Juma","Itwar",2,1],
            ["Maghrib ki farz rak'at kitni?","2","3","4","5",1,2],
            ["Eid ki namaz kitni rak'at hoti hai?","2","4","6","8",0,2],
            ["Kashti kis Nabi ne banai?","Nuh (AS)","Musa (AS)","Ibrahim (AS)","Isa (AS)",0,2],
            ["Zuhr ki farz rak'at kitni?","2","3","4","5",2,3],
            ["Pehle Khalifa kaun the?","Umar (RA)","Abu Bakr (RA)","Uthman (RA)","Ali (RA)",1,3],
            ["Asr ki farz rak'at kitni?","2","3","4","5",2,3]
        ],
        // ===== DAY 3 =====
        [

        const PRIZES = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512];
        const DARJA = ['🌱 Mubtadi', '📖 Talib', '💡 Faahim', '🏅 Mutqin', '🌟 Mahir'];   // har 2 sawal par ek darja
        const PRIZE_LABELS = PRIZES.map((p, i) => `⭐ ${p}${i === 4 ? ' 🎯' : i === 9 ? ' 🏆' : ''}`);

        // ===== MARATIB-E-ILM STATE (purane naam kbc* andar rakhe hain taaki saved progress na tute) =====
        let kbcState = null;
        let kbcData = null;
        const KBC_KEY = 'p_' + (localStorage.getItem('activeProfile') || 'p1') + '_kbcUnlockedDay';
        let kbcDayIdx = null;
        function kbcUnlocked() {
            const n = parseInt(localStorage.getItem(KBC_KEY), 10) || 1;
            return Math.min(Math.max(n, 1), KBC.length);
        }

        function initKBC(dayNum) {
            const unlocked = kbcUnlocked();
            if (typeof dayNum === 'number' && dayNum >= 1 && dayNum <= unlocked) kbcDayIdx = dayNum - 1;
            else if (kbcDayIdx === null || kbcDayIdx >= unlocked) kbcDayIdx = unlocked - 1;
            const dayIndex = kbcDayIdx;

            // Sort by difficulty ascending — Q1 easy ... Q10 hard
            kbcData = KBC[dayIndex].slice().sort((a, b) => (a[6] || 1) - (b[6] || 1));

            kbcState = { qIndex: 0, used5050: false, usedAudience: false, usedPhone: false, usedSwap: false, currentPrize: 0, sel: -1 };

            let dayOpts = '';
            for (let d = 1; d <= unlocked; d++) dayOpts += `<option value="${d}" ${d === dayIndex + 1 ? 'selected' : ''}>📅 Day ${d}</option>`;
            const daySelect = `<select class="kbc-day" style="border:none;color:var(--kbc-gold);font-weight:bold;font-size:13px;background:transparent;" onchange="initKBC(parseInt(this.value,10))">${dayOpts}</select>`;

            document.getElementById('kbc').innerHTML = `
                <div class="kbc-top">
                    ${daySelect}
                    <span class="kbc-prize" id="kbcPrizeDisplay">⭐ 0</span>
                </div>
                <div class="kbc-qnum" id="kbcQNum">Sawal 1 / 10</div>
                <div class="kbc-question" id="kbcQuestion"></div>
                <div class="kbc-options" id="kbcOptions"></div>
                <div class="kbc-confirm" id="kbcConfirm" style="display:none">
                    <button class="yes" onclick="kbcConfirmYes()">Haan, jawab pakka hai</button>
                    <button onclick="kbcConfirmNo()">Dobara sochun</button>
                </div>
                <div class="kbc-lifelines">
                    <button class="kbc-life" id="life5050" onclick="kbc5050()">✂️ Do Ghalat Hatayein</button>
                    <button class="kbc-life" id="lifeAud" onclick="kbcAudience()">👥 Hazireen ki Raay</button>
                    <button class="kbc-life" id="lifePhone" onclick="kbcPhone()">📞 Saathi se Mashwara</button>
                    <button class="kbc-life" id="lifeSwap" onclick="kbcSwap()">🔄 Sawal Tabdeel</button>
                </div>
                <div class="kbc-ladder" id="kbcLadder"></div>
                <div class="kbc-note">🎯 = pakka darja (yahan tak ke stars mehfooz) • Stars sirf inaam ke nishan hain, koi paisa nahi</div>
                <button class="kbc-quit" onclick="kbcQuit()">🛑 Yahin Ruk Jayein (abhi ke stars le lein)</button>
            `;
            renderLadder();
            kbcLoadQuestion();
        }

        function renderLadder() {
            const ladder = document.getElementById('kbcLadder');
            if (!ladder) return;
            ladder.innerHTML = PRIZE_LABELS.map((p, i) => {
                let cls = '';
                if (i === 4 || i === 9) cls = 'safe';
                return `<span class="${cls}" data-q="${i}">${p}</span>`;
            }).join('');
        }

        function kbcLoadQuestion() {
            if (!kbcState) return;
            if (kbcState.qIndex >= kbcData.length) { kbcFinish(true); return; }
            const q = kbcData[kbcState.qIndex];

            document.getElementById('kbcQNum').innerHTML = `Sawal <b>${kbcState.qIndex + 1}</b> / 10 &nbsp;•&nbsp; Darja: <b>${DARJA[Math.min(4, Math.floor(kbcState.qIndex / 2))]}</b>`;
            kbcState.sel = -1; const cf = document.getElementById('kbcConfirm'); if (cf) cf.style.display = 'none';
            document.getElementById('kbcQuestion').innerText = q[0];

            const opts = document.getElementById('kbcOptions');
            const letters = ['A','B','C','D'];
            opts.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const btn = document.createElement('button');
                btn.className = 'kbc-opt';
                btn.innerHTML = `<b>${letters[i]}.</b> ${q[i+1]}`;
                btn.onclick = () => kbcSelect(i);
                opts.appendChild(btn);
            }
            document.getElementById('kbcPrizeDisplay').innerText = kbcState.currentPrize > 0 ? `⭐ ${kbcState.currentPrize}` : '⭐ 0';

            document.querySelectorAll('.kbc-ladder span').forEach((s, i) => {
                s.classList.remove('active', 'done');
                if (i < kbcState.qIndex) s.classList.add('done');
                if (i === kbcState.qIndex) s.classList.add('active');
            });
        }

        // Jawab chunne ke baad "pakka hai?" poochta hai
        function kbcSelect(i) {
            if (!kbcState) return;
            const btns = document.querySelectorAll('.kbc-opt');
            if (btns[i].disabled) return;
            kbcState.sel = i;
            btns.forEach((b, k) => b.classList.toggle('sel', k === i));
            document.getElementById('kbcConfirm').style.display = 'flex';
        }
        function kbcConfirmYes() {
            if (!kbcState || kbcState.sel < 0) return;
            document.getElementById('kbcConfirm').style.display = 'none';
            document.querySelectorAll('.kbc-opt').forEach(b => b.classList.remove('sel'));
            kbcAnswer(kbcState.sel);
        }
        function kbcConfirmNo() {
            if (!kbcState) return;
            kbcState.sel = -1;
            document.querySelectorAll('.kbc-opt').forEach(b => b.classList.remove('sel'));
            document.getElementById('kbcConfirm').style.display = 'none';
        }

        // Sawal Tabdeel: usi mushkil-darje ka dusra sawal (kisi bhi din se, jo abhi is round mein nahi aaya)
        function kbcSwap() {
            if (!kbcState || kbcState.usedSwap) return;
            const cur = kbcData[kbcState.qIndex];
            const asked = new Set(kbcData.map(q => q[0]));
            let pool = [];
            KBC.forEach(day => day.forEach(q => { if ((q[6] || 1) === (cur[6] || 1) && !asked.has(q[0])) pool.push(q); }));
            if (!pool.length) return;
            kbcState.usedSwap = true;
            document.getElementById('lifeSwap').disabled = true;
            kbcData[kbcState.qIndex] = pool[Math.floor(Math.random() * pool.length)];
            kbcLoadQuestion();
        }

        function kbcQuit() {
            if (!kbcState) return;
            if (confirm('Yahin ruk jayein? Abhi tak ke stars mil jayenge.')) kbcFinish(false, true);
        }

        function kbcAnswer(sel) {
            const q = kbcData[kbcState.qIndex];
            const correct = q[5];
            const btns = document.querySelectorAll('.kbc-opt');
            btns.forEach(b => b.disabled = true);

            if (sel === correct) {
                btns[sel].classList.add('correct');
                kbcState.currentPrize = PRIZES[kbcState.qIndex];
                document.getElementById('kbcPrizeDisplay').innerText = `⭐ ${kbcState.currentPrize}`;
                setTimeout(() => {
                    kbcState.qIndex++;
                    if (kbcState.qIndex >= kbcData.length) kbcFinish(true);
                    else kbcLoadQuestion();
                }, 1500);
            } else {
                btns[sel].classList.add('wrong');
                btns[correct].classList.add('correct');
                setTimeout(() => kbcFinish(false), 2200);
            }
        }

        function kbc5050() {
            if (!kbcState || kbcState.used5050) return;
            kbcState.used5050 = true;
            document.getElementById('life5050').disabled = true;
            const q = kbcData[kbcState.qIndex];
            const correct = q[5];
            const wrongs = [0,1,2,3].filter(i => i !== correct).sort(() => Math.random() - 0.5).slice(0, 2);
            const btns = document.querySelectorAll('.kbc-opt');
            wrongs.forEach(i => { btns[i].disabled = true; btns[i].classList.add('disabled'); if (kbcState.sel === i) kbcConfirmNo(); });
        }

        function kbcAudience() {
            if (!kbcState || kbcState.usedAudience) return;
            kbcState.usedAudience = true;
            document.getElementById('lifeAud').disabled = true;
            const q = kbcData[kbcState.qIndex];
            const correct = q[5];
            const percentages = [0,0,0,0];
            let remaining = 100;
            percentages[correct] = 40 + Math.floor(Math.random() * 30);
            remaining -= percentages[correct];
            [0,1,2,3].filter(i => i !== correct).forEach(i => {
                const v = Math.floor(Math.random() * remaining / 2);
                percentages[i] = v;
                remaining -= v;
            });
            percentages[correct] += remaining;
            const letters = ['A','B','C','D'];
            alert('👥 Hazireen ki Raay (sirf andaza, asli log nahi):\n' + percentages.map((p, i) => `${letters[i]}: ${p}%`).join('\n'));
        }

        function kbcPhone() {
            if (!kbcState || kbcState.usedPhone) return;
            kbcState.usedPhone = true;
            document.getElementById('lifePhone').disabled = true;
            const q = kbcData[kbcState.qIndex];

            const correct = q[5];
            let guess = correct;
            if (Math.random() > 0.7) guess = [0,1,2,3].filter(i => i !== correct)[Math.floor(Math.random()*3)];
            alert(`📞 Saathi ka mashwara (andaza, pakka nahi):\n"Mujhe lagta hai ${letters[guess]} — ${q[guess+1]} sahi hai"`);
        }

        function kbcFinish(win, quit) {
            const earned = win ? PRIZES[PRIZES.length-1] : (quit ? kbcState.currentPrize : (kbcState.qIndex >= 5 ? PRIZES[4] : 0));
            const cur = kbcDayIdx + 1;

            if (win) celebrate('MashaAllah! 🎉', `Day ${cur} mukammal! ⭐ ${earned} stars jeete.`);
            document.getElementById('kbc').innerHTML = `

            {"q":"Hazrat Abu Bakr (RA) ka laqab kya tha?","o":["Siddiq","Farooq","Zul Noorain","Saifullah"],"c":0,"name":"Hazrat Abu Bakr Siddiq (RA)","story":"Hazrat Abu Bakr (RA) Islam ke pehle Khalifa the. 'Siddiq' ka laqab unhe Meraj ki tasdeeq karne ki wajah se mila. Nabi ﷺ ne farmaya: 'Agar main kisi ko Khalil banata to Abu Bakr ko banata.' Wo Nabi ﷺ ke sabse qareebi sathi the aur gufa-e-Saur mein saath the."},
            {"q":"Hazrat Umar (RA) ka laqab kya tha?","o":["Siddiq","Farooq","Zul Noorain","Saifullah"],"c":1,"name":"Hazrat Umar Farooq (RA)","story":"Hazrat Umar (RA) Islam ke doosre Khalifa the. 'Farooq' ka matlab haq aur batil mein farq karne wala. Unke daur mein Islami saltanat Misr, Sham, Iraq tak phaili. Unhe 'Ameer-ul-Mu'mineen' kaha jata hai. Unki adalat ka qissa aaj bhi mashhoor hai."},
            {"q":"Hazrat Uthman (RA) ka laqab kya tha?","o":["Siddiq","Farooq","Zul Noorain","Saifullah"],"c":2,"name":"Hazrat Uthman Ghani (RA)","story":"Hazrat Uthman (RA) ko 'Zul Noorain' kaha jata hai kyunki unki nikah Nabi ﷺ ki do betiyon se hua. Unke daur mein Quran ko ek qirat par jama kiya gaya - aaj jo Quran hum padhte hain, wo unhi ki khidmat hai. 'Ghani' ka matlab sakhawat wale - unhone apna saara maal Allah ki raah mein diya."},
            {"q":"Hazrat Ali (RA) ka laqab kya tha?","o":["Siddiq","Farooq","Zul Noorain","Sher-e-Khuda"],"c":3,"name":"Hazrat Ali (RA)","story":"Hazrat Ali (RA) Nabi ﷺ ke chacha-zad bhai aur damaad the. Pehli umar ke islam lane wale bachche. 'Sher-e-Khuda' ka laqab unhe Jang-e-Khandaq mein Amr bin Abd Wudd ko qatal karne par mila. Unki ilm ki gehrai mashhoor hai."},
            {"q":"Pehli shaheeda aurat kaun thi?","o":["Khadija (RA)","Sumayya (RA)","Aisha (RA)","Fatima (RA)"],"c":1,"name":"Hazrat Sumayya (RA)","story":"Islam ki pehli shaheeda aurat. Hazrat Ammar bin Yasir (RA) ki walida. Abu Jahl ne sakht azab diya, phir bhi 'Ahad, Ahad' kehti rahi."},
            {"q":"Hazrat Bilal (RA) ko kis ne azad kiya?","o":["Umar (RA)","Abu Bakr (RA)","Uthman (RA)","Hamza (RA)"],"c":1,"name":"Hazrat Bilal Habshi (RA)","story":"Hazrat Bilal (RA) Habshi (Abyssinian) ghulam the. Unke maalik Umayya bin Khalaf unhe garam ret par lita kar azab deta tha - phir bhi wo 'Ahad, Ahad' (Ek Allah) kehta rehta. Hazrat Abu Bakr (RA) ne unhe khareed kar azad kiya. Nabi ﷺ ne unhe pehla Muazzin banaya - unki azan ki aawaz Madinah mein goonjti thi."},
            {"q":"Hazrat Hamza (RA) kis jang mein shaheed hue?","o":["Badr","Uhud","Khandaq","Khyber"],"c":1,"name":"Hazrat Hamza (RA)","story":"Hazrat Hamza (RA) Nabi ﷺ ke chacha aur 'Syed-ush-Shuhada' (shuhada ke sardaar) hain. Wo Islam laane mein thodi der kiye the lekin jab laaye toh poore jaan se. Jang-e-Uhud mein Wahshi (Habshi) ne unhe shaheed kiya - jo baad mein musalman hua aur kehta tha 'Main ne sabse behtar insaan ko qatal kiya'."},
            {"q":"Hazrat Khalid bin Waleed (RA) ka laqab kya tha?","o":["Saifullah","Siddiq","Farooq","Zul Janahain"],"c":0,"name":"Hazrat Khalid bin Waleed (RA)","story":"Hazrat Khalid bin Waleed (RA) ko 'Saifullah' (Allah ki talwar) kaha jata hai. Pehle wo Islam ke khilaf larte the, phir Islam laaye aur Nabi ﷺ ne unhe 'Saifullah' kaha. Unhone 100+ jangon mein hissa liya aur kabhi shikast nahi khayi. Unka wisaal Homs (Syria) mein hua."},
            {"q":"Hazrat Zubair bin Awwam (RA) ka laqab kya tha?","o":["Hawari","Siddiq","Farooq","Saifullah"],"c":0,"name":"Hazrat Zubair bin Awwam (RA)","story":"Hazrat Zubair (RA) Nabi ﷺ ke 'Hawari' (khaas saathi) the. Wo Islam laane wale pehle 5 logon mein se hain. Asharah Mubasharah mein shamil. Unhone Badr, Uhud, Khandaq sab jangon mein hissa liya. Jang-e-Jamal mein shaheed hue."},
            {"q":"Hazrat Talha bin Ubaidullah (RA) ne kis jang mein Nabi ﷺ ko bachaya?","o":["Badr","Uhud","Khandaq","Khyber"],"c":1,"name":"Hazrat Talha (RA)","story":"Jang-e-Uhud mein jab mushrikeen ne hamla kiya, Hazrat Talha (RA) ne apna jism Nabi ﷺ ki hifazat ke liye dhaal bana liya. Unke jism par 70+ zakhm aaye aur unka haath bhi kat gaya. Nabi ﷺ ne farmaya: 'Jannat Talha par wajib hai.' Wo bhi Asharah Mubasharah mein hain."},
            {"q":"Hazrat Saad bin Abi Waqqas (RA) ki dua kis liye mashhoor thi?","o":["Qabool hona","Rizq","Shifa","Ilm"],"c":0,"name":"Hazrat Saad bin Abi Waqqas (RA)","story":"Hazrat Saad (RA) un logon mein se hain jinki dua radd nahi hoti. Nabi ﷺ ne unke liye dua ki: 'Ya Allah, Saad ki dua qubool farma.' Wo Fatah Iraq ke commander the. Unke daur mein Madain (Persian capital) fatah hua."},
            {"q":"Hazrat Salman Farsi (RA) ka taluq kis mulk se tha?","o":["Iran","Arab","Rome","Egypt"],"c":0,"name":"Hazrat Salman Farsi (RA)","story":"Hazrat Salman (RA) Iran ke Isfahan ke the. Unhone haq ki talash mein Rome, Sham, aur Arab tak safar kiya. Aakhri mein Madinah pooche aur Nabi ﷺ ko pehchan kar musalman hue. Jang-e-Khandaq mein unhi ki tajweez par khandaq khodi gayi. Nabi ﷺ ne farmaya: 'Salman hamare ahl-e-bait mein se hai.'"},
            {"q":"Hazrat Abu Hurayrah (RA) ka asal naam kya tha?","o":["Abdur Rahman","Abdullah","Yasir","Zaid"],"c":0,"name":"Hazrat Abu Hurayrah (RA)","story":"Asal naam Abdur Rahman. Sabse zyada hadees riwayat karne wale — 5374 hadees. Sirf 4 saal Nabi ﷺ ke saath, lekin ilm mein sabse aage."},
            {"q":"Nabi ﷺ ke kitne bachche the?","o":["4","5","6","7"],"c":3,"name":"Aulad-e-Nabi ﷺ","story":"Nabi ﷺ ke 7 bachche the - 3 bete (Qasim, Abdullah, Ibrahim) aur 4 betiyan (Zainab, Ruqayya, Umm-e-Kulthum, Fatima). Sabse choti Hazrat Fatima (RA) thin. Ibrahim ki walida Hazrat Maria Qibtiya (RA) thin, baqi sab Hazrat Khadija (RA) se. Sabhi bachche Nabi ﷺ ki zindagi mein inteqal kar gaye siwaye Hazrat Fatima (RA) ke."},
            {"q":"Hazrat Fatima (RA) ke shauhar kaun the?","o":["Abu Bakr (RA)","Umar (RA)","Ali (RA)","Uthman (RA)"],"c":2,"name":"Hazrat Fatima (RA)","story":"Hazrat Fatima (RA) Nabi ﷺ ki sabse choti beti aur 'Syedatun-nisa-e-Aalameen' (sab aurton ki sardaar) hain. Unki shadi Hazrat Ali (RA) se hui. Unke bete Hassan (RA) aur Hussain (RA) jannat ke jawaanon ke sardar hain. Nabi ﷺ ne farmaya: 'Fatima mere jigar ka tukda hai.'"},
            {"q":"Hazrat Hassan (RA) aur Hussain (RA) ke walid kaun the?","o":["Abu Bakr (RA)","Umar (RA)","Ali (RA)","Uthman (RA)"],"c":2,"name":"Hazrat Hassan aur Hussain (RA)","story":"Nabi ﷺ ke nawaase. Hussain (RA) Karbala mein shaheed. Hassan (RA) ne khilafat chhod di — 'Aam-ul-Jamaat'."},
            {"q":"Hazrat Aisha (RA) ke walid kaun the?","o":["Umar (RA)","Abu Bakr (RA)","Uthman (RA)","Ali (RA)"],"c":1,"name":"Hazrat Aisha Siddiqa (RA)","story":"Abu Bakr (RA) ki beti, Ummul Mu'mineen. 2210 hadees riwayat. Islam ki sabse badi aalima. Surah Nur mein pakizgi ka zikr."},
            {"q":"Hazrat Khadija (RA) ka taluq kis qabeelay se tha?","o":["Banu Hashim","Banu Umayya","Banu Asad","Banu Tameem"],"c":2,"name":"Hazrat Khadija (RA)","story":"Hazrat Khadija (RA) 'Tahira' ke laqab se mashhoor thin. Wo Makkah ki mashhoor tajir (businesswoman) thin. Unhone Nabi ﷺ ko apna maal aur dil dono diye. Pehli Wahy ke waqt unhi ne Nabi ﷺ ko tasalli di - 'Allah aapko kabhi ruswa nahi karega.' Unka wisaal 10th Nabuwat mein hua - us saal ko 'Aam-ul-Huzn' (gham ka saal) kaha jata hai."},
            {"q":"Hazrat Zaid bin Haritha (RA) kis rishte se Nabi ﷺ ke sath the?","o":["Muta bhai","Chacha","Beta (adopted)","Sahabi"],"c":2,"name":"Hazrat Zaid bin Haritha (RA)","story":"Hazrat Zaid (RA) Nabi ﷺ ke godh lene wale bete (muta-banna) the. Wo pehle ghulam the, Hazrat Khadija (RA) ne unhe khareed kar Nabi ﷺ ko diya to aap ﷺ ne azad kar diya. Jab unke walid aaye unhe lene, to Hazrat Zaid ne Nabi ﷺ ke sath rehna pasand kiya. Wo pehle sahaba mein se hain jinka naam Quran mein aaya (Surah Ahzab)."},
            {"q":"Hazrat Mu'adh bin Jabal (RA) ko kis mulk ka qazi bana kar bheja?","o":["Yemen","Sham","Iraq","Egypt"],"c":0,"name":"Hazrat Mu'adh bin Jabal (RA)","story":"Ilm aur fiqh mein mashhoor. Yemen ka qazi. Nabi ﷺ: 'Aye Mu'adh, logon ko aasan karo, mushkil na karo; khushkhabri do, nafrat na dilao.'"},
            {"q":"Hazrat Abu Ubaidah bin Jarrah (RA) ka laqab kya tha?","o":["Amin-ul-Ummat","Saifullah","Siddiq","Farooq"],"c":0,"name":"Hazrat Abu Ubaidah (RA)","story":"Hazrat Abu Ubaidah (RA) ko 'Amin-ul-Ummat' (ummah ke amaanatdaar) kaha jata hai. Nabi ﷺ ne unhe 'Asharah Mubasharah' mein shumar kiya. Wo Fatah-e-Sham ke commander the. Syria mein unke daur mein taoon (plague) phaila aur wo bhi shaheed hue. Unki qabr Jordan mein 'Amawas' mein hai."},
            {"q":"Hazrat Hafsa (RA) kis sahaba ki beti thin?","o":["Abu Bakr (RA)","Umar (RA)","Uthman (RA)","Ali (RA)"],"c":1,"name":"Hazrat Hafsa (RA)","story":"Umar (RA) ki beti, Ummul Mu'mineen. Quran ki hifazat mein khaas khidmat — pehli mushaf unke paas rakhi gayi."},
            {"q":"Hazrat Umm-e-Salama (RA) kis sifaat ki wajah se mashhoor thin?","o":["Hikmat","Shujaat","Sakhawat","Ilm"],"c":0,"name":"Hazrat Umm-e-Salama (RA)","story":"Hikmat wali Ummul Mu'mineen. Sulah Hudaibiya ke mauqe par Nabi ﷺ ko mashwara diya jo bahut kaam aaya."},
            {"q":"Hazrat Zainab bint Jahsh (RA) ka nikah kis se hua?","o":["Nabi ﷺ","Abu Bakr (RA)","Umar (RA)","Uthman (RA)"],"c":0,"name":"Hazrat Zainab bint Jahsh (RA)","story":"Ummul Mu'mineen. Pehle Zaid bin Haritha (RA) se nikah — Quran ne iska zikr kiya. Phir Nabi ﷺ se nikah hua. 'Ummul Masakeen' — ghareebon ki maa."},
            {"q":"Hazrat Asma bint Abu Bakr (RA) kis waqia mein mashhoor hain?","o":["Hijrat mein khana laayi","Jang mein ladi","Quran hifz","Tijarat"],"c":0,"name":"Hazrat Asma bint Abu Bakr (RA)","story":"Hijrat ke waqt gufa-e-Saur tak khana aur pani pahunchaya. 'Zaat-un-Nitaqain' — do kamarband wali. Abu Jahl ne pareshan kiya, phir bhi na bataya."},
            {"q":"Hazrat Umm-e-Sulaym (RA) kiska walida thin?","o":["Anas bin Malik (RA)","Bilal (RA)","Hamza (RA)","Salman (RA)"],"c":0,"name":"Hazrat Umm-e-Sulaym (RA)","story":"Anas bin Malik (RA) ki walida. Islam laayi jab pati mana kiya. Bete ko Nabi ﷺ ki khidmat ke liye bheja. Bahut sabr wali."},
            {"q":"Hazrat Nusayba bint Ka'b (RA) kis jang mein mashhoor hain?","o":["Badr","Uhud","Khandaq","Khyber"],"c":1,"name":"Hazrat Nusayba bint Ka'b (RA)","story":"'Umm-e-Umara' — Jang-e-Uhud mein talwar le kar ladi, Nabi ﷺ ko bachaya. Bahadur auraten."},
            {"q":"Hazrat Umm-e-Ayman (RA) kiska khayal rakhti thin?","o":["Nabi ﷺ (bachpan mein)","Abu Bakr (RA)","Umar (RA)","Ali (RA)"],"c":0,"name":"Hazrat Umm-e-Ayman (RA)","story":"Nabi ﷺ ki dada ki ghulam, bachpan mein khayal rakha. 'Meri maa ke baad meri maa' — Nabi ﷺ ne farmaya. Hijrat mein paani laayi."},
            {"q":"Hazrat Abdullah bin Masood (RA) ka kya maqam tha?","o":["Quran ka qari","Jang ke commander","Tajir","Khatib"],"c":0,"name":"Hazrat Abdullah bin Masood (RA)","story":"Quran ke qari, Nabi ﷺ: 'Jis tarah Ibn Masood padhta hai, us tarah padho.' Pehle 6 musalmanon mein se. Kufa ke qazi."},
            {"q":"Hazrat Ubayy bin Ka'b (RA) ka kya kaam tha?","o":["Quran ka katib","Jang ke commander","Muazzin","Qazi"],"c":0,"name":"Hazrat Ubayy bin Ka'b (RA)","story":"Quran ke katib (Wahy likhne wale). Nabi ﷺ: 'Ubayy Quran ka sabse aalim hai.' Quran ki tilawat ka hukm unse seekha."},
            {"q":"Hazrat Zaid bin Thabit (RA) ne kya bada kaam kiya?","o":["Quran jama kiya","Fatah Misr","Jang-e-Badr","Tijarat"],"c":0,"name":"Hazrat Zaid bin Thabit (RA)","story":"Wahy katib. Quran ko Abu Bakr (RA) ke daur mein jama kiya aur Uthman (RA) ke daur mein ek qirat par. 'Quran ka katib-e-azam'."},
            {"q":"Hazrat Abdullah bin Umar (RA) kiske bete the?","o":["Abu Bakr (RA)","Umar (RA)","Uthman (RA)","Ali (RA)"],"c":1,"name":"Hazrat Abdullah bin Umar (RA)","story":"Umar (RA) ke bete. Bahut zyada Sunnat ki pabandi. 2630 hadees riwayat. Nabi ﷺ ke baad unke qadmon par chalte."},
            {"q":"Hazrat Abdullah bin Abbas (RA) kis ilm mein mashhoor the?","o":["Tafsir","Hadith","Fiqh","Tijarat"],"c":0,"name":"Hazrat Abdullah bin Abbas (RA)","story":"Tafsir ke imam, 'Tarjuman-ul-Quran'. Nabi ﷺ ne dua ki: 'Ya Allah, isko deen ki samajh de.' Bahut zyada dua karte the."},
            {"q":"Hazrat Anas bin Malik (RA) ne kitne saal Nabi ﷺ ki khidmat ki?","o":["5","10","15","20"],"c":1,"name":"Hazrat Anas bin Malik (RA)","story":"10 saal Nabi ﷺ ki khidmat. Unki walida Umm-e-Sulaym (RA) ne bheja. Nabi ﷺ ne dua di. 100+ umar pai, 2286 hadees riwayat."},
            {"q":"Hazrat Abu Darda (RA) kis sifaat ke liye mashhoor the?","o":["Hikmat","Shujaat","Sakhawat","Jang"],"c":0,"name":"Hazrat Abu Darda (RA)","story":"'Hakeem-ul-Ummat' — ummat ke aalim. Qazi in Damascus. Tijarat chhod kar ibadat aur ilm par lag gaye. Unki biwi Umm-e-Darda bhi aalima thin."},
            {"q":"Hazrat Ammar bin Yasir (RA) kis waqia mein mashhoor hain?","o":["Pehli shaheeda ki bete","Jang ke commander","Tijarat","Quran hifz"],"c":0,"name":"Hazrat Ammar bin Yasir (RA)","story":"Sumayya (RA) ke bete — pehli shaheeda ke. Khud bhi azab saha. Jang-e-Siffin mein shaheed. Nabi ﷺ: 'Ammar ko baghawat karne wala giroh qatal karega.'"},
            {"q":"Hazrat Suhaib Rumi (RA) kahan ke the?","o":["Rome","Arab","Iran","Egypt"],"c":0,"name":"Hazrat Suhaib Rumi (RA)","story":"'Rumi' — Rome (Byzantine) ke. Ghulam bane, phir azad. Hijrat ke waqt apna saara maal chhod kar gaye. 'Tijarat mein sabse aage.'"},
            {"q":"Hazrat Abdullah bin Salam (RA) kis deen ke aalim the?","o":["Yahudi","Nasrani","Majusi","Hindu"],"c":0,"name":"Hazrat Abdullah bin Salam (RA)","story":"Yahudi aalim. Nabi ﷺ ko pehchan kar Islam laaye. Nabi ﷺ ne farmaya: 'Abdullah bin Salam jannat mein hai.'"},
            {"q":"Hazrat Hassan bin Thabit (RA) ka kya kirdar tha?","o":["Shayar","Jang","Tijarat","Qazi"],"c":0,"name":"Hazrat Hassan bin Thabit (RA)","story":"Nabi ﷺ ke shayar. Islam ki shaan mein kalam likhte. Nabi ﷺ ne farmaya: 'Hassan ke liye ruh-ul-qudus (Jibreel) madad karta hai.'"},
            {"q":"Hazrat Ka'ab bin Malik (RA) kis liye mashhoor hain?","o":["Shayar aur taubah ki hadees","Jang","Tijarat","Qazi"],"c":0,"name":"Hazrat Ka'ab bin Malik (RA)","story":"Shayar aur Jang-e-Tabuk mein peeche reh gaye. Nabi ﷺ ne 50 din tak inka boycott kiya. Phir taubah qubool hui — Surah Tawbah mein zikr."},
            {"q":"Hazrat Hakeem bin Hizam (RA) kis ke bhatije the?","o":["Khadija (RA)","Aisha (RA)","Umar (RA)","Abu Bakr (RA)"],"c":0,"name":"Hazrat Hakeem bin Hizam (RA)","story":"Khadija (RA) ke bhatije. Islam se pehle bhi sach bolte. Fatah Makkah ke din Islam laaye. Nabi ﷺ ne farmaya: 'Tum pehle bhi achhe kaam karte the.'"},
            {"q":"Hazrat Abu Ayyub Ansari (RA) kis waqia mein mashhoor hain?","o":["Nabi ﷺ ka mehman","Jang","Tijarat","Qazi"],"c":0,"name":"Hazrat Abu Ayyub Ansari (RA)","story":"Hijrat ke waqt Nabi ﷺ unke ghar mein 7 mahine thehre. Madinah mein Nabi ﷺ ka pehla qayam unhi ke ghar mein. Sakhi aur muhajir ke madadgar."},
            {"q":"Hazrat Saad bin Mu'adh (RA) kis qabeelay ke sardar the?","o":["Ansaar (Banu Aus)","Muhajireen","Quraish","Banu Umayya"],"c":0,"name":"Hazrat Saad bin Mu'adh (RA)","story":"Ansaar ke sardar. Islam laaye to apne qabeelay ko bhi bulaya. Jang-e-Khandaq mein shaheed. Nabi ﷺ: 'Arsh unke janaze par larza mein aaya.'"},
            {"q":"Hazrat Amr bin Al-Aas (RA) ne kis mulk ko fatah kiya?","o":["Misr (Egypt)","Iraq","Sham","Yemen"],"c":0,"name":"Hazrat Amr bin Al-Aas (RA)","story":"Fatah Misr ke commander. Pehle Islam ke mukhalif, phir musalman. Umar (RA) ne unhe Misr ka governor banaya. Bahut hikmat wale."},
            {"q":"Hazrat Jafar Tayyar (RA) ka laqab kis liye mila?","o":["Jang-e-Mutah mein haath katne par","Hijrat","Tijarat","Quran hifz"],"c":0,"name":"Hazrat Jafar Tayyar (RA)","story":"Ali (RA) ke bhai. Jang-e-Mutah mein dono haath kat gaye, phir bhi parcham uthaye rakha. 'Tayyar' — udne wala farishta."},
            {"q":"Hazrat Abdullah bin Rawahah (RA) kis jang mein shaheed hue?","o":["Badr","Mutah","Uhud","Khandaq"],"c":1,"name":"Hazrat Abdullah bin Rawahah (RA)","story":"Jang-e-Mutah ke teen commanders mein se ek. Shaheed hone se pehle shair padha. Bahadur aur dilair."},
            {"q":"Hazrat Khubayb bin Adi (RA) kis waqia mein mashhoor hain?","o":["Bir Mauna ke shaheed","Badr","Uhud","Khandaq"],"c":0,"name":"Hazrat Khubayb (RA)","story":"Bir Mauna ke shaheed. Makkah walon ne pakad kar sooli par latkaya. Do rakat namaz padhi — namaz padhne ki sunnat ban gayi."},
            {"q":"Hazrat Adi bin Hatim (RA) kis ke bete the?","o":["Hatim Tai","Abu Jahl","Abu Lahab","Abu Sufyan"],"c":0,"name":"Hazrat Adi bin Hatim (RA)","story":"Sakhi Hatim Tai ke bete. Pehle Nasrani, phir Islam laaye. Nabi ﷺ: 'Tumhare walid sakhi the, isliye unka naam baqa hai.'"},
            {"q":"Hazrat Thumama bin Uthal (RA) kis qabeelay ke sardar the?","o":["Banu Hanifa","Quraish","Banu Aus","Banu Khazraj"],"c":0,"name":"Hazrat Thumama bin Uthal (RA)","story":"Yamama ke sardar. Pehle Nabi ﷺ ko qatal karna chahte the. Baad mein pakde gaye, phir Islam laaye. Islam ke sakht paband ban gaye."},
            {"q":"Hazrat Abdullah bin Hudhafa (RA) ko kis badshah ke paas bheja gaya?","o":["Kisra (Iran)","Qaisar (Rome)","Muqawqis (Misr)","Najashi (Habsha)"],"c":0,"name":"Hazrat Abdullah bin Hudhafa (RA)","story":"Kisra (Iran ke badshah) ke paas Nabi ﷺ ka khat le kar gaye. Kisra ne khat phaad diya — uska mulk bhi tukde tukde ho gaya."},
            {"q":"Hazrat Dihya al-Kalbi (RA) ke baare mein kya mashhoor hai?","o":["Jibreel unke roop mein aaye","Jang","Tijarat","Quran hifz"],"c":0,"name":"Hazrat Dihya al-Kalbi (RA)","story":"Bahut khoobsurat. Jibreel (AS) aksar unke roop mein Nabi ﷺ ke paas aate the. Rome ke Qaisar ke paas Nabi ﷺ ka khat le kar gaye."}
        ];

        // ===== SAHABA LOGIC =====
        let sahabaState = null;
        function initSahaba() {
            const picked = [...SAHABA].sort(() => Math.random() - 0.5).slice(0, 20);
            sahabaState = { index: 0, score: 0, questions: picked, answered: false };
            sahabaRender();
        }
        function sahabaRender() {
            if (!sahabaState) return;
            const box = document.getElementById('sahaba');
            if (sahabaState.index >= sahabaState.questions.length) {
                celebrate('Mubarak Ho!', 'Aapne is round ke saare Sahaba sawal mukammal kiye.');
                box.innerHTML = `<div class="sahaba-box" style="text-align:center;"><h2 style="color:var(--primary);">🎉 Mubarak Ho!</h2><p style="margin:15px 0;">Aapne round complete kiya.</p><div class="sahaba-score" style="font-size:18px; padding:10px 20px;">Score: ${sahabaState.score} / ${sahabaState.questions.length}</div><button class="btn-primary" onclick="initSahaba()" style="margin-top:20px;">🔄 Naya Round</button></div>`;
                return;
            }
            const q = sahabaState.questions[sahabaState.index];
            box.innerHTML = `
                <div class="sahaba-box">
                    <div class="sahaba-head">
                        <span style="color:var(--primary); font-weight:bold;">⭐ Sahaba Ki Kahani</span>
                        <span class="sahaba-score">${sahabaState.index + 1} / ${sahabaState.questions.length} • Score: ${sahabaState.score}</span>
                    </div>
                    <div class="sahaba-q">${q.q}</div>
                    <div id="sahabaOpts">${q.o.map((o, i) => `<button class="sahaba-opt" onclick="sahabaAnswer(${i})">${o}</button>`).join('')}</div>
                    <div id="sahabaStoryBox" class="hidden"></div>
                </div>
            `;
            sahabaState.answered = false;
        }
        function sahabaAnswer(sel) {
            if (sahabaState.answered) return;
            sahabaState.answered = true;
            const q = sahabaState.questions[sahabaState.index];
            const opts = document.querySelectorAll('#sahabaOpts .sahaba-opt');
            opts.forEach(o => o.disabled = true);
            if (sel === q.c) { opts[sel].classList.add('correct'); sahabaState.score++; }

        let memoryState = null;
        function initMemory() {
            const picked = [...MEMORY_PAIRS].sort(() => Math.random() - 0.5).slice(0, 8);
            const cards = [];
            picked.forEach((p, i) => {
                cards.push({ id: i, type: 'ar', text: p[0] });
                cards.push({ id: i, type: 'ur', text: p[1] });
            });
            const shuffled = cards.sort(() => Math.random() - 0.5);
            memoryState = { cards: shuffled, flipped: [], matched: 0, moves: 0, locked: false, totalPairs: picked.length };
            memoryRender();
        }
        function memoryRender() {
            const box = document.getElementById('memory');
            if (memoryState.matched === memoryState.totalPairs) {
                setTimeout(() => {
                    celebrate('Shabash!', 'Saare cards match ho gaye.');
                    box.innerHTML = `<div class="memory-box" style="text-align:center;"><h2 style="color:var(--primary);">🎉 Sab Match Ho Gaye!</h2><p style="margin:15px 0;">Total Moves: ${memoryState.moves}</p><button class="btn-primary" onclick="initMemory()">🔄 Naya Round</button></div>`;
                }, 500);
                return;
            }
            box.innerHTML = `
                <div class="memory-box">
                    <div class="memory-info">
                        <span>✅ Matched: ${memoryState.matched} / ${memoryState.totalPairs}</span>
                        <span>🎯 Moves: ${memoryState.moves}</span>
                    </div>
                    <div class="memory-grid" id="memGrid"></div>
                </div>
            `;
            const grid = document.getElementById('memGrid');
            memoryState.cards.forEach((card, idx) => {
                const div = document.createElement('div');
                div.className = 'mem-card';
                if (card.matched) div.classList.add('matched');
                else if (memoryState.flipped.includes(idx)) div.classList.add('flipped');
                if (memoryState.flipped.includes(idx) || card.matched) {
                    div.innerHTML = `<span class="${card.type === 'ar' ? 'ar' : 'ur'}">${card.text}</span>`;
                }
                div.onclick = () => memoryFlip(idx);
                grid.appendChild(div);
            });
        }
        function memoryFlip(idx) {
            if (memoryState.locked) return;
            const card = memoryState.cards[idx];
            if (card.matched || memoryState.flipped.includes(idx)) return;
            if (memoryState.flipped.length === 2) return;
            memoryState.flipped.push(idx);
            if (memoryState.flipped.length === 2) {
                memoryState.moves++;
                memoryState.locked = true;
                const [a, b] = memoryState.flipped;
                const ca = memoryState.cards[a], cb = memoryState.cards[b];
                if (ca.id === cb.id && ca.type !== cb.type) {
                    setTimeout(() => {
                        ca.matched = true; cb.matched = true;
                        memoryState.matched++;
                        memoryState.flipped = [];
                        memoryState.locked = false;
                        memoryRender();
                    }, 400);
                } else {
                    setTimeout(() => {
                        memoryState.flipped = [];
                        memoryState.locked = false;
                        memoryRender();
                    }, 900);
                }
            }
            memoryRender();
        }

            { emoji: "🕋🕋", q: "Makkah mein kitni badi masjidein hain?", o: ["1 (Masjid-e-Haram)", "2", "3", "4"], c: 0 },
            { emoji: "🕌🕌🕌", q: "Masjid-e-Aqsa kahan hai?", o: ["Jerusalem", "Makkah", "Madinah", "Taif"], c: 0 },
            { emoji: "👨‍🏫📖", q: "Deen seekhne ke liye kis ke paas baithna chahiye?", o: ["Aalim", "Tajir", "Sipahi", "Kisi bhi"], c: 0 },
            { emoji: "💯📖", q: "Quran ki sabse fazilat wali Surah kaun si hai?", o: ["Al-Fatiha", "Al-Baqarah", "Al-Ikhlas", "An-Nas"], c: 0 },
            { emoji: "🌙💤", q: "Sone se pehle kya padhna chahiye?", o: ["Dua aur Ayatul Kursi", "Naat", "Kahani", "Kuch nahi"], c: 0 },
            { emoji: "🤲🌅", q: "Subah uthne ke baad pehli dua?", o: ["Alhamdulillah", "Bismillah", "Subhanallah", "Allahu Akbar"], c: 0 },
            { emoji: "🧕🕌", q: "Aurton ki namaz ka kya hukm hai?", o: ["Farz", "Sunnat", "Mustahab", "Jaiz nahi"], c: 0 }
        ];

        let emojiState = null;
        function initEmoji() {
            const picked = [...EMOJI_DATA].sort(() => Math.random() - 0.5).slice(0, 20).map(q => {
                const idx = q.o.map((_, k) => k).sort(() => Math.random() - 0.5);
                return { emoji: q.emoji, q: q.q, o: idx.map(k => q.o[k]), c: idx.indexOf(q.c) };
            });
            emojiState = { questions: picked, index: 0, score: 0, answered: false };
            emojiRender();
        }
        function emojiRender() {
            if (!emojiState) return;
            const box = document.getElementById('emoji');
            if (emojiState.index >= emojiState.questions.length) {
                const sc = emojiState.score, tot = emojiState.questions.length, good = sc >= Math.ceil(tot * 0.6);
                if (good) celebrate(sc === tot ? 'Mashaallah! Full Marks!' : 'Mubarak Ho!', `Aap ne ${tot} mein se ${sc} sahi bataye.`);
                const stars = sc === tot ? '🌟🌟🌟' : (good ? '🌟🌟' : '🌟');
                box.innerHTML = `<div class="emoji-box"><h2 style="color:var(--primary);">${good ? '🎉 Mubarak Ho!' : '💪 Achi Koshish!'}</h2><div class="emoji-display">${good ? '🏆' : '📚'}</div><div style="font-size:30px;">${stars}</div><p style="margin:15px 0;">${good ? 'Bahut khoob!' : 'Thodi aur mashq karein, agli baar behtar hoga.'}</p><div class="emoji-score" style="font-size:18px; padding:10px 20px;">Score: ${sc} / ${tot}</div><button class="btn-primary" onclick="initEmoji()" style="margin-top:20px;">🔄 Naya Round</button></div>`;
                return;
            }
            const q = emojiState.questions[emojiState.index];
            box.innerHTML = `
                <div class="emoji-box">
                    <div class="emoji-score">${emojiState.index + 1} / ${emojiState.questions.length} • Score: ${emojiState.score}</div>
                    <div class="emoji-display">${q.emoji}</div>
                    <div class="emoji-question">${q.q}</div>
                    <div id="emojiOpts">${q.o.map((o, i) => `<button class="emoji-opt" onclick="emojiAnswer(${i})">${o}</button>`).join('')}</div>
                </div>
            `;
            emojiState.answered = false;
        }
        function emojiAnswer(sel) {
            if (emojiState.answered) return;
            emojiState.answered = true;
            const q = emojiState.questions[emojiState.index];
            const opts = document.querySelectorAll('#emojiOpts .emoji-opt');
            opts.forEach(o => o.disabled = true);
            if (sel === q.c) { opts[sel].classList.add('correct'); emojiState.score++; }
            else { opts[sel].classList.add('wrong'); opts[q.c].classList.add('correct'); }
            setTimeout(() => { emojiState.index++; emojiRender(); }, 1200);
        }

        // Start with Maratib-e-Ilm
        initKBC();
    </script>
</body>
</html>
