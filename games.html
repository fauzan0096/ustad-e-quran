<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - Quraan Ustad</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <script src="ui.js"></script>
    <meta name="theme-color" content="#0F4C3A">
    <script src="install.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0F4C3A; --secondary: #D4AF37; --bg: #F4F7F6; --card-bg: #fff; --text: #333; --text-light: #666; --border: #ddd; --kbc-bg: #0a0e1a; --kbc-gold: #f5c518; --kbc-blue: #0c1e3c; }
        [data-theme="dark"] { --primary: #1a1a2e; --secondary: #6ee7b7; --bg: #0f0f23; --card-bg: #1e1e36; --text: #eee; --text-light: #aaa; --border: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 30px; }
        header { background: linear-gradient(135deg, #0F4C3A 0%, #17695171 60%, #0F4C3A 100%); color: white; padding: 15px; border-bottom: 3px solid var(--secondary); text-align: center; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: white; }
        .main-nav { display: flex; justify-content: flex-start; overflow-x: auto; gap: 10px; margin: 15px auto; padding: 0 15px; max-width: 1200px; scrollbar-width: none; }
        .main-nav::-webkit-scrollbar { display: none; }
        .nav-btn { padding: 10px 16px; border: none; border-radius: 20px; font-size: 13px; font-weight: 600; background: var(--card-bg); color: var(--text); box-shadow: 0 3px 10px rgba(0,0,0,0.1); cursor: pointer; white-space: nowrap; }
        .nav-btn.active { background: var(--primary); color: #fff; }
        .container { max-width: 800px; margin: 0 auto; padding: 0 15px; }
        .game-section { display: none; }
        .game-section.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }
        

        /* ============ JEET CELEBRATION ============ */
        .cele-layer { position: fixed; inset: 0; pointer-events: none; z-index: 99998; overflow: hidden; }
        .cele-conf { position: absolute; top: -20px; width: 10px; height: 14px; opacity: .95; animation: celeFall linear forwards; }
        @keyframes celeFall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }
        .cele-balloon { position: absolute; bottom: -80px; font-size: 44px; animation: celeRise ease-in forwards; }
        @keyframes celeRise { to { transform: translateY(-115vh) translateX(var(--dx)); } }
        .cele-pop { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); }
        .cele-card { background: linear-gradient(135deg,#0F4C3A,#14735a); color: #fff; border: 3px solid #D4AF37; border-radius: 22px; padding: 26px 30px; text-align: center; max-width: 85%; box-shadow: 0 15px 50px rgba(0,0,0,.5); animation: celePop .5s cubic-bezier(.2,1.6,.4,1); }
        .cele-card .big { font-size: 56px; }
        .cele-card h2 { color: #f5c518; margin: 8px 0; font-size: 26px; }
        .cele-card p { font-size: 15px; margin-bottom: 14px; }
        .cele-card button { background: #D4AF37; color: #000; border: none; padding: 10px 26px; border-radius: 22px; font-weight: bold; font-size: 15px; cursor: pointer; }
        @keyframes celePop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* ============ KBC STYLES ============ */
        #kbc { background: var(--kbc-bg); border-radius: 15px; padding: 20px; margin-bottom: 20px; min-height: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
        #kbc::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(245,197,24,0.15), transparent 60%); pointer-events: none; }
        .kbc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; position: relative; z-index: 1; color: var(--kbc-gold); font-weight: bold; font-size: 13px; }
        .kbc-day { background: rgba(245,197,24,0.2); padding: 5px 12px; border-radius: 15px; }
        .kbc-prize { background: rgba(245,197,24,0.2); padding: 5px 12px; border-radius: 15px; }
        .kbc-qnum { text-align: center; color: #aaa; font-size: 12px; margin-bottom: 10px; position: relative; z-index: 1; }
        .kbc-question { color: #fff; font-size: 17px; font-weight: 600; text-align: center; padding: 20px 15px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid rgba(245,197,24,0.3); margin-bottom: 20px; min-height: 80px; display: flex; align-items: center; justify-content: center; line-height: 1.5; position: relative; z-index: 1; }
        .kbc-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; z-index: 1; }
        .kbc-opt { background: linear-gradient(135deg, #1a2a4a, #0c1e3c); color: #fff; border: 2px solid #2a4a7a; padding: 12px 10px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; display: flex; gap: 8px; align-items: center; }
        .kbc-opt b { color: var(--kbc-gold); font-weight: bold; }
        .kbc-opt.correct { background: linear-gradient(135deg, #1a5c2a, #0c3c1a); border-color: #2ea14a; }
        .kbc-opt.wrong { background: linear-gradient(135deg, #5c1a1a, #3c0c0c); border-color: #a12e2e; }
        .kbc-opt.disabled { opacity: 0.4; cursor: not-allowed; }
        .kbc-lifelines { display: flex; justify-content: center; gap: 10px; margin-top: 15px; position: relative; z-index: 1; }
        .kbc-life { background: rgba(245,197,24,0.15); color: var(--kbc-gold); border: 1px solid var(--kbc-gold); padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .kbc-life:disabled { opacity: 0.3; cursor: not-allowed; }
        .kbc-result { text-align: center; padding: 25px 15px; color: #fff; position: relative; z-index: 1; }
        .kbc-result h2 { color: var(--kbc-gold); margin-bottom: 15px; font-size: 22px; }
        .kbc-result .prize { font-size: 28px; color: #4ade80; font-weight: bold; margin: 15px 0; }
        .kbc-btn { background: linear-gradient(135deg, var(--kbc-gold), #c9a012); color: #000; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .kbc-ladder { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 20px; position: relative; z-index: 1; }
        .kbc-ladder span { background: rgba(255,255,255,0.08); color: #aaa; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .kbc-ladder span.active { background: var(--kbc-gold); color: #000; }
        .kbc-ladder span.safe { border: 1px solid var(--kbc-gold); color: var(--kbc-gold); }

        /* ============ SAHABA STYLES ============ */
        .sahaba-box { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 4px solid var(--secondary); }
        .sahaba-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sahaba-score { background: var(--secondary); color: #000; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .sahaba-q { font-size: 16px; font-weight: 600; margin-bottom: 15px; color: var(--text); }
        .sahaba-opt { width: 100%; padding: 12px 15px; margin-bottom: 8px; border: 2px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; }
        .sahaba-opt:hover { border-color: var(--primary); }
        .sahaba-opt.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .sahaba-opt.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .sahaba-story { background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05)); border: 1px solid var(--secondary); border-radius: 12px; padding: 15px; margin-top: 15px; }
        .sahaba-story h3 { color: var(--primary); margin-bottom: 8px; font-size: 15px; }
        .sahaba-story p { font-size: 13px; line-height: 1.6; color: var(--text); }
        .btn-primary { background: var(--primary); color: #fff; border: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 12px; width: 100%; }
        .btn-gold { background: var(--secondary); color: #000; }

        /* ============ MEMORY STYLES ============ */
        .memory-box { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
        .memory-info { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 13px; font-weight: bold; }
        .memory-info span { background: var(--secondary); color: #000; padding: 5px 12px; border-radius: 15px; }
        .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .mem-card { aspect-ratio: 1; background: linear-gradient(135deg, #0F4C3A, #1a7a5c); border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: transparent; user-select: none; position: relative; transition: all 0.3s; }
        .mem-card::before { content: "؟"; color: #D4AF37; font-size: 24px; position: absolute; }
        .mem-card.flipped { background: var(--card-bg); border: 2px solid var(--secondary); color: var(--text); }
        .mem-card.flipped::before { content: none; }
        .mem-card.matched { background: #d4edda; border: 2px solid #28a745; color: #155724; cursor: default; }
        .mem-card.matched::before { content: "✓"; color: #28a745; font-size: 20px; }
        .mem-card .ar { font-family: 'Amiri', serif; font-size: 18px; direction: rtl; }
        .mem-card .ur { font-family: 'Noto Nastaliq Urdu', serif; font-size: 13px; direction: rtl; }

        /* ============ EMOJI STYLES ============ */
        .emoji-box { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; border-top: 4px solid var(--secondary); }
        .emoji-display { font-size: 60px; line-height: 1.4; margin: 20px 0; padding: 20px; background: var(--bg); border-radius: 15px; }
        .emoji-score { display: inline-block; background: var(--secondary); color: #000; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        .emoji-question { font-size: 15px; font-weight: 600; margin-bottom: 15px; }
        .emoji-opt { width: 100%; padding: 12px 15px; margin-bottom: 8px; border: 2px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; cursor: pointer; text-align: center; font-size: 14px; font-weight: 500; }
        .emoji-opt.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .emoji-opt.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>🎮 Games</h1>
            <div>
                <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
                <a href="index.html" style="color:white; text-decoration:none; font-size:20px;">🏠</a>
            </div>
        </div>
    </header>
    <div class="main-nav">
        <button class="nav-btn active" onclick="switchGame('kbc', this)">🏆 KBC</button>
        <button class="nav-btn" onclick="switchGame('sahaba', this)">⭐ Sahaba</button>
        <button class="nav-btn" onclick="switchGame('memory', this)">🧠 Memory</button>
        <button class="nav-btn" onclick="switchGame('emoji', this)">😀 Emoji</button>
    </div>
    <div class="container">
        <div id="kbc" class="game-section active"></div>
        <div id="sahaba" class="game-section"></div>
        <div id="memory" class="game-section"></div>
        <div id="emoji" class="game-section"></div>
    </div>

    <script>
        // ==========================================
        // THEME
        // ==========================================
        let isDarkMode = localStorage.getItem('darkMode') === 'true';
        if (isDarkMode) document.body.setAttribute('data-theme', 'dark');
        function toggleTheme() { isDarkMode = !isDarkMode; document.body.setAttribute('data-theme', isDarkMode ? 'dark' : 'light'); document.getElementById('themeBtn').innerText = isDarkMode ? '☀️' : '🌙'; localStorage.setItem('darkMode', isDarkMode); }
        if (isDarkMode) document.getElementById('themeBtn').innerText = '☀️';


        // ==========================================
        // 🎉 JEET CELEBRATION: sound + confetti + ghubare + popup
        // ==========================================
        function celeSound() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                const ctx = new AC();
                const t0 = ctx.currentTime + 0.05;
                const note = (f, t, d, type, vol) => {
                    const o = ctx.createOscillator(), g = ctx.createGain();
                    o.type = type || 'triangle'; o.frequency.value = f;
                    g.gain.setValueAtTime(0.0001, t0 + t);
                    g.gain.exponentialRampToValueAtTime(vol || 0.25, t0 + t + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + d);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(t0 + t); o.stop(t0 + t + d + 0.05);
                };
                // fanfare: C E G C(high) phir chord
                [[523, 0], [659, 0.15], [784, 0.3], [1047, 0.45]].forEach(n => note(n[0], n[1], 0.25));
                [523, 659, 784, 1047].forEach(f => note(f, 0.7, 1.0, 'sine', 0.18));
                // taaliyan (clapping noise bursts)
                const len = ctx.sampleRate * 1.6, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
                for (let i = 0; i < len; i++) {
                    const beat = Math.floor(i / (ctx.sampleRate * 0.09));
                    d[i] = (Math.random() * 2 - 1) * (i % Math.floor(ctx.sampleRate * 0.09) < ctx.sampleRate * 0.02 ? 1 : 0.12) * (beat % 2 ? 0.8 : 1);
                }
                const ns = ctx.createBufferSource(), ng = ctx.createGain(), bp = ctx.createBiquadFilter();
                bp.type = 'bandpass'; bp.frequency.value = 2200;
                ng.gain.setValueAtTime(0.0001, t0 + 0.6); ng.gain.exponentialRampToValueAtTime(0.35, t0 + 0.8); ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.2);
                ns.buffer = buf; ns.connect(bp); bp.connect(ng); ng.connect(ctx.destination); ns.start(t0 + 0.6);
                setTimeout(() => ctx.close && ctx.close(), 3500);
            } catch (e) {}
        }

        function celebrate(title, msg) {
            celeSound();
            const layer = document.createElement('div');
            layer.className = 'cele-layer';
            const colors = ['#f5c518', '#ff4d6d', '#4ade80', '#38bdf8', '#c084fc', '#fb923c'];
            for (let i = 0; i < 90; i++) {
                const c = document.createElement('i');
                c.className = 'cele-conf';
                c.style.left = Math.random() * 100 + '%';
                c.style.background = colors[i % colors.length];
                c.style.animationDuration = (2.2 + Math.random() * 2.2) + 's';
                c.style.animationDelay = (Math.random() * 0.8) + 's';
                c.style.borderRadius = i % 3 ? '2px' : '50%';
                layer.appendChild(c);
            }
            const balloons = ['🎈', '🎈', '🎈', '🎉', '🎊', '✨'];
            for (let i = 0; i < 14; i++) {
                const b = document.createElement('span');
                b.className = 'cele-balloon';
                b.textContent = balloons[i % balloons.length];
                b.style.left = (Math.random() * 90) + '%';
                b.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
                b.style.animationDuration = (3.5 + Math.random() * 2.5) + 's';
                b.style.animationDelay = (Math.random() * 1.2) + 's';
                layer.appendChild(b);
            }
            document.body.appendChild(layer);
            const pop = document.createElement('div');
            pop.className = 'cele-pop';
            pop.innerHTML = `<div class="cele-card"><div class="big">🏆</div><h2>${title || 'Mubarak Ho!'}</h2><p>${msg || 'Aap jeet gaye! Allah aap ko aur ilm de.'}</p><button>Shukriya 🤲</button></div>`;
            const close = () => { pop.remove(); };
            pop.querySelector('button').onclick = close;
            pop.onclick = e => { if (e.target === pop) close(); };
            document.body.appendChild(pop);
            setTimeout(close, 4500);
            setTimeout(() => layer.remove(), 7500);
        }

        function switchGame(game, btn) {
            document.querySelectorAll('.game-section').forEach(v => v.classList.remove('active'));
            document.getElementById(game).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (game === 'kbc' && !document.getElementById('kbc').hasChildNodes()) initKBC();
            else if (game === 'kbc') initKBC();
            else if (game === 'sahaba') initSahaba();
            else if (game === 'memory') initMemory();
            else if (game === 'emoji') initEmoji();
        }

        // ==========================================
        // ===== KBC DATA: 300 QUESTIONS (30 DAYS) =====
        // Format: [question, optA, optB, optC, optD, correctIndex]
        // Day 1-10: Aasaan | Day 11-20: Darmiyani | Day 21-30: Mushkil
        // ==========================================
        const KBC = [
        // ===== DAY 1 (AASAAN) =====
        [
            ["Islam ke kitne arkaan hain?","3","5","7","10",1],
            ["Namaz din mein kitni baar farz hai?","3","4","5","6",2],
            ["Quran kis Nabi par nazil hua?","Musa (AS)","Isa (AS)","Muhammad ﷺ","Ibrahim (AS)",2],
            ["Roza kis mahine mein farz hai?","Ramzan","Shaban","Rajab","Muharram",0],
            ["Qibla kahan hai?","Madinah","Makkah","Jerusalem","Taif",1],
            ["Zakat kitne hisse par farz hai?","1%","2.5%","5%","10%",1],
            ["Pehle Nabi kaun the?","Nuh (AS)","Aadam (AS)","Ibrahim (AS)","Musa (AS)",1],
            ["Fajr ki farz rak'at kitni hain?","2","3","4","5",0],
            ["Quran mein kitni Surah hain?","100","114","120","99",1],
            ["Kaaba kis shehar mein hai?","Madinah","Makkah","Jeddah","Taif",1]
        ],
        // ===== DAY 2 (AASAAN) =====
        [
            ["Quran ki pehli Surah kaun si hai?","Al-Baqarah","Al-Fatiha","Al-Ikhlas","An-Nas",1],
            ["Maghrib ki farz rak'at kitni?","2","3","4","5",1],
            ["Bismillah mein Allah ke kitne naam hain?","1","2","3","4",1],
            ["Eid ki namaz kitni rak'at hoti hai?","2","4","6","8",0],
            ["Kashti kis Nabi ne banai?","Nuh (AS)","Musa (AS)","Ibrahim (AS)","Isa (AS)",0],
            ["Zuhr ki farz rak'at kitni?","2","3","4","5",2],
            ["Quran kis zaban mein nazil hua?","Urdu","Farsi","Arabic","Hebrew",2],
            ["Juma ki namaz kis din farz hai?","Somwar","Mangal","Juma","Itwar",2],
            ["Pehle Khalifa kaun the?","Umar (RA)","Abu Bakr (RA)","Uthman (RA)","Ali (RA)",1],
            ["Asr ki farz rak'at kitni?","2","3","4","5",2]
        ],
        // ===== DAY 3 (AASAAN) =====
        [
            ["Isha ki farz rak'at kitni?","2","3","4","5",2],
            ["Nabi ﷺ ki pehli biwi kaun thin?","Aisha (RA)","Khadija (RA)","Hafsa (RA)","Zainab (RA)",1],
            ["Pehli Wahy kis ghar mein hui?","Hira","Safa","Marwa","Arafat",0],
            ["Quran ki sabse choti Surah?","Al-Ikhlas","Al-Kawthar","Al-Asr","An-Nas",1],
            ["Machhli ne kis Nabi ko nigal liya?","Yunus (AS)","Ayyub (AS)","Yusuf (AS)","Musa (AS)",0],
            ["Hazrat Fatima (RA) ke walid kaun?","Abu Bakr (RA)","Nabi ﷺ","Umar (RA)","Ali (RA)",1],
            ["Hazrat Fatima (RA) ke shauhar kaun?","Abu Bakr (RA)","Umar (RA)","Ali (RA)","Uthman (RA)",2],
            ["Pehli Wahy mein kaunsi Surah ki aayat?","Fatiha","Alaq","Baqarah","Nas",1],
            ["Fajr ki sunnat rak'at kitni?","2","3","4","5",0],
            ["Hazrat Hamza (RA) Nabi ﷺ ke kya the?","Bhai","Chacha","Mamu","Beta",1]
        ],
        // ===== DAY 4 (AASAAN) =====
        [
            ["Hazrat Abbas (RA) Nabi ﷺ ke kya the?","Bhai","Chacha","Mamu","Beta",1],
            ["Maghrib ki sunnat rak'at kitni?","1","2","3","4",1],
            ["Zakat kis par farz hai?","Har musalman","Sahib-e-Nisab","Bachon","Buzurgon",1],
            ["Hajj kis par farz hai?","Har musalman","Sahib-e-Istitaat","Ameeron","Buzurgon",1],
            ["Roza kis par farz hai?","Bachon","Baligh sehatmand","Buzurgon","Kisi par nahi",1],
            ["Pehli azan kisne di?","Abu Bakr (RA)","Bilal (RA)","Umar (RA)","Ali (RA)",1],
            ["Nabi ﷺ ki wafat kis umar mein hui?","60","63","65","70",1],
            ["Nabi ﷺ ko Nabuwat kis umar mein mili?","30","35","40","45",2],
            ["Hazrat Aisha (RA) ke walid kaun?","Umar (RA)","Abu Bakr (RA)","Uthman (RA)","Ali (RA)",1],
            ["Wudu ka pehla farz kya hai?","Niyyat","Munh dhona","Haath dhona","Sar ka masah",0]
        ],
        // ===== DAY 5 (AASAAN - QURAN) =====
        [
            ["Surah Al-Fatiha mein kitni aayat?","5","6","7","8",2],
            ["Surah Al-Ikhlas mein kitni aayat?","3","4","5","6",1],

        const MEMORY_PAIRS = [
            ["اللَّهُ", "اللہ"],
            ["رَبّ", "پالنے والا"],
            ["إِلَه", "معبود"],
            ["رَحْمَٰن", "بہت مہربان"],
            ["رَحِيم", "نہایت رحم والا"],
            ["غَفُور", "بخشنی والا"],

            ["عَلِيم", "سب جاننے والا"]
        ];
        let memoryState = null;
        function initMemory() {
            const cards = [];
            MEMORY_PAIRS.forEach((p, i) => {
                cards.push({ id: i, type: 'ar', text: p[0] });
                cards.push({ id: i, type: 'ur', text: p[1] });
            });
            const shuffled = cards.sort(() => Math.random() - 0.5);
            memoryState = { cards: shuffled, flipped: [], matched: 0, moves: 0, locked: false };
            memoryRender();
        }
        function memoryRender() {
            const box = document.getElementById('memory');
            if (memoryState.matched === MEMORY_PAIRS.length) {
                setTimeout(() => {
                    celebrate('Shabash!', 'Saare cards match ho gaye.');
                    box.innerHTML = `<div class="memory-box" style="text-align:center;"><h2 style="color:var(--primary);">🎉 Sab Match Ho Gaye!</h2><p style="margin:15px 0;">Total Moves: ${memoryState.moves}</p><button class="btn-primary" onclick="initMemory()">🔄 Dobara Khelein</button></div>`;
                }, 500);
                return;
            }
            box.innerHTML = `
                <div class="memory-box">
                    <div class="memory-info">
                        <span>✅ Matched: ${memoryState.matched} / ${MEMORY_PAIRS.length}</span>
                        <span>🎯 Moves: ${memoryState.moves}</span>
                    </div>
                    <div class="memory-grid" id="memGrid"></div>
                </div>
            `;
            const grid = document.getElementById('memGrid');
            memoryState.cards.forEach((card, idx) => {
                const div = document.createElement('div');
                div.className = 'mem-card';
                if (card.matched) div.classList.add('matched');
                else if (memoryState.flipped.includes(idx)) div.classList.add('flipped');
                if (memoryState.flipped.includes(idx) || card.matched) {
                    div.innerHTML = `<span class="${card.type === 'ar' ? 'ar' : 'ur'}">${card.text}</span>`;
                }
                div.onclick = () => memoryFlip(idx);
                grid.appendChild(div);
            });
        }
        function memoryFlip(idx) {
            if (memoryState.locked) return;
            const card = memoryState.cards[idx];
            if (card.matched || memoryState.flipped.includes(idx)) return;
            if (memoryState.flipped.length === 2) return;
            memoryState.flipped.push(idx);
            if (memoryState.flipped.length === 2) {
                memoryState.moves++;
                memoryState.locked = true;
                const [a, b] = memoryState.flipped;
                const ca = memoryState.cards[a], cb = memoryState.cards[b];
                if (ca.id === cb.id && ca.type !== cb.type) {
                    setTimeout(() => {
                        ca.matched = true; cb.matched = true;
                        memoryState.matched++;
                        memoryState.flipped = [];
                        memoryState.locked = false;
                        memoryRender();
                    }, 400);
                } else {
                    setTimeout(() => {
                        memoryState.flipped = [];
                        memoryState.locked = false;
                        memoryRender();
                    }, 900);
                }
            }
            memoryRender();
        }

            box.innerHTML = `
                <div class="emoji-box">
                    <div class="emoji-score">${emojiState.index + 1} / ${emojiState.questions.length} • Score: ${emojiState.score}</div>
                    <div class="emoji-display">${q.emoji}</div>
                    <div class="emoji-question">${q.q}</div>
                    <div id="emojiOpts">${q.o.map((o, i) => `<button class="emoji-opt" onclick="emojiAnswer(${i})">${o}</button>`).join('')}</div>
                </div>
            `;
            emojiState.answered = false;
        }
        function emojiAnswer(sel) {
            if (emojiState.answered) return;
            emojiState.answered = true;
            const q = emojiState.questions[emojiState.index];
            const opts = document.querySelectorAll('#emojiOpts .emoji-opt');
            opts.forEach(o => o.disabled = true);
            if (sel === q.c) {
                opts[sel].classList.add('correct');
                emojiState.score++;
            } else {
                opts[sel].classList.add('wrong');
                opts[q.c].classList.add('correct');
            }
            setTimeout(() => { emojiState.index++; emojiRender(); }, 1200);
        }

        // Start with KBC
        initKBC();
    </script>
</body>
</html>
