    <style>
        :root { 
            --primary: #0F4C3A; 
            --secondary: #D4AF37; 
            --bg: #F4F7F6; 
            --card-bg: #ffffff; 
            --text: #333333; 
            --text-light: #666;
            --shadow: 0 4px 15px rgba(0,0,0,0.05); 
            --border: #ddd; 
        }
        [data-theme="dark"] { 
            --primary: #1a1a2e; 
            --secondary: #6ee7b7; 
            --bg: #0f0f23; 
            --card-bg: #1e1e36; 
            --text: #eee; 
            --text-light: #aaa; 
            --shadow: 0 4px 15px rgba(0,0,0,0.3); 
            --border: #333; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        header { background-color: var(--primary); color: white; text-align: center; padding: 15px; border-bottom: 4px solid var(--secondary); position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: white; }

        .main-nav { display: flex; justify-content: flex-start; overflow-x: auto; gap: 10px; margin: 15px auto; padding: 0 15px; max-width: 1200px; scrollbar-width: none; }
        .main-nav::-webkit-scrollbar { display: none; }
        .nav-btn { padding: 8px 16px; border: none; border-radius: 20px; font-size: 14px; font-weight: 600; background: var(--card-bg); color: var(--text); box-shadow: var(--shadow); cursor: pointer; white-space: nowrap; }
        .nav-btn.active { background: var(--primary); color: #fff; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); border-left: 5px solid var(--primary); margin-bottom: 20px; }
        
        .dua-number { font-size: 12px; color: var(--text-light); margin-bottom: 5px; font-weight: bold; }
        .arabic { font-family: 'Amiri', serif; font-size: 30px; color: var(--secondary); margin-bottom: 15px; direction: rtl; text-align: right; cursor: pointer; line-height: 1.8; }
        .arabic:hover { opacity: 0.8; }
        
        .roman { font-weight: 600; font-size: 15px; margin-bottom: 10px; color: var(--text); }
        .urdu { font-family: 'Noto Nastaliq Urdu', serif; font-size: 20px; color: var(--text); direction: rtl; text-align: right; margin-bottom: 15px; cursor: pointer; line-height: 2.2; }
        
        .tafseel-box { background: rgba(212, 175, 55, 0.1); border: 1px dashed var(--secondary); padding: 15px; border-radius: 8px; margin-top: 15px; }
        .tafseel-title { font-weight: bold; color: var(--primary); margin-bottom: 5px; display: block; font-size: 14px;}
        .tafseel-text { font-family: 'Noto Nastaliq Urdu', serif; font-size: 16px; direction: rtl; text-align: right; color: var(--text-light); line-height: 1.9; }
        .hawala { font-size: 12px; color: var(--text-light); margin-top: 10px; font-style: italic; border-top: 1px solid var(--border); padding-top: 10px; }
        
        .play-btn { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; }

        .search-box { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; margin-bottom: 20px; background: var(--card-bg); color: var(--text); outline: none; font-size: 16px; }
        .hidden { display: none !important; }

        /* ===== Designer look ===== */
        :root { --arabic: #0B3D2E; --gold: #C9A227; --chip-bg: rgba(15,76,58,0.08); --scale: 1; }
        [data-theme="dark"] { --arabic: #F3E3A0; --gold: #E5C158; --chip-bg: rgba(110,231,183,0.10); }
        body { background: var(--bg) radial-gradient(circle at 20% 0%, rgba(201,162,39,0.10), transparent 40%); }
        header { background: linear-gradient(135deg, #0F4C3A 0%, #17695171 60%, #0F4C3A 100%); background-color: var(--primary); border-bottom: 3px solid var(--gold); box-shadow: 0 4px 18px rgba(0,0,0,0.18); }
        header h1 { font-size: 20px; letter-spacing: .3px; }
        .size-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.35); color: #fff; border-radius: 8px; padding: 3px 9px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .nav-btn.active { background: linear-gradient(135deg, #0F4C3A, #1a7a5c); box-shadow: 0 3px 10px rgba(15,76,58,0.35); }

        .card { position: relative; border: 1px solid var(--border); border-left: none; border-top: 4px solid var(--gold); border-radius: 18px; padding: 22px 18px 18px; box-shadow: 0 8px 26px rgba(0,0,0,0.07); margin-bottom: 26px; overflow: hidden; }
        .card::before { content: "۞"; position: absolute; top: -14px; right: -6px; font-size: 90px; color: var(--gold); opacity: .07; pointer-events: none; }
        .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .num-badge { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #8f7312); color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,0.2); }
        .card-title { color: var(--primary); font-size: 16px; line-height: 1.4; font-weight: 600; }
        [data-theme="dark"] .card-title { color: var(--secondary); }

        .sec { border-radius: 14px; padding: 14px 14px 10px; margin-bottom: 14px; }
        .sec-ar { background: linear-gradient(180deg, rgba(201,162,39,0.10), rgba(201,162,39,0.03)); border: 1px solid rgba(201,162,39,0.35); }
        .sec-ro { background: var(--chip-bg); }
        .sec-ur { background: transparent; border: 1px solid var(--border); }
        .chip { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .6px; padding: 3px 12px; border-radius: 20px; background: var(--primary); color: #fff; margin-bottom: 10px; }
        [data-theme="dark"] .chip { background: rgba(110,231,183,0.18); color: var(--secondary); }
        .sec-ar .chip { background: var(--gold); font-family: 'Amiri', serif; font-size: 14px; }

        .lines .ln { padding: 7px 4px; border-bottom: 1px dashed rgba(128,128,128,0.25); }
        .lines .ln:last-child { border-bottom: none; }
        .lines-ar .ln { font-family: 'Amiri', serif; font-size: calc(30px * var(--scale)); line-height: 2.0; color: var(--arabic); direction: rtl; text-align: center; font-weight: 700; }
        .lines-ro .ln { font-size: calc(15px * var(--scale)); line-height: 1.7; color: var(--text); font-weight: 500; text-align: left; }
        .lines-ur .ln { font-family: 'Noto Nastaliq Urdu', serif; font-size: calc(20px * var(--scale)); line-height: 2.4; color: var(--text); direction: rtl; text-align: right; }

        .play-row { display: flex; justify-content: center; margin-top: 8px; }
        .play-btn { margin-top: 0; padding: 8px 16px; font-size: 12px; box-shadow: 0 3px 8px rgba(15,76,58,0.3); }
        .play-btn:active { transform: scale(.96); }

        .tafseel-box { background: linear-gradient(135deg, rgba(212,175,55,0.14), rgba(212,175,55,0.04)); border: 1px solid rgba(201,162,39,0.4); border-radius: 14px; }
        .tafseel-text { font-size: calc(17px * var(--scale)); line-height: 2.2; color: var(--text); }
        .hawala { display: inline-block; font-style: normal; border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; margin-top: 14px; background: var(--chip-bg); }

        /* ===== Favourites ===== */
        .card-title { flex: 1; min-width: 0; }
        .cat-tag { display: inline-block; margin-left: 8px; font-size: 10px; font-weight: 700; letter-spacing: .4px; padding: 2px 9px; border-radius: 20px; background: var(--chip-bg); color: var(--text-light); vertical-align: middle; }
        .fav-btn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-light); font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .fav-btn:active { transform: scale(.88); }
        .fav-btn.on { color: #fff; background: linear-gradient(135deg, var(--gold), #8f7312); border-color: var(--gold); }
        .fav-empty { text-align: center; color: var(--text-light); padding: 30px 16px; line-height: 1.8; }
        .fav-toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%) translateY(20px); background: #222; color: #fff; padding: 10px 18px; border-radius: 22px; font-size: 13px; z-index: 99995; opacity: 0; transition: all .25s; pointer-events: none; border: 1px solid var(--gold); max-width: 88%; text-align: center; }
        .fav-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>

    <script>
        function toggleTheme() { FQTheme.cycle(); }   // themes.js: kharidi hui themes ek ke baad ek

            { cat: "namaz", title: "1. Wudu ke baad ki dua", arabic: "أَشْهَدُ أَن لَّ إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ", roman: "Ashhadu an la ilaha illallahu wahdahu la sharika lah, wa ashhadu anna Muhammadan 'abduhu wa rasuluh", urdu: "میں گواہی دیتا ہوں کہ اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں، اور میں گواہی دیتا ہوں کہ محمد ﷺ اس کے بندے اور رسول ہیں۔", tafseel: "جو شخص اچھی طرح وضو کر کے یہ دعا پڑھے، اس کے لیے جنت کے آٹھوں دروازے کھول دیے جاتے ہیں۔", hawala: "Sahih Muslim 234" },
            { cat: "namaz", title: "2. Azan ka jawab", arabic: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", roman: "La hawla wa la quwwata illa billah", urdu: "گناہ سے بچنے کی کوئی طاقت اور نیکی کی کوئی قوت نہیں مگر اللہ کی مدد سے۔", tafseel: "موذن کے کلمات دہرائیں؛ صرف 'حی علی الصلاۃ' اور 'حی علی الفلاح' کے جواب میں یہ کہیں۔", hawala: "Sahih al-Bukhari 611; Sahih Muslim 385" },
            { cat: "namaz", title: "3. Azan ke baad shahadat aur raza ka iqrar", arabic: "وَأَنَا أَشْهَدُ أَن لَّا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، رَضِيتُ بِاللَّهِ رَبَّا، وَبِمُحَمَّدٍ رَسُولًا، وَبِالْإِسْلَامِ دِينًا", roman: "Wa ana ashhadu an la ilaha illallahu wahdahu la sharika lah, wa anna Muhammadan 'abduhu wa rasuluh, raditu billahi rabban wa bi Muhammadin rasulan wa bil-Islami dinan", urdu: "اور میں بھی گواہی دیتا ہوں کہ اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں، اور یہ کہ محمد ﷺ اس کے بندے اور رسول ہیں۔ میں اللہ کے رب ہونے، محمد ﷺ کے رسول ہونے اور اسلام کے دین ہونے پر راضی ہوں۔", tafseel: "جو موذن کو سن کر یہ کہے، اس کے گناہ معاف کر دیے جاتے ہیں۔", hawala: "Sahih Muslim 386" },
            { cat: "namaz", title: "4. Azan ke baad darood aur wasila ki dua", arabic: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ. اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ. ثُمَّ: اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ", roman: "Allahumma salli 'ala Muhammadin wa 'ala ali Muhammad, kama sallayta 'ala Ibrahima wa 'ala ali Ibrahim, innaka Hamidun Majid. Allahumma barik 'ala Muhammadin wa 'ala ali Muhammad, kama barakta 'ala Ibrahima wa 'ala ali Ibrahim, innaka Hamidun Majid. Phir: Allahumma Rabba hadhihid-da'watit-tammati was-salatil-qa'imah, ati Muhammadanil-wasilata wal-fadilah, wab'athhu maqamam-mahmudanil-ladhi wa'adtah.", urdu: "اے اللہ! محمد ﷺ اور آلِ محمد پر رحمت نازل فرما جیسے تو نے ابراہیم اور آلِ ابراہیم پر رحمت نازل فرمائی، بے شک تو تعریف کے لائق، بزرگی والا ہے۔ اے اللہ! محمد ﷺ اور آلِ محمد پر برکت نازل فرما جیسے تو نے ابراہیم اور آلِ ابراہیم پر برکت نازل فرمائی، بے شک تو تعریف کے لائق، بزرگی والا ہے۔ پھر وسیلہ کی دعا: اے اللہ! اس مکمل پکار اور قائم ہونے والی نماز کے رب! محمد ﷺ کو وسیلہ اور فضیلت عطا فرما، اور انہیں اس مقامِ محمود پر پہنچا جس کا تو نے ان سے وعدہ کیا ہے۔", tafseel: "جو شخص یہ دعا پڑھے، اس کے لیے قیامت کے دن نبی ﷺ کی شفاعت واجب ہو جاتی ہے۔", hawala: "Sahih Muslim 384; Sahih al-Bukhari 614" },
            { cat: "namaz", title: "5. Masjid mein dakhil hote waqt", arabic: "اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتَكَ", roman: "Allahummaf tah li abwaba rahmatik", urdu: "اے اللہ! میرے لیے اپنی رحمت کے دروازے کھول دے۔", tafseel: "مسجد میں داخل ہوتے وقت یہ پڑھنا سنت ہے۔", hawala: "Sahih Muslim 713" },
            { cat: "namaz", title: "6. Masjid se nikalte waqt", arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", roman: "Allahumma inni as'aluka min fadlik", urdu: "اے اللہ! میں تجھ سے تیرے فضل کا سوال کرتا ہوں۔", tafseel: "مسجد سے نکلتے وقت یہ دعا پڑھی جاتی ہے۔", hawala: "Sahih Muslim 713" },
            { cat: "namaz", title: "7. Istiftah (1) - Allahumma ba'id bayni", arabic: "اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اللَّهُمَّ نَقِّنِي مِنَ الْخَطَايَا كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْنِي مِنْ خَطَايَايَ بِالثَّلْجِ وَالْمَاءِ وَالْبَرَدِ", roman: "Allahumma ba'id bayni wa bayna khatayaya kama ba'adta baynal-mashriqi wal-maghrib. Allahumma naqqini minal-khataya kama yunaqqath-thawbul-abyadu minad-danas. Allahummaghsilni min khatayaya bith-thalji wal-ma'i wal-barad.", urdu: "اے اللہ! میرے اور میرے گناہوں کے درمیان اتنی دوری کر دے جتنی تو نے مشرق اور مغرب کے درمیان رکھی ہے۔ اے اللہ! مجھے گناہوں سے ایسے پاک کر دے جیسے سفید کپڑا میل سے صاف کیا جاتا ہے۔ اے اللہ! میرے گناہوں کو برف، پانی اور اولوں سے دھو دے۔", tafseel: "نماز شروع کرنے کی دعاؤں میں سے ایک ہے۔", hawala: "Sahih al-Bukhari 744; Sahih Muslim 598" },
            { cat: "namaz", title: "8. Istiftah (2) - Subhanaka Allahumma", arabic: "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمَكَ، وَتَعَالَى جُدُّكَ، وَلَا إِلَهَ غَيْرُكَ", roman: "Subhanaka Allahumma wa bihamdika, wa tabarakasmuka, wa ta'ala jadduka, wa la ilaha ghayruk", urdu: "اے اللہ! تو پاک ہے اور تیری ہی تعریف ہے، تیرا نام بابرکت ہے، تیری شان بلند ہے اور تیرے سوا کوئی معبود نہیں۔", tafseel: "یہ بھی نماز کی ابتدائی دعا ہے۔", hawala: "Sunan Abi Dawud 776 - Sahih" },
            { cat: "namaz", title: "9. Istiftah (3) - Wajjahtu wajhiya", arabic: "وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ، إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ، لَا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ. اللَّهُمَّ أَنْتَ الْمَلِكُ لَا إِلَهَ إِلَّا أَنْتَ، أَنْتَ رَبِّي وَأَنَا عَبْدُكَ، ظَلَمْتُ نَفْسِي وَاعْتَرَفْتُ بِذَنْبِي فَاغْفِرْ لِي ذُنُوبِي جَمِيعًا، إِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، وَاهْدِنِي لِأَحْسَنِ الْأَخْلَاقِ لَا يَهْدِي لِأَحْسَنِهَا إِلَّا أَنْتَ، وَاصْرِفْ عَنِّي سَيِّئَهَا لَا يَصْرِفُ عَنِّي سَيِّئَهَا إِلَّا أَنْتَ، لَبَّيْكَ وَسَعْدَيْكَ، وَالْخَيْرُ كُلُّهُ فِي يَدَيْكَ، وَالشَّرُّ لَيْسَ إِلَيْكَ، أَنَا بِكَ وَإِلَيْكَ، تَبَارَكْتَ وَتَعَالَيْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ", roman: "Wajjahtu wajhiya lilladhi fataras-samawati wal-arda hanifan wa ma ana minal-mushrikin. Inna salati wa nusuki wa mahyaya wa mamati lillahi Rabbil-'alamin, la sharika lah, wa bidhalika umirtu wa ana minal-muslimin. Allahumma antal-Maliku la ilaha illa ant, anta Rabbi wa ana 'abduk, zalamtu nafsi wa'taraftu bidhanbi faghfir li dhunubi jami'a, innahu la yaghfirudh-dhunuba illa ant. Wahdini li-ahsanil-akhlaqi la yahdi li-ahsaniha illa ant, wasrif 'anni sayyi'aha la yasrifu 'anni sayyi'aha illa ant. Labbayka wa sa'dayk, wal-khayru kulluhu fi yadayk, wash-sharru laysa ilayk, ana bika wa ilayk, tabarakta wa ta'alayt, astaghfiruka wa atubu ilayk.", urdu: "میں نے اپنا رخ اس ذات کی طرف کر لیا جس نے آسمانوں اور زمین کو پیدا کیا، ہر طرف سے یکسو ہو کر، اور میں مشرکوں میں سے نہیں۔ بے شک میری نماز، میری قربانی، میری زندگی اور میری موت سب اللہ کے لیے ہے جو تمام جہانوں کا رب ہے، اس کا کوئی شریک نہیں، مجھے اسی کا حکم دیا گیا ہے اور میں فرمانبرداروں میں سے ہوں۔ اے اللہ! تو ہی بادشاہ ہے، تیرے سوا کوئی معبود نہیں، تو میرا رب ہے اور میں تیرا بندہ ہوں، میں نے اپنی جان پر ظلم کیا اور اپنے گناہ کا اعتراف کیا، پس میرے سب گناہ بخش دے، بے شک تیرے سوا کوئی گناہ نہیں بخشتا۔ مجھے بہترین اخلاق کی ہدایت دے، تیرے سوا کوئی بہترین اخلاق کی ہدایت نہیں دیتا، اور مجھ سے برے اخلاق دور کر دے، تیرے سوا کوئی انہیں دور نہیں کرتا۔ میں حاضر ہوں اور تیرے حکم کے لیے تیار ہوں، ساری بھلائی تیرے ہاتھ میں ہے اور برائی تیری طرف منسوب نہیں۔ میں تیرے سہارے ہوں اور تیری ہی طرف (میری واپسی) ہے، تو برکت والا اور بلند ہے، میں تجھ سے بخشش مانگتا ہوں اور تیری طرف توبہ کرتا ہوں۔", tafseel: "نبی ﷺ کی نماز کی ایک اور مسنون دعا ہے۔", hawala: "Sahih Muslim 771" },
            { cat: "namaz", title: "10. Ta'awwudh", arabic: "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", roman: "A'udhu billahi minash-shaytanir-rajim", urdu: "میں شیطان مردود سے اللہ کی پناہ مانگتا ہوں۔", tafseel: "قرات شروع کرنے سے پہلے پڑھی جاتی ہے۔", hawala: "Surah An-Nahl 16:98" },
            { cat: "namaz", title: "11. Surah Al-Fatiha", arabic: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ﴿١﴾ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ﴿٢﴾ الرَّحْمَٰنِ الرَّحِيمِ ﴿٣﴾ مَالِكِ يَوْمِ الدِّينِ ﴿٤﴾ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ﴿٥﴾ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ﴿٦﴾ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ ﴿٧﴾", roman: "Bismillahir-Rahmanir-Rahim. Alhamdu lillahi Rabbil-'alamin. Ar-Rahmanir-Rahim. Maliki yawmid-din. Iyyaka na'budu wa iyyaka nasta'in. Ihdinas-siratal-mustaqim. Siratal-ladhina an'amta 'alayhim, ghayril-maghdubi 'alayhim wa lad-dallin.", urdu: "اللہ کے نام سے جو بہت مہربان، نہایت رحم والا ہے۔ تمام تعریف اللہ کے لیے ہے جو سارے جہانوں کا رب ہے۔ بہت مہربان، نہایت رحم والا۔ بدلے کے دن کا مالک۔ ہم تیری ہی عبادت کرتے ہیں اور تجھی سے مدد مانگتے ہیں۔ ہمیں سیدھے راستے کی ہدایت دے۔ ان لوگوں کے راستے کی جن پر تو نے انعام کیا، نہ ان کے راستے کی جن پر غضب ہوا اور نہ گمراہوں کے۔", tafseel: "یہ نماز کا رکن ہے، اس کے بغیر نماز نہیں ہوتی۔", hawala: "Sahih al-Bukhari 756; Sahih Muslim 394" },
            { cat: "namaz", title: "12. Ameen", arabic: "آمِين", roman: "Ameen", urdu: "اے اللہ! ہماری دعا قبول فرما۔", tafseel: "جب امام آمین کہے تو مقتدی بھی آمین کہیں۔", hawala: "Sahih al-Bukhari 780; Sahih Muslim 410" },
            { cat: "namaz", title: "13. Ruku ki tasbeeh", arabic: "سُبْحَانَ رَبِّيَ الْعَظِيمِ", roman: "Subhana Rabbiyal-'Azim", urdu: "میرا رب پاک ہے، بہت عظمت والا۔", tafseel: "رکوع میں کم از کم تین بار پڑھیں۔", hawala: "Sahih Muslim 772" },
            { cat: "namaz", title: "14. Ruku ki dua (Ali RA)", arabic: "اللَّهُمَّ لَكَ رَكَعْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، خَشَعَ لَكَ سَمْعِي وَبَصَرِي وَمُخِّي وَعَظْمِي وَعَصَبِي", roman: "Allahumma laka raka'tu wa bika amantu wa laka aslamtu, khasha'a laka sam'i wa basari wa mukhkhi wa 'azmi wa 'asabi", urdu: "اے اللہ! میں نے تیرے لیے رکوع کیا، تجھ پر ایمان لایا اور تیرا فرمانبردار ہوا؛ میرے کان، میری آنکھ، میرا مغز، میری ہڈیاں اور میرے پٹھے تیرے لیے جھک گئے۔", tafseel: "نبی ﷺ رکوع میں یہ دعا بھی پڑھتے تھے۔", hawala: "Sahih Muslim 771" },
            { cat: "namaz", title: "15. Ruku/Sajde mein gunahon ki muafi", arabic: "سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي", roman: "Subhanaka Allahumma Rabbana wa bihamdika, Allahummaghfir li", urdu: "اے اللہ! اے ہمارے رب! تو پاک ہے اور تیری ہی حمد ہے، اے اللہ! مجھے بخش دے۔", tafseel: "نبی ﷺ رکوع اور سجدے میں یہ دعا پڑھتے تھے۔", hawala: "Sahih al-Bukhari 817; Sahih Muslim 484" },
            { cat: "namaz", title: "16. Ruku/Sajde mein Subbuhun Quddus", arabic: "سُبُّوحٌ قُدُّوسٌ رَبُّ الْمَلَائِكَةِ وَالرُّوحِ", roman: "Subbuhun Quddusun Rabbul-mala'ikati war-ruh", urdu: "بہت پاک، بہت مقدس، فرشتوں اور جبریل (روح) کا رب۔", tafseel: "نبی ﷺ رکوع اور سجدے میں یہ بھی کہتے تھے۔", hawala: "Sahih Muslim 487" },
            { cat: "namaz", title: "17. Ruku se uthte hue (Qawmah)", arabic: "سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ، رَبَّنَا وَلَكَ الْحَمْدُ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ", roman: "Sami'allahu liman hamidah, Rabbana wa lakal-hamdu hamdan kathiran tayyiban mubarakan fih", urdu: "اللہ نے اس کی سن لی جس نے اس کی حمد کی۔ اے ہمارے رب! تیری ہی حمد ہے، بہت زیادہ، پاکیزہ اور برکت والی حمد۔", tafseel: "ایک صحابی نے یہ پڑھا تو نبی ﷺ نے فرمایا کہ 30 سے زائد فرشتے اسے لکھنے میں جلدی کر رہے تھے۔", hawala: "Sahih al-Bukhari 799" },
            { cat: "namaz", title: "18. Sajde ki tasbeeh", arabic: "سُبْحَانَ رَبِّيَ الْأَعْلَى", roman: "Subhana Rabbiyal-A'la", urdu: "میرا رب پاک ہے، سب سے بلند۔", tafseel: "سجدے میں کم از کم تین بار پڑھیں۔", hawala: "Sahih Muslim 772" },
            { cat: "namaz", title: "19. Sajde ki dua (Ali RA)", arabic: "اللَّهُمَّ لَكَ سَجَدْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، سَجَدَ وَجْهِي لِلَّذِي خَلَقَهُ وَصَوَّرَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، تَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ", roman: "Allahumma laka sajadtu wa bika amantu wa laka aslamtu, sajada wajhiya lilladhi khalaqahu wa sawwarahu, wa shaqqa sam'ahu wa basarah, tabarakallahu ahsanul-khaliqin.", urdu: "اے اللہ! میں نے تیرے لیے سجدہ کیا، تجھ پر ایمان لایا اور تیرا فرمانبردار ہوا۔ میرا چہرہ اس ذات کے لیے سجدہ ریز ہوا جس نے اسے پیدا کیا، صورت دی اور اس کے کان اور آنکھ کھول دیے۔ اللہ برکت والا ہے، سب سے بہتر پیدا کرنے والا۔", tafseel: "نبی ﷺ سجدے میں یہ دعا پڑھتے تھے۔", hawala: "Sahih Muslim 771" },
            { cat: "namaz", title: "20. Sajde mein saare gunahon ki muafi", arabic: "اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ", roman: "Allahummaghfir li dhanbi kullahu, diqqahu wa jillahu, wa awwalahu wa akhirahu, wa 'alaniyatahu wa sirrah", urdu: "اے اللہ! میرے سارے گناہ بخش دے، چھوٹے بھی اور بڑے بھی، پہلے بھی اور بعد کے بھی، کھلے بھی اور چھپے بھی۔", tafseel: "سجدہ وہ حالت ہے جب بندہ اپنے رب کے سب سے قریب ہوتا ہے، اس میں دعا کی کثرت کریں۔", hawala: "Sahih Muslim 483" },
            { cat: "namaz", title: "21. Do sajdon ke darmiyan (Jalsa)", arabic: "رَبِّ اغْفِرْ لِي، رَبِّ اغْفِرْ لِي", roman: "Rabbighfir li, Rabbighfir li", urdu: "اے میرے رب! مجھے بخش دے، اے میرے رب! مجھے بخش دے۔", tafseel: "دو سجدوں کے درمیان یہ دعا پڑھی جاتی ہے۔", hawala: "Sunan Ibn Majah 897 - Sahih (Albani: Asl Sifat Salat, 3/809)" },
            { cat: "namaz", title: "22. Do sajdon ke darmiyan mukammal dua", arabic: "اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاجْبُرْنِي، وَاهْدِنِي، وَارْزُقْنِي", roman: "Allahummaghfir li, warhamni, wajburni, wahdini, warzuqni", urdu: "اے اللہ! مجھے بخش دے، مجھ پر رحم فرما، میری حالت درست کر دے، مجھے ہدایت دے اور مجھے رزق عطا فرما۔", tafseel: "نبی ﷺ دو سجدوں کے درمیان یہ دعا پڑھتے تھے۔", hawala: "Sunan at-Tirmidhi 284; Sunan Ibn Majah 898 - Sahih (Albani: Asl Sifat Salat, 3/809)" },
            { cat: "namaz", title: "23. Tashahhud (At-Tahiyyat)", arabic: "التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ", roman: "At-tahiyyatu lillahi was-salawatu wat-tayyibat, as-salamu 'alayka ayyuhan-nabiyyu wa rahmatullahi wa barakatuh, as-salamu 'alayna wa 'ala 'ibadillahis-salihin. Ashhadu an la ilaha illallah, wa ashhadu anna Muhammadan 'abduhu wa rasuluh.", urdu: "تمام قولی، فعلی اور مالی عبادتیں اللہ کے لیے ہیں۔ اے نبی ﷺ! آپ پر سلام ہو اور اللہ کی رحمت اور برکتیں ہوں۔ ہم پر اور اللہ کے نیک بندوں پر بھی سلام ہو۔ میں گواہی دیتا ہوں کہ اللہ کے سوا کوئی معبود نہیں اور میں گواہی دیتا ہوں کہ محمد ﷺ اس کے بندے اور رسول ہیں۔", tafseel: "یہ نماز کی قعدہ کی دعا ہے، جس کے بعد درود پڑھا جاتا ہے۔", hawala: "Sahih al-Bukhari 831; Sahih Muslim 402" },
            { cat: "namaz", title: "24. Darood Ibrahim", arabic: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ. اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ", roman: "Allahumma salli 'ala Muhammadin wa 'ala ali Muhammad, kama sallayta 'ala Ibrahima wa 'ala ali Ibrahim, innaka Hamidun Majid. Allahumma barik 'ala Muhammadin wa 'ala ali Muhammad, kama barakta 'ala Ibrahima wa 'ala ali Ibrahim, innaka Hamidun Majid.", urdu: "اے اللہ! محمد ﷺ اور آلِ محمد پر رحمت نازل فرما جیسے تو نے ابراہیم اور آلِ ابراہیم پر رحمت نازل فرمائی، بے شک تو تعریف کے لائق، بزرگی والا ہے۔ اے اللہ! محمد ﷺ اور آلِ محمد پر برکت نازل فرما جیسے تو نے ابراہیم اور آلِ ابراہیم پر برکت نازل فرمائی، بے شک تو تعریف کے لائق، بزرگی والا ہے۔", tafseel: "آخری قعدے میں درود پڑھنا واجب ہے۔", hawala: "Sahih al-Bukhari 3370; Sahih Muslim 406" },
            { cat: "namaz", title: "25. Jahannam, qabr aur dajjal se panah", arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ جَهَنَّمَ، وَمِنْ عَذَابِ الْقَبْرِ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ", roman: "Allahumma inni a'udhu bika min 'adhabi jahannam, wa min 'adhabil-qabr, wa min fitnatil-mahya wal-mamat, wa min sharri fitnatil-Masihid-Dajjal.", urdu: "اے اللہ! میں تیری پناہ مانگتا ہوں جہنم کے عذاب سے، قبر کے عذاب سے، زندگی اور موت کے فتنے سے، اور مسیح دجال کے فتنے کے شر سے۔", tafseel: "آخری تشہد کے بعد یہ دعا پڑھی جاتی ہے۔", hawala: "Sahih Muslim 588" },
            { cat: "namaz", title: "26. Salam se pehle (Abu Bakr RA ki dua)", arabic: "اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي، إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ", roman: "Allahumma inni zalamtu nafsi zulman kathiran, wa la yaghfirudh-dhunuba illa ant, faghfir li maghfiratam-min 'indika warhamni, innaka antal-Ghafurur-Rahim.", urdu: "اے اللہ! میں نے اپنی جان پر بہت ظلم کیا، اور گناہوں کو تیرے سوا کوئی نہیں بخشتا، پس اپنی طرف سے مجھے بخشش عطا فرما اور مجھ پر رحم کر، بے شک تو ہی بخشنے والا، نہایت رحم کرنے والا ہے۔", tafseel: "نبی ﷺ نے حضرت ابو بکر کو یہ دعا سکھائی تھی۔", hawala: "Sahih al-Bukhari 834; Sahih Muslim 2705" },
            { cat: "namaz", title: "27. Namaz khatam karne waqt salam", arabic: "السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ", roman: "As-salamu 'alaykum wa rahmatullah", urdu: "تم پر سلامتی ہو اور اللہ کی رحمت۔", tafseel: "نماز ختم کرتے وقت پہلے دائیں پھر بائیں طرف سلام پھیرا جاتا ہے۔", hawala: "Sahih Muslim 582" },
            { cat: "namaz", title: "28. Salam ke baad takbir", arabic: "اللَّهُ أَكْبَرُ", roman: "Allahu Akbar", urdu: "اللہ سب سے بڑا ہے۔", tafseel: "نماز کے خاتمے کا اعلان۔", hawala: "Sahih al-Bukhari 842; Sahih Muslim 583" },
            { cat: "namaz", title: "29. Salam ke baad Istighfar aur Salamati", arabic: "أَسْتَغْفِرُ اللَّهَ (3 بار) اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ", roman: "Astaghfirullah (3 times). Allahumma antas-salamu wa minkas-salam, tabarakta ya dhal-jalali wal-ikram.", urdu: "میں اللہ سے بخشش مانگتا ہوں (تین بار)۔ اے اللہ! تو سلامتی والا ہے اور تجھ ہی سے سلامتی ہے، تو بابرکت ہے، اے جلال اور اکرام والے۔", tafseel: "نماز کے بعد یہ اذکار پڑھنا سنت ہے۔", hawala: "Sahih Muslim 591" },
            { cat: "namaz", title: "30. Tauheed aur Allah ke ata karne ka iqrar", arabic: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ", roman: "La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamd, wa huwa 'ala kulli shay'in qadir. Allahumma la mani'a lima a'tayt, wa la mu'tiya lima mana't, wa la yanfa'u dhal-jaddi minkal-jadd.", urdu: "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں، اسی کی بادشاہی ہے، اسی کی حمد ہے اور وہ ہر چیز پر قادر ہے۔ اے اللہ! جو تو دے اسے کوئی روکنے والا نہیں، اور جو تو روک لے اسے کوئی دینے والا نہیں، اور کسی شان والے کو اس کی شان تیرے مقابلے میں فائدہ نہیں دیتی۔", tafseel: "ہر فرض نماز کے بعد پڑھنا مسنون ہے۔", hawala: "Sahih al-Bukhari 844; Sahih Muslim 593" },
            { cat: "namaz", title: "31. Tasbeehat: 33+33+33 aur kalima-e-tauheed", arabic: "سُبْحَانَ اللَّهِ (٣٣) الْحَمْدُ لِلَّهِ (٣٣) اللَّهُ أَكْبَرُ (٣٣) ثُمَّ: لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", roman: "Subhanallah (33), Alhamdulillah (33), Allahu Akbar (33). Phir: La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamd, wa huwa 'ala kulli shay'in qadir.", urdu: "اللہ پاک ہے (۳۳ بار)، تمام تعریف اللہ کے لیے ہے (۳۳ بار)، اللہ سب سے بڑا ہے (۳۳ بار)۔ پھر (سو پورے کرنے کے لیے): اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں، اسی کی بادشاہی ہے، اسی کی حمد ہے اور وہ ہر چیز پر قادر ہے۔", tafseel: "نماز کے بعد یہ تسبیحات گناہوں کو معاف کرواتی ہیں۔", hawala: "Sahih Muslim 597" },
            { cat: "namaz", title: "32. Mu'aqqibat: 33+33+34", arabic: "سُبْحَانَ اللَّهِ (33) الْحَمْدُ لِلَّهِ (33) اللَّهُ أَكْبَرُ (34)", roman: "Subhanallah (33), Alhamdulillah (33), Allahu Akbar (34)", urdu: "اللہ پاک ہے (33)، سب تعریف اللہ کے لیے ہے (33)، اللہ سب سے بڑا ہے (34)۔", tafseel: "فرض نماز کے بعد یہ تسبیحات پڑھنا بہت بڑا اجر ہے۔", hawala: "Sahih Muslim 596" },
            { cat: "namaz", title: "33. Ayatul Kursi (Har namaz ke baad)", arabic: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ", roman: "Allahu la ilaha illa huwal-Hayyul-Qayyum, la ta'khudhuhu sinatun wa la nawm, lahu ma fis-samawati wa ma fil-ard, man dhal-ladhi yashfa'u 'indahu illa bi-idhnih, ya'lamu ma bayna aydihim wa ma khalfahum, wa la yuhituna bishay'im-min 'ilmihi illa bima sha', wasi'a kursiyyuhus-samawati wal-ard, wa la ya'uduhu hifzuhuma, wa huwal-'Aliyyul-'Azim.", urdu: "اللہ کے سوا کوئی معبود نہیں، وہ زندہ ہے، سب کو تھامنے والا ہے۔ اسے نہ اونگھ آتی ہے نہ نیند۔ جو کچھ آسمانوں میں اور زمین میں ہے سب اسی کا ہے۔ کون ہے جو اس کی اجازت کے بغیر اس کے پاس سفارش کرے؟ وہ جانتا ہے جو ان کے سامنے ہے اور جو ان کے پیچھے ہے، اور وہ اس کے علم میں سے کسی چیز کا احاطہ نہیں کر سکتے مگر جتنا وہ چاہے۔ اس کی کرسی آسمانوں اور زمین کو گھیرے ہوئے ہے، اور ان کی حفاظت اسے تھکاتی نہیں، اور وہ بلند و عظمت والا ہے۔", tafseel: "ہر فرض نماز کے بعد پڑھنے سے جنت میں داخلے سے صرف موت روکتی ہے۔", hawala: "an-Nasa'i 9848 - Sahih (Albani: Sahih al-Jami' 6464, as-Sahiha 972)" },
            { cat: "namaz", title: "34. Mu'awwidhat (Teeno Qul)", arabic: "قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ﴿٤﴾ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِنْ شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾ قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾", roman: "Qul huwallahu ahad. Allahus-Samad. Lam yalid wa lam yulad. Wa lam yakun lahu kufuwan ahad. Qul a'udhu bi Rabbil-falaq. Min sharri ma khalaq. Wa min sharri ghasiqin idha waqab. Wa min sharrin-naffathati fil-'uqad. Wa min sharri hasidin idha hasad. Qul a'udhu bi Rabbin-nas. Malikin-nas. Ilahin-nas. Min sharril-waswasil-khannas. Alladhi yuwaswisu fi sudurin-nas. Minal-jinnati wan-nas.", urdu: "کہہ دیجیے: وہ اللہ ایک ہے۔ اللہ بے نیاز ہے۔ نہ اس نے کسی کو جنا اور نہ وہ جنا گیا۔ اور نہ کوئی اس کے برابر کا ہے۔ کہہ دیجیے: میں صبح کے رب کی پناہ میں آتا ہوں، اس کی مخلوق کے شر سے، اور اندھیری رات کے شر سے جب وہ چھا جائے، اور گرہوں میں پھونکنے والیوں کے شر سے، اور حسد کرنے والے کے شر سے جب وہ حسد کرے۔ کہہ دیجیے: میں لوگوں کے رب کی پناہ میں آتا ہوں، لوگوں کے بادشاہ کی، لوگوں کے معبود کی، وسوسہ ڈالنے والے پیچھے ہٹ جانے والے کے شر سے، جو لوگوں کے سینوں میں وسوسے ڈالتا ہے، جنوں میں سے اور انسانوں میں سے۔", tafseel: "ہر نماز کے بعد ایک بار، فجر و مغرب میں 3 بار پڑھیں۔", hawala: "Sunan Abi Dawud 1523 - Sahih" },
            { cat: "namaz", title: "35. Zikr, Shukr aur Ibadat ki madad", arabic: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ", roman: "Allahumma a'inni 'ala dhikrika wa shukrika wa husni 'ibadatik", urdu: "اے اللہ! میری مدد فرما کہ میں تیرا ذکر کروں، تیرا شکر کروں اور بہترین طریقے سے تیری عبادت کروں۔", tafseel: "نبی ﷺ نے معاذ RA کو یہ دعا ہر نماز کے بعد کبھی نہ چھوڑنے کی وصیت کی۔", hawala: "Sunan Abi Dawud 1522 - Sahih" },
            { cat: "namaz", title: "36. Qayamat ke azab se panah", arabic: "رَبِّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ", roman: "Rabbi qini 'adhabaka yawma tab'athu 'ibadak", urdu: "اے میرے رب! مجھے اپنے عذاب سے بچا لے، جس دن تو اپنے بندوں کو اٹھائے گا۔", tafseel: "نبی ﷺ سلام کے بعد یہ دعا پڑھتے تھے۔", hawala: "Sahih Muslim 709" },
            { cat: "namaz", title: "37. Namaz ke baad in cheezon se panah", arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ", roman: "Allahumma inni a'udhu bika minal-jubn, wa a'udhu bika an uradda ila ardhalil-'umur, wa a'udhu bika min fitnatid-dunya, wa a'udhu bika min 'adhabil-qabr.", urdu: "اے اللہ! میں تیری پناہ مانگتا ہوں بزدلی سے، اور تیری پناہ مانگتا ہوں اس سے کہ مجھے سب سے نکمے بڑھاپے کی طرف لوٹا دیا جائے، اور تیری پناہ مانگتا ہوں دنیا کے فتنے سے، اور تیری پناہ مانگتا ہوں قبر کے عذاب سے۔", tafseel: "حضرت سعد RA اپنے بچوں کو یہ دعا اس طرح سکھاتے جیسے لکھنا سکھاتے ہیں۔", hawala: "Sahih al-Bukhari 2822" },
            { cat: "namaz", title: "38. Fajr ke baad: ilm, rizq aur amal ki dua", arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا", roman: "Allahumma inni as'aluka 'ilman nafi'an, wa rizqan tayyiban, wa 'amalan mutaqabbalan", urdu: "اے اللہ! میں تجھ سے نفع بخش علم، پاکیزہ (حلال) رزق اور مقبول عمل کا سوال کرتا ہوں۔", tafseel: "صرف فجر کی نماز کے بعد پڑھی جاتی ہے۔", hawala: "Sunan Ibn Majah 925 (Albani: Ibn Majah ki sanad mein ek majhul raawi hai, magar Tabarani ki jayyid sanad se saabit — Tamam al-Minna, p. 233)" },
            { cat: "namaz", title: "39. Panj waqta farz namaz", arabic: "إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَوْقُوتًا", roman: "Fajr 2, Zuhr 4, Asr 4, Maghrib 3, Isha 4 rak'at (farz). Inna as-salata kanat 'alal-mu'minina kitaban mawquta.", urdu: "بے شک نماز مومنوں پر مقررہ اوقات میں فرض ہے۔ فجر ۲، ظہر ۴، عصر ۴، مغرب ۳ اور عشاء ۴ رکعت۔", tafseel: "اسلام کا ستون۔ مردوں کے لیے مسجد میں جماعت سے پڑھنا تاکیدی ہے۔", hawala: "Sahih al-Bukhari 8; Sahih Muslim 16; Surah an-Nisa 4:103" },
            { cat: "namaz", title: "40. Sunnat-e-Mu'akkadah (Rawatib) - 12 rak'at", arabic: "", roman: "Fajr 2, Zuhr 4+2, Maghrib 2, Isha 2", urdu: "فرض کے علاوہ روزانہ 12 رکعت سنتیں پڑھنے والے کے لیے جنت میں گھر ہے۔", tafseel: "یہ تاکید والی سنتیں ہیں جو فرض کے ساتھ پڑھی جاتی ہیں۔", hawala: "Sahih Muslim 728; Sahih al-Bukhari 1180" },
            { cat: "namaz", title: "41. Fajr ki do sunnatein", arabic: "", roman: "Fajr ki farz se pehle 2 rak'at", urdu: "فجر کی دو سنتیں دنیا اور جو کچھ اس میں ہے اس سے بہتر ہیں۔", tafseel: "یہ بہت ہلکی اور مختصر پڑھی جاتی ہیں۔", hawala: "Sahih Muslim 725" },
            { cat: "namaz", title: "42. Witr", arabic: "", roman: "Isha ke baad se Fajr tak, 1, 3, 5, 7, 9 ya 11 rak'at", urdu: "رات کی نماز دو دو رکعت ہے، پھر ایک رکعت ملا کر وتر بنا لیں۔", tafseel: "رات کی آخری نماز۔", hawala: "Sahih al-Bukhari 990; Sahih Muslim 749" },
            { cat: "namaz", title: "43. Witr ki dua-e-Qunoot", arabic: "اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ، فَإِنَّكَ تَقْضِي وَلَا يُقْضَى عَلَيْكَ، وَإِنَّهُ لَا يَذِلُّ مَنْ وَالَيْتَ، وَلَا يَعِزُّ مَنْ عَادَيْتَ، تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ", roman: "Allahummahdini fiman hadayt, wa 'afini fiman 'afayt, wa tawallani fiman tawallayt, wa barik li fima a'tayt, wa qini sharra ma qadayt, fa-innaka taqdi wa la yuqda 'alayk, wa innahu la yadhillu man walayt, wa la ya'izzu man 'adayt, tabarakta Rabbana wa ta'alayt.", urdu: "اے اللہ! مجھے ان میں ہدایت دے جنہیں تو نے ہدایت دی، مجھے ان میں عافیت دے جنہیں تو نے عافیت دی، مجھے ان میں اپنا دوست بنا جنہیں تو نے اپنا دوست بنایا، جو کچھ تو نے مجھے دیا اس میں برکت دے، اور مجھے اس برے فیصلے سے بچا جو تو نے کیا، کیونکہ تو ہی فیصلہ کرتا ہے اور تجھ پر کوئی فیصلہ نہیں کیا جا سکتا؛ جسے تو اپنا دوست بنا لے وہ کبھی ذلیل نہیں ہوتا اور جس سے تو دشمنی کرے وہ کبھی عزت نہیں پاتا۔ اے ہمارے رب! تو برکت والا اور بلند ہے۔", tafseel: "وتر کی آخری رکعت میں پڑھی جاتی ہے۔", hawala: "Sunan Abi Dawud 1425 - Sahih (Albani: Sahih Sunan an-Nasa'i 1647; Asl Sifat Salat 3/973)" },
            { cat: "namaz", title: "44. Witr ke baad: Subhanal-Malikil-Quddus", arabic: "سُبْحَانَ الْمَلِكِ الْقُدُّوسِ", roman: "Subhanal-Malikil-Quddus", urdu: "پاک ہے وہ بادشاہ جو ہر عیب سے پاک ہے۔", tafseel: "وتر کے سلام کے بعد 3 بار، تیسری بار آواز بلند کر کے۔", hawala: "Sunan an-Nasa'i 1700 - Sahih" },
            { cat: "namaz", title: "45. Tahajjud / Qiyam-ul-Layl", arabic: "", roman: "Raat ka aakhri hissa, 2-2 rak'at, aksar 11 rak'at (witr samet)", urdu: "فرض کے بعد سب سے افضل نماز رات کی نماز ہے۔", tafseel: "رات کے آخری تہائی حصے میں اللہ کی خاص رحمت کا وقت ہوتا ہے۔", hawala: "Sahih Muslim 1163; Sahih al-Bukhari 1145" },
            { cat: "namaz", title: "46. Tarawih (Qiyam-e-Ramadan)", arabic: "", roman: "Ramzan ki raaton mein Isha ke baad", urdu: "جو رمضان میں ایمان اور ثواب کی نیت سے قیام کرے، اس کے پچھلے گناہ معاف کر دیے جاتے ہیں۔", tafseel: "رمضان میں رات کی نماز۔", hawala: "Sahih al-Bukhari 37; Sahih Muslim 759" },
            { cat: "namaz", title: "47. Salat-ud-Duha (Chasht)", arabic: "", roman: "Suraj buland hone ke baad se zawal se pehle tak, kam az kam 2 rak'at", urdu: "ہر جوڑ کے صدقے کے بدلے دو رکعت کافی ہیں۔", tafseel: "چاشت کے وقت پڑھی جاتی ہے۔", hawala: "Sahih Muslim 720" },
            { cat: "namaz", title: "48. Tahiyyat-ul-Masjid", arabic: "", roman: "Masjid mein dakhil hone par baithne se pehle 2 rak'at", urdu: "جب تم میں سے کوئی مسجد میں داخل ہو تو بیٹھنے سے پہلے دو رکعت پڑھ لے۔", tafseel: "مسجد کا حق۔", hawala: "Sahih al-Bukhari 444; Sahih Muslim 714" },
            { cat: "namaz", title: "49. Tahiyyat-ul-Wudu", arabic: "", roman: "Wudu ke baad 2 rak'at", urdu: "وضو کے بعد دو رکعت پڑھنا حضرت بلال RA کا معمول تھا۔", tafseel: "جس پر نبی ﷺ نے انہیں جنت کی خوشخبری دی۔", hawala: "Sahih al-Bukhari 1149; Sahih Muslim 2458" },
            { cat: "namaz", title: "50. Maghrib se pehle 2 rak'at", arabic: "", roman: "Maghrib ki azan aur iqamat ke darmiyan 2 rak'at", urdu: "مغرب سے پہلے نماز پڑھو (جو چاہے)۔", tafseel: "یہ سنت غیر مؤکدہ ہے۔", hawala: "Sahih al-Bukhari 1183" },
            { cat: "namaz", title: "51. Salat-ut-Taubah", arabic: "", roman: "Gunah ho jane ke baad 2 rak'at", urdu: "جو گناہ کرے پھر وضو کر کے دو رکعت پڑھے اور استغفر کرے، اللہ اسے بخش دیتا ہے۔", tafseel: "توبہ کی نماز۔", hawala: "Sunan Abi Dawud 1521 - Sahih" },
            { cat: "namaz", title: "52. Jumu'ah ki namaz", arabic: "", roman: "Jumu'ah ke din Zuhr ke bajaye 2 rak'at farz", urdu: "جمعہ کے دن نماز کے لیے پکارا جائے تو اللہ کے ذکر کی طرف دوڑو۔", tafseel: "مردوں پر فرض ہے۔", hawala: "Surah Al-Jumu'ah 62:9" },
            { cat: "namaz", title: "53. Eidain ki namaz", arabic: "", roman: "Eid ul-Fitr aur Eid ul-Adha, 2 rak'at (khutbe se pehle)", urdu: "نبی ﷺ عید کے دن عیدگاہ جاتے، پہلے نماز پڑھتے پھر خطبہ دیتے۔", tafseel: "عید کی نماز۔", hawala: "Sahih al-Bukhari 956; Sahih Muslim 889" },
            { cat: "namaz", title: "54. Namaz-e-Janazah", arabic: "", roman: "4 takbirat, bina ruku aur sajde ke", urdu: "جنازے کے ساتھ چلنے والے کو ایک قیراط کا ثواب ہے۔", tafseel: "فرض کفایہ۔", hawala: "Sahih al-Bukhari 1325; Sahih Muslim 945" },
            { cat: "namaz", title: "55. Namaz-e-Kusuf", arabic: "", roman: "Suraj/chand grahan par 2 rak'at, har rak'at mein do ruku", urdu: "سورج اور چاند اللہ کی نشانیاں ہیں، گرہن لگے تو نماز پڑھو، دعا کرو اور صدقہ دو۔", tafseel: "گرہن کی نماز۔", hawala: "Sahih al-Bukhari 1044; Sahih Muslim 901" },
            { cat: "namaz", title: "56. Namaz-e-Istisqa", arabic: "", roman: "Khushk-sali ke waqt khule maidan mein 2 rak'at", urdu: "نبی ﷺ بارش کی دعا کے لیے میدان میں نکلے، قبلہ کی طرف منہ کیا، چادر الٹی اور دو رکعت پڑھیں۔", tafseel: "بارش کی نماز۔", hawala: "Sahih al-Bukhari 1012; Sahih Muslim 894" },
            { cat: "namaz", title: "57. Safar mein namaz ka qasr", arabic: "", roman: "Zuhr, Asr, Isha ki 4 rak'at ki jagah 2 rak'at", urdu: "یہ ایک صدقہ ہے جو اللہ نے تم پر کیا ہے، اسے قبول کرو۔", tafseel: "سفر میں قصر۔", hawala: "Sahih Muslim 686" },
            { cat: "namaz", title: "58. Nafl namaz ghar mein", arabic: "", roman: "Farz ke alawa nafl ghar mein padhna afzal", urdu: "اپنے گھروں میں نماز پڑھو، کیونکہ انسان کی افضل نماز وہ ہے جو وہ اپنے گھر میں پڑھے (سوائے فرض کے)۔", tafseel: "گھر میں نفل پڑھنے کی فضیلت۔", hawala: "Sahih al-Bukhari 731; Sahih Muslim 781" },
            { cat: "namaz", title: "59. Salat-ul-Istikhara ka tareeqa", arabic: "اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ، فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ، وَتَعْلَمُ وَلَا أَعْلَمُ، وَأَنْتَ عَلَّامُ الْغُيُوبِ. اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ (اپنے کام کا نام لیں) خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي، فَاقْدُرْهُ لِي وَيَسِّرْهُ لِي ثُمَّ بَارِكْ لِي فِيهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي، فَاصْرِفْهُ عَنِّي وَاصْرِفْنِي عَنْهُ، وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ ثُمَّ أَرْضِنِي بِهِ", roman: "Allahumma inni astakhiruka bi 'ilmik, wa astaqdiruka bi qudratik, wa as'aluka min fadlikal-'azim, fa-innaka taqdiru wa la aqdir, wa ta'lamu wa la a'lam, wa anta 'allamul-ghuyub. Allahumma in kunta ta'lamu anna hadhal-amra (apne kaam ka naam lein) khayrul-li fi dini wa ma'ashi wa 'aqibati amri, faqdurhu li wa yassirhu li thumma barik li fih. Wa in kunta ta'lamu anna hadhal-amra sharrul-li fi dini wa ma'ashi wa 'aqibati amri, fasrifhu 'anni wasrifni 'anhu, waqdur liyal-khayra haythu kana thumma ardini bih.", urdu: "اے اللہ! میں تیرے علم کے وسیلے سے تجھ سے بھلائی طلب کرتا ہوں، تیری قدرت کے وسیلے سے تجھ سے طاقت مانگتا ہوں، اور تجھ سے تیرے عظیم فضل کا سوال کرتا ہوں، کیونکہ تو قدرت رکھتا ہے اور میں نہیں رکھتا، تو جانتا ہے اور میں نہیں جانتا، اور تو غیب کی باتوں کو خوب جاننے والا ہے۔ اے اللہ! اگر تیرے علم میں یہ کام (یہاں اپنے کام کا نام لیں) میرے لیے میرے دین، میری زندگی اور میرے انجام کے لیے بہتر ہے (یا فرمایا: میری دنیا اور آخرت کے لیے) تو اسے میرے لیے مقدر کر دے، میرے لیے آسان کر دے، پھر اس میں میرے لیے برکت دے۔ اور اگر تیرے علم میں یہ کام میرے لیے میرے دین، میری زندگی اور میرے انجام کے لیے برا ہے (یا فرمایا: میری دنیا اور آخرت کے لیے) تو اسے مجھ سے پھیر دے اور مجھے اس سے پھیر دے، اور جہاں بھی بھلائی ہو میرے لیے مقدر کر دے، پھر مجھے اس پر راضی کر دے۔", tafseel: "کسی جائز کام کے ارادے پر 2 رکعت نفل پڑھ کر یہ دعا پڑھیں۔", hawala: "Sahih al-Bukhari 1162" },

            // --- SUBAH SHAM AZKAR ---
            { cat: "subah", title: "1. Neend se uthne ki dua", arabic: "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", roman: "Alhamdulillahil-ladhi ahyana ba'da ma amatana wa ilayhin-nushur", urdu: "تمام تعریف اللہ کے لیے ہے جس نے ہمیں (نیند کی) موت کے بعد زندہ کیا، اور اسی کی طرف اٹھ کر جانا ہے۔", tafseel: "نیند کو ایک قسم کی موت کہا گیا ہے۔ صبح جاگنا ایک نئی زندگی ہے۔", hawala: "Sahih al-Bukhari 6312" },
            { cat: "subah", title: "2. Ghar se nikalte waqt", arabic: "بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", roman: "Bismillah, tawakkaltu 'alallah, wa la hawla wa la quwwata illa billah", urdu: "اللہ کے نام کے ساتھ، میں نے اللہ پر بھروسا کیا، اور گناہ سے بچنے کی کوئی طاقت اور نیکی کی کوئی قوت نہیں مگر اللہ کی مدد سے۔", tafseel: "گھر سے نکلتے وقت یہ پڑھنے سے ہدایت، کفایت اور حفاظت کا وعدہ ہے۔", hawala: "Sunan Abi Dawud 5095; Tirmidhi 3426 - Sahih" },
            { cat: "subah", title: "3. Teeno Qul (Subah + Sham 3-3 martaba)", arabic: "قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ﴿٤﴾ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِنْ شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾ قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾", roman: "Qul huwallahu ahad. Allahus-Samad. Lam yalid wa lam yulad. Wa lam yakun lahu kufuwan ahad. Qul a'udhu bi Rabbil-falaq. Min sharri ma khalaq. Wa min sharri ghasiqin idha waqab. Wa min sharrin-naffathati fil-'uqad. Wa min sharri hasidin idha hasad. Qul a'udhu bi Rabbin-nas. Malikin-nas. Ilahin-nas. Min sharril-waswasil-khannas. Alladhi yuwaswisu fi sudurin-nas. Minal-jinnati wan-nas.", urdu: "کہہ دیجیے: وہ اللہ ایک ہے۔ اللہ بے نیاز ہے۔ نہ اس نے کسی کو جنا اور نہ وہ جنا گیا۔ اور نہ کوئی اس کے برابر کا ہے۔ کہہ دیجیے: میں صبح کے رب کی پناہ میں آتا ہوں، اس کی مخلوق کے شر سے، اور اندھیری رات کے شر سے جب وہ چھا جائے، اور گرہوں میں پھونکنے والیوں کے شر سے، اور حسد کرنے والے کے شر سے جب وہ حسد کرے۔ کہہ دیجیے: میں لوگوں کے رب کی پناہ میں آتا ہوں، لوگوں کے بادشاہ کی، لوگوں کے معبود کی، وسوسہ ڈالنے والے پیچھے ہٹ جانے والے کے شر سے، جو لوگوں کے سینوں میں وسوسے ڈالتا ہے، جنوں میں سے اور انسانوں میں سے۔", tafseel: "صبح و شام 3-3 بار پڑھنا ہر چیز سے کافی ہے۔", hawala: "Sunan Abi Dawud 5082 - Sahih (Albani: Sahih al-Jami' 4406)" },
            { cat: "subah", title: "4. Din ki bhalai maangne ki dua (Asbahna...)", arabic: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", roman: "Asbahna wa asbahal-mulku lillah, walhamdu lillah, la ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamdu wa huwa 'ala kulli shay'in qadir. Rabbi as'aluka khayra ma fi hadhal-yawmi wa khayra ma ba'dah, wa a'udhu bika min sharri ma fi hadhal-yawmi wa sharri ma ba'dah. Rabbi a'udhu bika minal-kasali wa su'il-kibar, Rabbi a'udhu bika min 'adhabin fin-nari wa 'adhabin fil-qabr. (Sham ko 'Amsayna wa amsal-mulku lillah' kahein aur 'is raat ki bhalai aur is raat ke shar' kahein.)", urdu: "ہم نے صبح کی اور بادشاہی اللہ ہی کی ہے، تمام تعریف اللہ کے لیے ہے، اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے اس کا کوئی شریک نہیں، اسی کی بادشاہی ہے اور اسی کی حمد ہے اور وہ ہر چیز پر قادر ہے۔ اے میرے رب! میں تجھ سے اس دن کی بھلائی اور اس کے بعد کی بھلائی مانگتا ہوں، اور اس دن کے شر اور اس کے بعد کے شر سے تیری پناہ چاہتا ہوں۔ اے میرے رب! سستی اور بڑھاپے کی برائی سے تیری پناہ چاہتا ہوں۔ اے میرے رب! جہنم کے عذاب اور قبر کے عذاب سے تیری پناہ چاہتا ہوں۔ (شام کو «أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ» کہے، اور «اس رات کی بھلائی اور اس رات کے شر» کہے۔)", tafseel: "شام کو 'أمسينا' (Amsayna) سے شروع کریں اور رات کا ذکر کریں۔", hawala: "Sahih Muslim 2723" },
            { cat: "subah", title: "5. Nuqsan se hifazat ki dua (3 martaba)", arabic: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", roman: "Bismillahil-ladhi la yadurru ma'asmihi shay'un fil-ardi wa la fis-sama'i wa huwas-Sami'ul-'Alim", urdu: "اللہ کے نام کے ساتھ، جس کے نام کی موجودگی میں زمین و آسمان کی کوئی چیز نقصان نہیں پہنچا سکتی، اور وہ خوب سننے والا، خوب جاننے والا ہے۔", tafseel: "صبح و شام 3 بار پڑھنے سے کوئی چیز نقصان نہیں پہنچا سکتی۔", hawala: "Sunan Abi Dawud 5088 - Sahih (Albani: Sahih al-Jami' 5745)" },
            { cat: "subah", title: "6. Afiyat (sehat, salamati) ki jaame dua", arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي", roman: "Allahumma inni as'alukal-'afiyata fid-dunya wal-akhirah. Allahumma inni as'alukal-'afwa wal-'afiyata fi dini wa dunyaya wa ahli wa mali. Allahummastur 'awrati wa amin raw'ati. Allahummahfazni min bayni yadayya wa min khalfi wa 'an yamini wa 'an shimali wa min fawqi, wa a'udhu bi 'azamatika an ughtala min tahti.", urdu: "اے اللہ! میں تجھ سے دنیا و آخرت میں عافیت مانگتا ہوں۔ اے اللہ! میں تجھ سے اپنے دین، دنیا، اہل و عیال اور مال میں معافی اور عافیت مانگتا ہوں۔ اے اللہ! میرے عیبوں پر پردہ ڈال دے اور میری گھبراہٹوں کو امن میں بدل دے۔ اے اللہ! میری حفاظت فرما میرے آگے سے، پیچھے سے، دائیں سے، بائیں سے اور اوپر سے، اور میں تیری عظمت کی پناہ مانگتا ہوں کہ اچانک اپنے نیچے سے ہلاک کیا جاؤں۔", tafseel: "افیت کا مطلب ہر طرح کی سلامتی ہے: جسیم، دین، مال اور گھر والوں کی۔", hawala: "Sunan Abi Dawud 5074 - Sahih" },
            { cat: "subah", title: "7. Mamlaat sanwarne ki dua (Fatima RA ki wasiyat)", arabic: "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ", roman: "Ya Hayyu ya Qayyumu bi rahmatika astaghith, aslih li sha'ni kullahu, wa la takilni ila nafsi tarfata 'ayn", urdu: "اے زندہ! اے سب کو تھامنے والے! میں تیری رحمت کے وسیلے سے فریاد کرتا ہوں، میرے سارے معاملات سنوار دے، اور مجھے پلک جھپکنے کے برابر بھی میرے نفس کے سپرد نہ کر۔", tafseel: "نبی ﷺ نے فاطمہ RA کو یہ صبح و شام پڑھنے کی وصیت کی۔", hawala: "an-Nasa'i fi 'Amalil-Yawm 570 - Hasan (Albani: Sahih al-Jami' 5820)" },
            { cat: "subah", title: "8. Nafs aur shaitan ke shar se panah (Abu Bakr RA ko sikhayi)", arabic: "اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ", roman: "Allahumma 'alimal-ghaybi wash-shahadah, fatiras-samawati wal-ard, Rabba kulli shay'in wa malikah, ashhadu an la ilaha illa ant, a'udhu bika min sharri nafsi, wa min sharrish-shaytani wa shirkih, wa an aqtarifa 'ala nafsi su'an aw ajurrahu ila muslim.", urdu: "اے اللہ! غیب اور حاضر کے جاننے والے، آسمانوں اور زمین کے پیدا کرنے والے، ہر چیز کے رب اور اس کے مالک! میں گواہی دیتا ہوں کہ تیرے سوا کوئی معبود نہیں۔ میں اپنے نفس کے شر سے، شیطان کے شر اور اس کے شرک سے، اور اس بات سے تیری پناہ مانگتا ہوں کہ میں اپنے آپ پر کوئی برائی کروں یا اسے کسی مسلمان کی طرف کھینچ لاؤں۔", tafseel: "صبح، شام اور سونے سے پہلے پڑھیں۔", hawala: "Sunan Abi Dawud 5067 - Sahih" },
            { cat: "subah", title: "9. Iman ki tajdeed ka kalimah", arabic: "رَضِيتُ بِاللَّهِ رَبَّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ نَبِيًّا", roman: "Raditu billahi rabban, wa bil-Islami dinan, wa bi Muhammadin nabiyyan", urdu: "میں اللہ کے رب ہونے، اسلام کے دین ہونے اور محمد ﷺ کے نبی ہونے پر راضی ہوں۔", tafseel: "جو اسے دل سے مانے، اس کے لیے جنت واجب ہو جاتی ہے۔", hawala: "Sahih Muslim 1884" },
            { cat: "subah", title: "10. Subhanallah wa bihamdihi (100 martaba)", arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", roman: "Subhanallah wa bihamdihi", urdu: "اللہ پاک ہے اور میں اس کی حمد کے ساتھ اس کی تسبیح بیان کرتا ہوں۔", tafseel: "صبح و شام 100 بار پڑھنے سے گناہ معاف ہوتے ہیں۔", hawala: "Sahih Muslim 2692; Sahih al-Bukhari 6405" },
            { cat: "subah", title: "11. La ilaha illallah (100 martaba)", arabic: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", roman: "La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamdu wa huwa 'ala kulli shay'in qadir", urdu: "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں، اسی کی بادشاہی ہے اور اسی کی حمد ہے اور وہ ہر چیز پر قادر ہے۔", tafseel: "دن میں 100 بار پڑھنے سے 10 غلام آزاد کرنے کا ثواب، 100 نیکیاں، 100 گناہ معاف اور شام تک شیطان سے حفاظت۔", hawala: "Sahih al-Bukhari 3293; Sahih Muslim 2691" },
            { cat: "subah", title: "12. Darood Shareef", arabic: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ. اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ", roman: "Allahumma salli 'ala Muhammadin wa 'ala ali Muhammad, kama sallayta 'ala Ibrahima wa 'ala ali Ibrahim, innaka Hamidun Majid. Allahumma barik 'ala Muhammadin wa 'ala ali Muhammad, kama barakta 'ala Ibrahima wa 'ala ali Ibrahim, innaka Hamidun Majid.", urdu: "اے اللہ! محمد ﷺ اور آلِ محمد پر رحمت نازل فرما جیسے تو نے ابراہیم اور آلِ ابراہیم پر رحمت نازل فرمائی، بے شک تو تعریف کے لائق، بزرگی والا ہے۔ اے اللہ! محمد ﷺ اور آلِ محمد پر برکت نازل فرما جیسے تو نے ابراہیم اور آلِ ابراہیم پر برکت نازل فرمائی، بے شک تو تعریف کے لائق، بزرگی والا ہے۔", tafseel: "جو مجھ پر ایک بار درود بھیجے، اللہ اس پر 10 رحمتیں نازل کرتا ہے۔", hawala: "Sahih al-Bukhari 3370; Sahih Muslim 408" },
            { cat: "subah", title: "13. Sayyidul Istighfar", arabic: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", roman: "Allahumma anta Rabbi la ilaha illa ant, khalaqtani wa ana 'abduk, wa ana 'ala 'ahdika wa wa'dika mastata'tu, a'udhu bika min sharri ma sana'tu, abu'u laka bini'matika 'alayya, wa abu'u bidhanbi faghfir li, fa-innahu la yaghfirudh-dhunuba illa ant.", urdu: "اے اللہ! تو میرا رب ہے، تیرے سوا کوئی معبود نہیں۔ تو نے مجھے پیدا کیا اور میں تیرا بندہ ہوں، اور اپنی استطاعت کے مطابق تیرے عہد اور وعدے پر قائم ہوں۔ میں نے جو کچھ کیا اس کے شر سے تیری پناہ مانگتا ہوں۔ مجھ پر تیری جو نعمت ہے اس کا اقرار کرتا ہوں اور اپنے گناہ کا اعتراف کرتا ہوں، پس مجھے بخش دے، کیونکہ تیرے سوا کوئی گناہ نہیں بخشتا۔", tafseel: "جو یقین کے ساتھ صبح یا شام پڑھے اور اسی دن مر جائے، وہ جنت میں جائے گا۔", hawala: "Sahih al-Bukhari 6306" },
            { cat: "subah", title: "14. Rasulullah ﷺ ka roz ka istighfar (100 martaba)", arabic: "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", roman: "Astaghfirullaha wa atubu ilayh", urdu: "میں اللہ سے معافی مانگتا ہوں اور اسی کی طرف توبہ کرتا ہوں۔", tafseel: "نبی ﷺ روز 100 بار استغفر کرتے تھے۔", hawala: "Sahih Muslim 2702; Sahih al-Bukhari 6307" },
            { cat: "subah", title: "15. Gunahon ki muafi ka mukammal istighfar", arabic: "أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ", roman: "Astaghfirullahal-'Azim alladhi la ilaha illa huwal-Hayyul-Qayyumu wa atubu ilayh", urdu: "میں اللہ عظمت والے سے بخشش مانگتا ہوں جس کے سوا کوئی معبود نہیں، جو زندہ اور سب کو تھامنے والا ہے، اور میں اسی کی طرف توبہ کرتا ہوں۔", tafseel: "جو یہ کہے، اللہ اسے بخش دیتا ہے، چاہے وہ جنگ سے بھاگا ہو۔", hawala: "Sunan Abi Dawud 1517 - Sahih" },
            { cat: "subah", title: "16. Rabbi ghfir li wa tub 'alayya", arabic: "رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ", roman: "Rabbighfir li wa tub 'alayya, innaka antat-Tawwabur-Rahim", urdu: "اے میرے رب! مجھے بخش دے اور میری توبہ قبول فرما، بے شک تو ہی بہت توبہ قبول کرنے والا، نہایت رحم کرنے والا ہے۔", tafseel: "نبی ﷺ ایک ہی مجلس میں 100 بار یہ پڑھتے تھے۔", hawala: "Sunan Abi Dawud 1516 - Sahih" },
            { cat: "subah", title: "17. Saare gunahon ki muafi ki dua", arabic: "اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ", roman: "Allahummaghfir li dhanbi kullahu, diqqahu wa jillahu, wa awwalahu wa akhirahu, wa 'alaniyatahu wa sirrah.", urdu: "اے اللہ! میرے سارے گناہ بخش دے، چھوٹے بھی اور بڑے بھی، پہلے بھی اور بعد کے بھی، کھلے بھی اور چھپے بھی۔", tafseel: "سجدے میں یا ہر وقت پڑھ سکتے ہیں۔", hawala: "Sahih Muslim 483" },
            { cat: "subah", title: "18. Adam AS ki tauba ki dua", arabic: "رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ", roman: "Rabbana zalamna anfusana wa in lam taghfir lana wa tarhamna lanakunanna minal-khasirin", urdu: "اے ہمارے رب! ہم نے اپنی جانوں پر ظلم کیا، اور اگر تو نے ہمیں نہ بخشا اور ہم پر رحم نہ کیا تو ہم ضرور نقصان اٹھانے والوں میں سے ہو جائیں گے۔", tafseel: "یہ انسان کی پہلی توبہ ہے۔", hawala: "Surah Al-A'raf 7:23" },
            { cat: "subah", title: "19. Maafi (Afw) ki dua", arabic: "اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي", roman: "Allahumma innaka 'afuwwun tuhibbul-'afwa fa'fu 'anni", urdu: "اے اللہ! بے شک تو بہت معاف کرنے والا ہے، معافی کو پسند کرتا ہے، پس مجھے معاف فرما دے۔", tafseel: "خاص طور پر رمضان کی آخری راتوں میں پڑھیں۔", hawala: "Sunan at-Tirmidhi 3513 - Sahih (Albani: as-Sahiha 3337)" },

            // --- MUSHKIL & PARESHANI ---
            { cat: "mushkil", title: "1. Pareshani aur Takleef ki dua (Dua-ul-Karb)", arabic: "لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ", roman: "La ilaha illallahul-'Azimul-Halim, la ilaha illallahu Rabbul-'Arshil-'Azim, la ilaha illallahu Rabbus-samawati wa Rabbul-ardi wa Rabbul-'Arshil-Karim.", urdu: "اللہ کے سوا کوئی معبود نہیں جو عظمت والا، بردبار ہے۔ اللہ کے سوا کوئی معبود نہیں جو عرشِ عظیم کا رب ہے۔ اللہ کے سوا کوئی معبود نہیں جو آسمانوں کا رب، زمین کا رب اور عزت والے عرش کا رب ہے۔", tafseel: "پریشانی کے وقت یہ پڑھنے سے دل کو سکون ملتا ہے۔", hawala: "Sahih al-Bukhari 6345; Sahih Muslim 2730" },
            { cat: "mushkil", title: "2. Bechaini mein: Allahumma rahmataka arju", arabic: "اللَّهُمَّ رَحْمَتَكَ أَرْجُو، فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ، لَا إِلَهَ إِلَّا أَنْتَ", roman: "Allahumma rahmataka arju, fala takilni ila nafsi tarfata 'aynin, wa aslih li sha'ni kullahu, la ilaha illa ant", urdu: "اے اللہ! میں تیری رحمت کا امیدوار ہوں، پس مجھے پلک جھپکنے کے برابر بھی میرے نفس کے سپرد نہ کر، اور میرے سارے معاملات درست کر دے، تیرے سوا کوئی معبود نہیں۔", tafseel: "جب انسان خود کو بے بس محسوس کرے تو یہ دعا دل کو مضبوطی دیتی ہے۔", hawala: "Sunan Abi Dawud 5090 - Hasan (Albani: Sahih al-Jami' 3388)" },
            { cat: "mushkil", title: "3. Yunus AS ki dua", arabic: "لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", roman: "La ilaha illa anta subhanaka inni kuntu minaz-zalimin", urdu: "تیرے سوا کوئی معبود نہیں، تو پاک ہے، بے شک میں ظالموں میں سے ہوں۔", tafseel: "ہر مشکل اور حاجت کے لیے پڑھی جا سکتی ہے۔", hawala: "Sunan at-Tirmidhi 3505 - Sahih; Surah Al-Anbiya 21:87" },
            { cat: "mushkil", title: "4. Gham, Fikr aur Qarz se panah", arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ", roman: "Allahumma inni a'udhu bika minal-hammi wal-hazan, wal-'ajzi wal-kasal, wal-bukhli wal-jubn, wa dala'id-dayni wa ghalabatir-rijal.", urdu: "اے اللہ! میں تیری پناہ مانگتا ہوں فکر اور غم سے، عاجزی اور سستی سے، بخل اور بزدلی سے، قرض کے بوجھ سے اور لوگوں کے غلبے سے۔", tafseel: "نبی ﷺ اکثر یہ دعا پڑھتے تھے۔", hawala: "Sahih al-Bukhari 6369" },
            { cat: "mushkil", title: "5. Hasbunallah (Dushman/Khauf ke waqt)", arabic: "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ", roman: "Hasbunallahu wa ni'mal-wakil", urdu: "ہمیں اللہ کافی ہے اور وہ بہترین کارساز ہے۔", tafseel: "ابراہیم AS نے آگ میں ڈالے جانے کے وقت یہ کہا۔", hawala: "Sahih al-Bukhari 4563; Surah Aal-e-Imran 3:173" },
            { cat: "mushkil", title: "6. La hawla wa la quwwata illa billah", arabic: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", roman: "La hawla wa la quwwata illa billah", urdu: "گناہ سے بچنے کی کوئی طاقت اور نیکی کرنے کی کوئی قوت نہیں مگر اللہ کی مدد سے۔", tafseel: "یہ جنت کے خزانوں میں سے ایک خزانہ ہے۔", hawala: "Sahih al-Bukhari 4205; Sahih Muslim 2704" },
            { cat: "mushkil", title: "7. Musibat pahunchne par", arabic: "إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَخْلِفْ لِي خَيْرًا مِنْهَا", roman: "Inna lillahi wa inna ilayhi raji'un, Allahumma'jurni fi musibati wa akhlif li khayran minha", urdu: "بے شک ہم اللہ ہی کے ہیں اور اسی کی طرف لوٹ کر جانے والے ہیں۔ اے اللہ! مجھے میری مصیبت میں اجر دے اور اس کے بدلے مجھے اس سے بہتر عطا فرما۔", tafseel: "حضرت ام سلمہ RA نے یہ پڑھا تو اللہ نے انہیں نبی ﷺ عطا فرمائے۔", hawala: "Sahih Muslim 918" },

            // --- BIMARI & SHIFA ---
            { cat: "bimari", title: "1. Jism mein dard ho to (Ruqyah)", arabic: "بِسْمِ اللَّهِ (3 بار) أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ (7 بار)", roman: "Bismillah (3 times). A'udhu billahi wa qudratihi min sharri ma ajidu wa uhadhir (7 times).", urdu: "اللہ کے نام سے (3 بار)۔ میں اللہ اور اس کی قدرت کی پناہ مانگتا ہوں اس چیز کے شر سے جو میں محسوس کرتا ہوں اور جس سے ڈرتا ہوں (7 بار)۔", tafseel: "درد کی جگہ پر ہاتھ رکھ کر یہ مسنون علاج کریں۔", hawala: "Sahih Muslim 2202" },
            { cat: "bimari", title: "2. Bimar ke liye shifa ki dua", arabic: "اللَّهُمَّ رَبَّ النَّاسِ، أَذْهِبِ الْبَأْسَ، اشْفِ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا", roman: "Allahumma Rabban-nas, adhhibil-ba's, ishfi antash-Shafi, la shifa'a illa shifa'uk, shifa'an la yughadiru saqama.", urdu: "اے اللہ! لوگوں کے رب! تکلیف دور فرما، شفا دے، تو ہی شفا دینے والا ہے، تیری شفا کے سوا کوئی شفا نہیں، ایسی شفا دے جو کوئی بیماری نہ چھوڑے۔", tafseel: "نبی ﷺ بیمار پر ہاتھ پھیرتے اور یہ دعا پڑھتے تھے۔", hawala: "Sahih al-Bukhari 5675; Sahih Muslim 2191" },
            { cat: "bimari", title: "3. Ayyub AS ki dua (Sakht bimari mein)", arabic: "أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ", roman: "Anni massaniyad-durru wa anta arhamur-rahimin", urdu: "مجھے تکلیف پہنچی ہے اور تو سب رحم کرنے والوں سے زیادہ رحم کرنے والا ہے۔", tafseel: "حضرت ایوب AS نے لمبی بیماری میں صبر کیا اور یہ دعا کی۔", hawala: "Surah Al-Anbiya 21:83" },

            // --- SONE SE PEHLE ---
            { cat: "sone", title: "1. Ayatul Kursi", arabic: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ", roman: "Allahu la ilaha illa huwal-Hayyul-Qayyum, la ta'khudhuhu sinatun wa la nawm, lahu ma fis-samawati wa ma fil-ard, man dhal-ladhi yashfa'u 'indahu illa bi-idhnih, ya'lamu ma bayna aydihim wa ma khalfahum, wa la yuhituna bishay'im-min 'ilmihi illa bima sha', wasi'a kursiyyuhus-samawati wal-ard, wa la ya'uduhu hifzuhuma, wa huwal-'Aliyyul-'Azim.", urdu: "اللہ کے سوا کوئی معبود نہیں، وہ زندہ ہے، سب کو تھامنے والا ہے۔ اسے نہ اونگھ آتی ہے نہ نیند۔ جو کچھ آسمانوں میں اور زمین میں ہے سب اسی کا ہے۔ کون ہے جو اس کی اجازت کے بغیر اس کے پاس سفارش کرے؟ وہ جانتا ہے جو ان کے سامنے ہے اور جو ان کے پیچھے ہے، اور وہ اس کے علم میں سے کسی چیز کا احاطہ نہیں کر سکتے مگر جتنا وہ چاہے۔ اس کی کرسی آسمانوں اور زمین کو گھیرے ہوئے ہے، اور ان کی حفاظت اسے تھکاتی نہیں، اور وہ بلند و عظمت والا ہے۔", tafseel: "سوتے وقت پڑھنے سے ایک نگہبان مقرر ہوتا ہے اور شیطان قریب نہیں آتا۔", hawala: "Sahih al-Bukhari 2311" },
            { cat: "sone", title: "2. Teeno Qul (Sone se pehle 3 martaba)", arabic: "قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ﴿٤﴾ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِنْ شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾ قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾", roman: "Qul huwallahu ahad. Allahus-Samad. Lam yalid wa lam yulad. Wa lam yakun lahu kufuwan ahad. Qul a'udhu bi Rabbil-falaq. Min sharri ma khalaq. Wa min sharri ghasiqin idha waqab. Wa min sharrin-naffathati fil-'uqad. Wa min sharri hasidin idha hasad. Qul a'udhu bi Rabbin-nas. Malikin-nas. Ilahin-nas. Min sharril-waswasil-khannas. Alladhi yuwaswisu fi sudurin-nas. Minal-jinnati wan-nas.", urdu: "کہہ دیجیے: وہ اللہ ایک ہے۔ اللہ بے نیاز ہے۔ نہ اس نے کسی کو جنا اور نہ وہ جنا گیا۔ اور نہ کوئی اس کے برابر کا ہے۔ کہہ دیجیے: میں صبح کے رب کی پناہ میں آتا ہوں، اس کی مخلوق کے شر سے، اور اندھیری رات کے شر سے جب وہ چھا جائے، اور گرہوں میں پھونکنے والیوں کے شر سے، اور حسد کرنے والے کے شر سے جب وہ حسد کرے۔ کہہ دیجیے: میں لوگوں کے رب کی پناہ میں آتا ہوں، لوگوں کے بادشاہ کی، لوگوں کے معبود کی، وسوسہ ڈالنے والے پیچھے ہٹ جانے والے کے شر سے، جو لوگوں کے سینوں میں وسوسے ڈالتا ہے، جنوں میں سے اور انسانوں میں سے۔", tafseel: "ہاتھوں میں پھونک کر جسم پر پھیریں، 3 بار کریں۔", hawala: "Sahih al-Bukhari 5017" },
            { cat: "sone", title: "3. Surah Baqarah ki aakhri 2 ayaat", arabic: "آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ﴿٢٨٥﴾ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ﴿٢٨٦﴾", roman: "Amanar-Rasulu bima unzila ilayhi mir-Rabbihi wal-mu'minun, kullun amana billahi wa mala'ikatihi wa kutubihi wa rusulih, la nufarriqu bayna ahadim-mir-rusulih, wa qalu sami'na wa ata'na ghufranaka Rabbana wa ilaykal-masir. La yukallifullahu nafsan illa wus'aha, laha ma kasabat wa 'alayha maktasabat, Rabbana la tu'akhidhna in nasina aw akhta'na, Rabbana wa la tahmil 'alayna isran kama hamaltahu 'alal-ladhina min qablina, Rabbana wa la tuhammilna ma la taqata lana bih, wa'fu 'anna waghfir lana warhamna, anta mawlana fansurna 'alal-qawmil-kafirin.", urdu: "رسول ﷺ اس پر ایمان لائے جو ان کے رب کی طرف سے ان پر اتارا گیا، اور مومن بھی۔ سب اللہ پر، اس کے فرشتوں پر، اس کی کتابوں پر اور اس کے رسولوں پر ایمان لائے (اور کہتے ہیں:) ہم اس کے رسولوں میں کوئی فرق نہیں کرتے۔ اور انہوں نے کہا: ہم نے سنا اور مان لیا، اے ہمارے رب! تیری بخشش چاہیے اور تیری ہی طرف لوٹنا ہے۔ اللہ کسی جان پر اس کی طاقت سے زیادہ بوجھ نہیں ڈالتا۔ جو نیکی اس نے کمائی اس کا فائدہ اسی کو، اور جو برائی کمائی اس کا نقصان اسی پر۔ اے ہمارے رب! اگر ہم بھول جائیں یا خطا کریں تو ہمیں نہ پکڑنا۔ اے ہمارے رب! ہم پر وہ بوجھ نہ ڈال جو تو نے ہم سے پہلے لوگوں پر ڈالا۔ اے ہمارے رب! ہم سے وہ بوجھ نہ اٹھوا جس کی ہمیں طاقت نہیں، اور ہمیں معاف کر، ہمیں بخش دے اور ہم پر رحم فرما، تو ہی ہمارا مولیٰ ہے، پس کافروں کے مقابلے میں ہماری مدد فرما۔", tafseel: "جو رات کو یہ پڑھے، یہ اسے کافی ہو جاتی ہیں۔", hawala: "Sahih al-Bukhari 5009; Sahih Muslim 807" },
            { cat: "sone", title: "4. Sone ki dua", arabic: "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", roman: "Bismika Allahumma amutu wa ahya", urdu: "اے اللہ! تیرے ہی نام کے ساتھ میں مرتا ہوں (سوتا ہوں) اور جیتا ہوں (جاگتا ہوں)۔", tafseel: "نیند کو موت کا بھائی کہا گیا ہے۔", hawala: "Sahih al-Bukhari 6324" },
            { cat: "sone", title: "5. Tasbeeh-e-Fatima RA", arabic: "سُبْحَانَ اللَّهِ (33) الْحَمْدُ لِلَّهِ (33) اللَّهُ أَكْبَرُ (34)", roman: "Subhanallah (33), Alhamdulillah (33), Allahu Akbar (34)", urdu: "اللہ پاک ہے (33 بار)۔ سب تعریف اللہ کے لیے ہے (33 بار)۔ اللہ سب سے بڑا ہے (34 بار)۔", tafseel: "فاطمہ RA نے خادم مانگا تو نبی ﷺ نے یہ بتایا کہ یہ خادم سے بہتر ہے۔", hawala: "Sahih al-Bukhari 3113; Sahih Muslim 2727" },

            // --- ROZ MARRA KI DUAEIN (Hisnul Muslim, saheeh hawala ke saath) ---
            { cat: "roz", title: "1. Khana shuru karne se pehle", arabic: "بِسْمِ اللَّهِ", roman: "Bismillah", urdu: "اللہ کے نام سے (شروع کرتا ہوں)۔", tafseel: "اگر شروع میں بھول جائیں تو یاد آنے پر کہیں: «بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ» (اس کے شروع اور آخر میں اللہ کے نام سے)۔", hawala: "Abu Dawud, Tirmidhi (Albani: Sahih — Sahih al-Jami' 380)" },
            { cat: "roz", title: "2. Khana khane ke baad", arabic: "الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ", roman: "Alhamdu lillahil-ladhi at'amani hadha wa razaqanihi min ghayri hawlin minni wa la quwwah", urdu: "تمام تعریف اللہ کے لیے ہے جس نے مجھے یہ کھانا کھلایا اور مجھے اپنی طاقت اور قوت کے بغیر یہ عطا کیا۔", tafseel: "حدیث میں ہے کہ جو شخص کھانے کے بعد یہ دعا پڑھے اس کے پچھلے گناہ معاف کر دیے جاتے ہیں۔", hawala: "Abu Dawud, Tirmidhi, Ibn Majah (Albani: Hasan — Sahih al-Jami' 6086, Irwa 1989)" },
            { cat: "roz", title: "3. Dawat dene wale ke liye dua", arabic: "اللَّهُمَّ بَارِكْ لَهُمْ فِيمَا رَزَقْتَهُمْ، وَاغْفِرْ لَهُمْ وَارْحَمْهُمْ", roman: "Allahumma barik lahum fima razaqtahum, waghfir lahum warhamhum", urdu: "اے اللہ! جو رزق تو نے انہیں دیا اس میں برکت دے، انہیں بخش دے اور ان پر رحم فرما۔", tafseel: "یہ دعا نبی ﷺ نے اپنے میزبان کے لیے فرمائی۔ کسی کے ہاں کھانا کھا کر میزبان کو یہ دعا دیں۔", hawala: "Sahih Muslim 2042" },
            { cat: "roz", title: "4. Naya kapda pehente waqt", arabic: "اللَّهُمَّ لَكَ الْحَمْدُ أَنْتَ كَسَوْتَنِيهِ، أَسْأَلُكَ مِنْ خَيْرِهِ وَخَيْرِ مَا صُنِعَ لَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا صُنِعَ لَهُ", roman: "Allahumma lakal-hamdu anta kasawtanihi, as'aluka min khayrihi wa khayri ma suni'a lah, wa a'udhu bika min sharrihi wa sharri ma suni'a lah", urdu: "اے اللہ! تیرے ہی لیے سب تعریف ہے، تو نے مجھے یہ پہنایا۔ میں تجھ سے اس کی بھلائی اور جس مقصد کے لیے یہ بنا اس کی بھلائی مانگتا ہوں، اور اس کے شر اور جس مقصد کے لیے یہ بنا اس کے شر سے تیری پناہ چاہتا ہوں۔", tafseel: "نیا کپڑا پہنتے وقت یہ دعا پڑھی جاتی ہے۔", hawala: "Abu Dawud, Tirmidhi (Albani: Sahih — Sahih al-Jami')" },
            { cat: "roz", title: "5. Kapda pehente waqt (aam)", arabic: "الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ", roman: "Alhamdu lillahil-ladhi kasani hadha wa razaqanihi min ghayri hawlin minni wa la quwwah", urdu: "تمام تعریف اللہ کے لیے ہے جس نے مجھے یہ پہنایا اور میری طاقت اور قوت کے بغیر مجھے عطا کیا۔", tafseel: "حدیث میں ہے کہ جو شخص کپڑا پہن کر یہ دعا پڑھے اس کے پچھلے گناہ معاف کر دیے جاتے ہیں۔", hawala: "Abu Dawud, Tirmidhi (Albani: Hasan — Sahih al-Jami' 6086, Irwa 1989)" },
            { cat: "roz", title: "6. Aaina dekhte waqt", arabic: "اللَّهُمَّ كَمَا حَسَّنْتَ خَلْقِي فَحَسِّنْ خُلُقِي", roman: "Allahumma kama hassanta khalqi fahassin khuluqi", urdu: "اے اللہ! جیسے تو نے میری صورت اچھی بنائی، ویسے ہی میرے اخلاق بھی اچھے کر دے۔", tafseel: "صورت اللہ کی عطا ہے، اس پر شکر کے ساتھ اچھے اخلاق کی دعا کی جاتی ہے۔", hawala: "Musnad Ahmad (Albani: Sahih — Sahih al-Jami' 1307, Irwa 74)" },
            { cat: "roz", title: "7. Bait-ul-khala jane se pehle", arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ", roman: "Allahumma inni a'udhu bika minal-khubuthi wal-khaba'ith", urdu: "اے اللہ! میں ناپاک جنوں (نر و مادہ) کے شر سے تیری پناہ چاہتا ہوں۔", tafseel: "بیت الخلا میں داخل ہونے سے پہلے (یا کھلی جگہ میں ستر کھولنے سے پہلے) پڑھی جاتی ہے۔", hawala: "Sahih Bukhari 142, Sahih Muslim 375" },
            { cat: "roz", title: "8. Bait-ul-khala se nikal kar", arabic: "غُفْرَانَكَ", roman: "Ghufranak", urdu: "(اے اللہ!) میں تیری بخشش مانگتا ہوں۔", tafseel: "بیت الخلا سے نکلنے پر یہ کہا جاتا ہے۔", hawala: "Abu Dawud 30, Tirmidhi 7, Ibn Majah 300" },
            { cat: "roz", title: "9. Chheenk aane par", arabic: "الْحَمْدُ لِلَّهِ", roman: "Alhamdulillah", urdu: "تمام تعریف اللہ کے لیے ہے۔", tafseel: "جسے چھینک آئے وہ «الْحَمْدُ لِلَّهِ» کہے، سننے والا «يَرْحَمُكَ اللَّهُ» (اللہ تجھ پر رحم کرے) کہے، اور چھینکنے والا جواب میں «يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ» (اللہ تمہیں ہدایت دے اور تمہارا حال درست کرے) کہے۔", hawala: "Sahih Bukhari 6224" },
            { cat: "roz", title: "10. Salam karna", arabic: "السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ", roman: "As-salamu 'alaykum wa rahmatullahi wa barakatuh", urdu: "تم پر سلامتی ہو اور اللہ کی رحمت اور اس کی برکتیں ہوں۔", tafseel: "جواب میں «وَعَلَيْكُمُ السَّلَامُ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ» کہا جاتا ہے۔ پورا سلام کہنے پر زیادہ نیکیاں ملتی ہیں۔", hawala: "Abu Dawud 5195, Tirmidhi 2689" },
            { cat: "roz", title: "11. Kisi ne bhalai ki to", arabic: "جَزَاكَ اللَّهُ خَيْرًا", roman: "Jazakallahu khayran", urdu: "اللہ تمہیں اچھا بدلہ دے۔", tafseel: "نبی ﷺ نے فرمایا: جس کے ساتھ کوئی بھلائی کی جائے اور وہ بھلائی کرنے والے سے یہ کہے تو اس نے خوب شکریہ ادا کیا۔", hawala: "Tirmidhi 2035 (Albani: Sahih — Sahih at-Targhib 969)" },
            { cat: "roz", title: "12. Majlis se uthte waqt (Kaffarah-e-Majlis)", arabic: "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ", roman: "Subhanakal-lahumma wa bihamdika, ash-hadu an la ilaha illa anta, astaghfiruka wa atubu ilayk", urdu: "اے اللہ! تو پاک ہے اپنی تعریف کے ساتھ، میں گواہی دیتا ہوں کہ تیرے سوا کوئی معبود نہیں، میں تجھ سے بخشش مانگتا ہوں اور تیری طرف رجوع کرتا ہوں۔", tafseel: "مجلس میں ہونے والی کوتاہیوں کا کفارہ ہے، اس لیے مجلس ختم ہونے پر پڑھیں۔", hawala: "Tirmidhi 3433, Abu Dawud 4859" },
            { cat: "roz", title: "13. Gusse ke waqt", arabic: "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", roman: "A'udhu billahi minash-shaytanir-rajim", urdu: "میں شیطان مردود سے اللہ کی پناہ مانگتا ہوں۔", tafseel: "نبی ﷺ نے فرمایا کہ مجھے ایک کلمہ معلوم ہے، اگر غصے والا اسے کہے تو اس کا غصہ جاتا رہے گا، اور وہ یہی ہے۔", hawala: "Sahih Bukhari 3282, Sahih Muslim 2610" },
            { cat: "roz", title: "14. Sawari par baithne ki dua", arabic: "سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنقَلِبُونَ", roman: "Subhanal-ladhi sakhkhara lana hadha wa ma kunna lahu muqrinin, wa inna ila rabbina lamunqalibun", urdu: "پاک ہے وہ ذات جس نے اس (سواری) کو ہمارے قابو میں کر دیا، حالانکہ ہم اسے قابو میں لانے والے نہ تھے، اور بے شک ہم اپنے رب کی طرف لوٹ کر جانے والے ہیں۔", tafseel: "گاڑی، بس، جہاز یا کسی بھی سواری پر بیٹھ کر پڑھیں۔ پہلے تین بار «اللَّهُ أَكْبَرُ» اور «الْحَمْدُ لِلَّهِ» کہنا بھی حدیث میں آیا ہے۔", hawala: "Surah Az-Zukhruf 43:13-14, Abu Dawud 2602, Tirmidhi 3446" },
            { cat: "roz", title: "15. Safar ki dua", arabic: "اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى، اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ", roman: "Allahumma inna nas'aluka fi safarina hadhal-birra wat-taqwa, wa minal-'amali ma tarda. Allahumma hawwin 'alayna safarana hadha watwi 'anna bu'dah", urdu: "اے اللہ! ہم تجھ سے اپنے اس سفر میں نیکی اور تقویٰ مانگتے ہیں اور ایسے عمل مانگتے ہیں جن سے تو راضی ہو۔ اے اللہ! ہمارا یہ سفر آسان کر دے اور اس کی دوری ہم پر لپیٹ دے۔", tafseel: "سواری کی دعا کے بعد یہ دعا بھی نبی ﷺ سے ثابت ہے۔", hawala: "Sahih Muslim 1342" },
            { cat: "roz", title: "16. Naya chand dekhne par", arabic: "اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالْيُمْنِ وَالْإِيمَانِ وَالسَّلَامَةِ وَالْإِسْلَامِ، رَبِّي وَرَبُّكَ اللَّهُ", roman: "Allahumma ahillahu 'alayna bil-yumni wal-imani was-salamati wal-islam, rabbi wa rabbukallah", urdu: "اے اللہ! اس چاند کو ہم پر برکت، ایمان، سلامتی اور اسلام کے ساتھ طلوع فرما۔ (اے چاند!) میرا اور تیرا رب اللہ ہے۔", tafseel: "نئے مہینے کا چاند دیکھنے پر پڑھی جاتی ہے۔", hawala: "Tirmidhi 3451 (Albani: Hasan — Sahih al-Jami' 4726, as-Sahiha 1816)" },
            { cat: "roz", title: "17. Baarish ke waqt", arabic: "اللَّهُمَّ صَيِّبًا نَافِعًا", roman: "Allahumma sayyiban nafi'a", urdu: "اے اللہ! نفع دینے والی بارش برسا۔", tafseel: "بارش دیکھ کر یہ دعا پڑھی جاتی ہے۔", hawala: "Sahih Bukhari 1032" },
            { cat: "roz", title: "18. Roza iftar karte waqt", arabic: "ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ", roman: "Dhahabaz-zama'u wabtallatil-'uruqu wa thabatal-ajru in sha'allah", urdu: "پیاس چلی گئی، رگیں تر ہو گئیں اور اگر اللہ نے چاہا تو اجر ثابت ہو گیا۔", tafseel: "روزہ کھولنے کے بعد پڑھی جاتی ہے۔", hawala: "Abu Dawud 2357 (Albani: Hasan — Sahih al-Jami' 4678)" },
            { cat: "roz", title: "19. Rizq-e-halal ki dua", arabic: "اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ", roman: "Allahummak-fini bihalalika 'an haramik, wa aghnini bifadlika 'amman siwak", urdu: "اے اللہ! مجھے اپنے حلال کے ذریعے حرام سے کافی ہو جا اور اپنے فضل سے اپنے سوا سب سے بے نیاز کر دے۔", tafseel: "قرض اور تنگی سے نجات اور حلال روزی کے لیے یہ ایک جامع دعا ہے۔", hawala: "Tirmidhi 3563 (Albani: Hasan — as-Sahiha 266)" },
            { cat: "roz", title: "20. Dunya aur Aakhirat ki bhalai", arabic: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", roman: "Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina 'adhaban-nar", urdu: "اے ہمارے رب! ہمیں دنیا میں بھلائی دے اور آخرت میں بھلائی دے اور ہمیں آگ کے عذاب سے بچا۔", tafseel: "انس رضی اللہ عنہ کے مطابق نبی ﷺ کی اکثر دعا یہی ہوتی تھی۔", hawala: "Surah Al-Baqarah 2:201, Sahih Bukhari 4522" },
            { cat: "roz", title: "21. Dil ko deen par saabit rakhne ki dua", arabic: "يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ", roman: "Ya muqallibal-qulub, thabbit qalbi 'ala dinik", urdu: "اے دلوں کو پھیرنے والے! میرے دل کو اپنے دین پر ثابت قدم رکھ۔", tafseel: "نبی ﷺ یہ دعا بکثرت کرتے تھے۔", hawala: "Tirmidhi 2140 (Albani: Sahih — as-Sahiha 2091)" },
            { cat: "roz", title: "22. Ilm mein izafe ki dua", arabic: "رَبِّ زِدْنِي عِلْمًا", roman: "Rabbi zidni 'ilma", urdu: "اے میرے رب! میرے علم میں اضافہ فرما۔", tafseel: "طلبِ علم کے وقت اور پڑھائی شروع کرتے ہوئے یہ دعا کریں۔", hawala: "Surah Ta-Ha 20:114" },
            { cat: "roz", title: "23. Walidain ke liye dua", arabic: "رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", roman: "Rabbir-hamhuma kama rabbayani saghira", urdu: "اے میرے رب! ان دونوں (ماں باپ) پر رحم فرما جیسے انہوں نے بچپن میں میری پرورش کی۔", tafseel: "والدین کے لیے، زندہ ہوں یا وفات پا چکے ہوں، یہ دعا قرآن میں سکھائی گئی ہے۔", hawala: "Surah Al-Isra 17:24" },
