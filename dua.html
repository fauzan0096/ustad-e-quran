    <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masnoon Duaein & Azkar - Complete</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #0F4C3A; 
            --secondary: #D4AF37; 
            --bg: #F4F7F6; 
            --card-bg: #ffffff; 
            --text: #333333; 
            --text-light: #666;
            --shadow: 0 4px 15px rgba(0,0,0,0.05); 
            --border: #ddd; 
        }
        [data-theme="dark"] { 
            --primary: #1a1a2e; 
            --secondary: #6ee7b7; 
            --bg: #0f0f23; 
            --card-bg: #1e1e36; 
            --text: #eee; 
            --text-light: #aaa; 
            --shadow: 0 4px 15px rgba(0,0,0,0.3); 
            --border: #333; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        header { background-color: var(--primary); color: white; text-align: center; padding: 15px; border-bottom: 4px solid var(--secondary); position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: white; }

        .main-nav { display: flex; justify-content: flex-start; overflow-x: auto; gap: 10px; margin: 15px auto; padding: 0 15px; max-width: 1200px; scrollbar-width: none; }
        .main-nav::-webkit-scrollbar { display: none; }
        .nav-btn { padding: 8px 16px; border: none; border-radius: 20px; font-size: 14px; font-weight: 600; background: var(--card-bg); color: var(--text); box-shadow: var(--shadow); cursor: pointer; white-space: nowrap; }
        .nav-btn.active { background: var(--primary); color: #fff; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); border-left: 5px solid var(--primary); margin-bottom: 20px; }
        
        .arabic { font-family: 'Amiri', serif; font-size: 28px; color: var(--secondary); margin-bottom: 15px; direction: rtl; text-align: right; cursor: pointer; line-height: 1.8; }
        .arabic:hover { opacity: 0.8; }
        
        .roman { font-weight: 600; font-size: 15px; margin-bottom: 10px; color: var(--text); }
        .urdu { font-family: 'Noto Nastaliq Urdu', serif; font-size: 20px; color: var(--text); direction: rtl; text-align: right; margin-bottom: 15px; cursor: pointer; line-height: 2.2; }
        .hindi { font-family: 'Poppins', sans-serif; font-size: 15px; color: var(--text); margin-bottom: 15px; line-height: 1.6; background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px; }
        [data-theme="dark"] .hindi { background: rgba(255,255,255,0.05); }
        
        .tafseel-box { background: rgba(212, 175, 55, 0.1); border: 1px dashed var(--secondary); padding: 15px; border-radius: 8px; margin-top: 15px; }
        .tafseel-title { font-weight: bold; color: var(--primary); margin-bottom: 5px; display: block; font-size: 14px;}
        .tafseel-text { font-family: 'Noto Nastaliq Urdu', serif; font-size: 16px; direction: rtl; text-align: right; color: var(--text-light); line-height: 1.9; }
        .hawala { font-size: 12px; color: var(--text-light); margin-top: 10px; font-style: italic; border-top: 1px solid var(--border); padding-top: 10px; }
        
        .play-btn { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; }

        .search-box { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; margin-bottom: 20px; background: var(--card-bg); color: var(--text); outline: none; font-size: 16px; }
        .hidden { display: none !important; }
    </style>
</head>

    <header>
        <div class="header-top">
            <h1>🤲 Masnoon Duaein</h1>
            <div class="header-controls">
                <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
                <a href="index.html" style="color:white; text-decoration:none; font-size:20px;" title="Back to App">🏠</a>
            </div>
        </div>
    </header>

    <div class="container">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 Dua Search Karein..." onkeyup="filterCards()">
        
        <nav class="main-nav">
            <button class="nav-btn active" onclick="filterCategory('all', this)">Sab Kuch</button>
            <button class="nav-btn" onclick="filterCategory('namaz', this)">Namaz ki Duaein</button>
            <button class="nav-btn" onclick="filterCategory('subah', this)">Subah-Sham Azkar</button>
            <button class="nav-btn" onclick="filterCategory('mushkil', this)">Mushkil & Pareshani</button>
            <button class="nav-btn" onclick="filterCategory('bimari', this)">Bimari & Shifa</button>
            <button class="nav-btn" onclick="filterCategory('sone', this)">Sone se Pehle</button>
        </nav>

        <div id="duaContainer"></div>
    </div>

    <script>
        let isDarkMode = localStorage.getItem('darkMode') === 'true';
        if (isDarkMode) document.body.setAttribute('data-theme', 'dark');
        
        function toggleTheme() {
            isDarkMode = !isDarkMode; 
            document.body.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
            document.getElementById('themeBtn').innerText = isDarkMode ? '☀️' : '🌙'; 
            localStorage.setItem('darkMode', isDarkMode);
        }
        if (isDarkMode) document.getElementById('themeBtn').innerText = '☀️';

        function speakText(text, lang) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang === 'ar' ? 'ar-SA' : (lang === 'hi' ? 'hi-IN' : 'ur-PK');
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        }

        // ==========================================
        // COMPLETE DATA FROM BOTH PDFs with HINDI
        // ==========================================
        const allDuas = [
            // --- NAMAZ KI DUAEN ---
            { cat: "namaz", title: "1. Wudu ke baad ki dua", arabic: "أَشْهَدُ أَن لَّ إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ", roman: "Ashhadu an la ilaha illallahu wahdahu la sharika lah, wa ashhadu anna Muhammadan 'abduhu wa rasuluh", urdu: "میں گواہی دیتا ہوں کہ اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں، اور میں گواہی دیتا ہوں کہ محمد اس کے بندے اور رسول ہیں۔", hindi: "मैं गवाही देता हूँ कि अल्लाह के सिवा कोई माबूद नहीं, वो अकेला है, उसका कोई शरीक नहीं, और मैं गवाही देता हूँ कि मुहम्मद उसके बंदे और रसूल हैं।", tafseel: "جو شخص اچھی طرح وضو کر کے یہ دعا پڑھے، اس کے لیے جنت کے آٹھوں دروازے کھول دیے جاتے ہیں۔", hawala: "Sahih Muslim 234" },
            { cat: "namaz", title: "2. Azan ka jawab", arabic: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", roman: "La hawla wa la quwwata illa billah", urdu: "گناہ سے بچنے کی کوئی طاقت اور نیکی کی کوئی قوت نہیں مگر اللہ کی مدد سے۔", hindi: "गुनाह से बचने की कोई ताकत और नेकी की कोई ताकत नहीं मगर अल्लाह की मदद से।", tafseel: "موذن کے کلمات دہرائیں؛ صرف 'حی علی الصلاۃ' اور 'حی علی الفلاح' کے جواب میں یہ کہیں۔", hawala: "Sahih al-Bukhari 611; Sahih Muslim 385" },
            { cat: "namaz", title: "3. Azan ke baad shahadat aur raza ka iqrar", arabic: "وَأَنَا أَشْهَدُ أَن لَّا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، رَضِيتُ بِاللَّهِ رَبَّا، وَبِمُحَمَّدٍ رَسُولًا، وَبِالْإِسْلَامِ دِينًا", roman: "Wa ana ashhadu an la ilaha illallahu wahdahu la sharika lah, wa anna Muhammadan 'abduhu wa rasuluh, raditu billahi rabban wa bi Muhammadin rasulan wa bil-Islami dinan", urdu: "اور میں بھی گواہی دیتا ہوں کہ اللہ کے سوا کوئی معبود نہیں... میں اللہ کے رب ہونے، محمد ﷺ کے رسول ہونے اور اسلام کے دین ہونے پر راضی ہوں۔", hindi: "और मैं भी गवाही देता हूँ कि अल्लाह के सिवा कोई माबूद नहीं... मैं अल्लाह के रब होने, मुहम्मद ﷺ के रसूल होने और इस्लाम के दीन होने पर राज़ी हूँ।", tafseel: "جو موذن کو سن کر یہ کہے، اس کے گناہ معاف کر دیے جاتے ہیں۔", hawala: "Sahih Muslim 386" },
            { cat: "namaz", title: "4. Azan ke baad darood aur wasila ki dua", arabic: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ. اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ", roman: "Allahumma salli 'ala Muhammadin... Allahumma Rabba hadhihid-da'watit-tammah, was-salatil-qa'imah, ati Muhammadanil-wasilata wal-fadilah, wab'athhu maqaman mahmudanilladhi wa'adtah", urdu: "اے اللہ! محمد ﷺ اور آل محمد پر رحمت نازل فرما... اے اللہ! اس مکمل پکار اور قائم ہونے والی نماز کے رب! محمد ﷺ کو وسیلہ اور فضیلت عطا فرما اور انہیں اس مقام محمود پر پہنچا جس کا تو نے ان سے وعدہ کیا ہے۔", hindi: "ऐ अल्लाह! मुहम्मद ﷺ और आले मुहम्मद पर रहमत नाज़िल फ़रमा... ऐ अल्लाह! इस मुकम्मल पुकार और क़ायम होने वाली नमाज़ के रब! मुहम्मद ﷺ को वसीला और फ़ज़ीलत अता फ़रमा और उन्हें उस मक़ाम महमूद पर पहुँचा जिसका तूने उनसे वादा किया है।", tafseel: "جو شخص یہ دعا پڑھے، اس کے لیے قیامت کے دن نبی ﷺ کی شفاعت واجب ہو جاتی ہے۔", hawala: "Sahih Muslim 384; Sahih al-Bukhari 614" },
            { cat: "namaz", title: "5. Masjid mein dakhil hote waqt", arabic: "اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتَكَ", roman: "Allahummaf tah li abwaba rahmatik", urdu: "اے اللہ! میرے لیے اپنی رحمت کے دروازے کھول دے۔", hindi: "ऐ अल्लाह! मेरे लिए अपनी रहमत के दरवाज़े खोल दे।", tafseel: "مسجد میں داخل ہوتے وقت یہ پڑھنا سنت ہے۔", hawala: "Sahih Muslim 713" },
            { cat: "namaz", title: "6. Masjid se nikalte waqt", arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", roman: "Allahumma inni as'aluka min fadlik", urdu: "اے اللہ! میں تجھ سے تیرے فضل کا سوال کرتا ہوں۔", hindi: "ऐ अल्लाह! मैं तुझसे तेरे फ़ज़्ल का सवाल करता हूँ।", tafseel: "مسجد سے نکلتے وقت یہ دعا پڑھی جاتی ہے۔", hawala: "Sahih Muslim 713" },
            { cat: "namaz", title: "7. Istiftah (1) - Allahumma ba'id bayni", arabic: "اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنِ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اللَّهُمَّ نَقِّنِي مِنَ الْخَطَايَا كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْنِي مِنْ خَطَايَايَ بِالثَّلْجِ وَالْمَاءِ وَالْبَرَدِ", roman: "Allahumma ba'id bayni wa bayna khatayaya kama ba'adta baynal-mashriqi wal-maghrib...", urdu: "اے اللہ! میرے اور میرے گناہوں کے درمیان اتنی دوری کر دے جتنی تو نے مشرق اور مغرب کے درمیان رکھی ہے...", hindi: "ऐ अल्लाह! मेरे और मेरे गुनाहों के दरमियान इतनी दूरी कर दे जितनी तूने मशरिक़ और मग़रिब के दरमियान रखी है...", tafseel: "نماز شروع کرنے کی دعاؤں میں سے ایک ہے۔", hawala: "Sahih al-Bukhari 744; Sahih Muslim 598" },
            { cat: "namaz", title: "8. Istiftah (2) - Subhanaka Allahumma", arabic: "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمَكَ، وَتَعَالَى جُدُّكَ، وَلَا إِلَهَ غَيْرُكَ", roman: "Subhanaka Allahumma wa bihamdika, wa tabarakasmuka, wa ta'ala jadduka, wa la ilaha ghayruk", urdu: "اے اللہ! تو پاک ہے اور تیری ہی تعریف ہے، تیرا نام بابرکت ہے، تیری شان بلند ہے اور تیرے سوا کوئی معبود نہیں۔", hindi: "ऐ अल्लाह! तू पाक है और तेरी ही तारीफ़ है, तेरा नाम बाबरकत है, तेरी शान बुलंद है और तेरे सिवा कोई माबूद नहीं।", tafseel: "یہ بھی نماز کی ابتدائی دعا ہے۔", hawala: "Sunan Abi Dawud 776 - Sahih" },
            { cat: "namaz", title: "9. Istiftah (3) - Wajjahtu wajhiya", arabic: "وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ، إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ، لَا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ. اللَّهُمَّ أَنْتَ الْمَلِكُ لَا إِلَهَ إِلَّا أَنْتَ...", roman: "Wajjahtu wajhiya lilladhi fataras-samawati wal-arda hanifan...", urdu: "میں نے اپنا رخ اس ذات کی طرف کر لیا جس نے آسمانوں اور زمین کو پیدا کیا...", hindi: "मैंने अपना रुख़ उस ज़ात की तरफ़ कर लिया जिसने आसमानों और ज़मीन को पैदा किया...", tafseel: "نبی ﷺ کی نماز کی ایک اور مسنون دعا ہے۔", hawala: "Sahih Muslim 771" },
            { cat: "namaz", title: "10. Ta'awwudh", arabic: "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", roman: "A'udhu billahi minash-shaytanir-rajim", urdu: "میں شیطان مردود سے اللہ کی پناہ مانگتا ہوں۔", hindi: "मैं शैतान मरदूद से अल्लाह की पनाह माँगता हूँ।", tafseel: "قرات شروع کرنے سے پہلے پڑھی جاتی ہے۔", hawala: "Surah An-Nahl 16:98" },
            { cat: "namaz", title: "11. Surah Al-Fatiha", arabic: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ﴿١﴾ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ﴿٢﴾ الرَّحْمَٰنِ الرَّحِيمِ ﴿٣﴾ مَالِكِ يَوْمِ الدِّينِ ﴿٤﴾ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ﴿٥﴾ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ﴿٦﴾ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ ﴿٧﴾", roman: "Bismillahir-Rahmanir-Rahim. Alhamdulillahi Rabbil-'Alamin. Ar-Rahmanir-Rahim. Maliki Yawmid-Din. Iyyaka na'budu wa iyyaka nasta'in. Ihdinas-Siratal-Mustaqim. Siratal-ladhina an'amta 'alayhim, ghayril-maghdubi 'alayhim wa lad-dallin.", urdu: "اللہ کے نام سے جو بڑا مہربان، نہایت رحم کرنے والا ہے۔ سب تعریف اللہ کے لیے ہے جو تمام جہانوں کا رب ہے...", hindi: "अल्लाह के नाम से जो बड़ा मेहरबान, निहायत रहम करने वाला है। सब तारीफ़ अल्लाह के लिए है जो तमाम जहानों का रब है...", tafseel: "یہ نماز کا رکن ہے، اس کے بغیر نماز نہیں ہوتی۔", hawala: "Sahih al-Bukhari 756; Sahih Muslim 394" },
            { cat: "namaz", title: "12. Ameen", arabic: "آمِين", roman: "Ameen", urdu: "اے اللہ! ہماری دعا قبول فرما۔", hindi: "ऐ अल्लाह! हमारी दुआ क़ुबूल फ़रमा।", tafseel: "جب امام آمین کہے تو مقتدی بھی آمین کہیں۔", hawala: "Sahih al-Bukhari 780; Sahih Muslim 410" },
            { cat: "namaz", title: "13. Ruku ki tasbeeh", arabic: "سُبْحَانَ رَبِّيَ الْعَظِيمِ", roman: "Subhana Rabbiyal-'Azim", urdu: "میرا رب پاک ہے، بہت عظمت والا۔", hindi: "मेरा रब पाक है, बहुत अज़मत वाला।", tafseel: "رکوع میں کم از کم تین بار پڑھیں۔", hawala: "Sahih Muslim 772" },
            { cat: "namaz", title: "14. Ruku ki dua (Ali RA)", arabic: "اللَّهُمَّ لَكَ رَكَعْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، خَشَعَ لَكَ سَمْعِي وَبَصَرِي وَمُخِّي وَعَظْمِي وَعَصَبِي", roman: "Allahumma laka raka'tu wa bika amantu wa laka aslamtu, khasha'a laka sam'i wa basari wa mukhkhi wa 'azmi wa 'asabi", urdu: "اے اللہ! میں نے تیرے لیے رکوع کیا، تجھ پر ایمان لایا اور تیرا فرمانبردار ہوا...", hindi: "ऐ अल्लाह! मैंने तेरे लिए रुकू किया, तुझ पर ईमान लाया और तेरा फ़रमाँबरदार हुआ...", tafseel: "نبی ﷺ رکوع میں یہ دعا بھی پڑھتے تھے۔", hawala: "Sahih Muslim 771" },
            { cat: "namaz", title: "15. Ruku/Sajde mein gunahon ki muafi", arabic: "سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي", roman: "Subhanaka Allahumma Rabbana wa bihamdika, Allahummaghfir li", urdu: "اے اللہ! اے ہمارے رب! تو پاک ہے اور تیری ہی حمد ہے، اے اللہ! مجھے بخش دے۔", hindi: "ऐ अल्लाह! ऐ हमारे रब! तू पाक है और तेरी ही हम्द है, ऐ अल्लाह! मुझे बख़्श दे।", tafseel: "نبی ﷺ رکوع اور سجدے میں یہ دعا پڑھتے تھے۔", hawala: "Sahih al-Bukhari 817; Sahih Muslim 484" },
            { cat: "namaz", title: "16. Ruku/Sajde mein Subbuhun Quddus", arabic: "سُبُّوحٌ قُدُّوسٌ رَبُّ الْمَلَائِكَةِ وَالرُّوحِ", roman: "Subbuhun Quddusun Rabbul-mala'ikati war-ruh", urdu: "بہت پاک، بہت مقدس، فرشتوں اور جبریل (روح) کا رب۔", hindi: "बहुत पाक, बहुत मुक़द्दस, फ़रिश्तों और जिब्रील (रूह) का रब।", tafseel: "نبی ﷺ رکوع اور سجدے میں یہ بھی کہتے تھے۔", hawala: "Sahih Muslim 487" },
            { cat: "namaz", title: "17. Ruku se uthte hue (Qawmah)", arabic: "سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ، رَبَّنَا وَلَكَ الْحَمْدُ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ", roman: "Sami'allahu liman hamidah, Rabbana wa lakal-hamdu hamdan kathiran tayyiban mubarakan fih", urdu: "اللہ نے اس کی سن لی جس نے اس کی حمد کی۔ اے ہمارے رب! تیری ہی حمد ہے، بہت زیادہ، پاکیزہ اور برکت والی حمد۔", hindi: "अल्लाह ने उसकी सुन ली जिसने उसकी हम्द की। ऐ हमारे रब! तेरी ही हम्द है, बहुत ज़्यादा, पाकीज़ा और बरकत वाली हम्द।", tafseel: "ایک صحابی نے یہ پڑھا تو نبی ﷺ نے فرمایا کہ 30 سے زائد فرشتے اسے لکھنے میں جلدی کر رہے تھے۔", hawala: "Sahih al-Bukhari 799" },
            { cat: "namaz", title: "18. Sajde ki tasbeeh", arabic: "سُبْحَانَ رَبِّيَ الْأَعْلَى", roman: "Subhana Rabbiyal-A'la", urdu: "میرا رب پاک ہے، سب سے بلند۔", hindi: "मेरा रब पाक है, सब से बुलंद।", tafseel: "سجدے میں کم از کم تین بار پڑھیں۔", hawala: "Sahih Muslim 772" },
            { cat: "namaz", title: "19. Sajde ki dua (Ali RA)", arabic: "اللَّهُمَّ لَكَ سَجَدْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، سَجَدَ وَجْهِي لِلَّذِي خَلَقَهُ وَصَوَّرَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، تَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ", roman: "Allahumma laka sajadtu wa bika amantu wa laka aslamtu, sajada wajhiya lilladhi khalaqahu wa sawwarahu...", urdu: "اے اللہ! میں نے تیرے لیے سجدہ کیا... میرے چہرے نے اس ذات کے لیے سجدہ کیا جس نے اسے پیدا کیا...", hindi: "ऐ अल्लाह! मैंने तेरे लिए सजदा किया... मेरे चेहरे ने उस ज़ात के लिए सजदा किया जिसने उसे पैदा किया...", tafseel: "نبی ﷺ سجدے میں یہ دعا پڑھتے تھے۔", hawala: "Sahih Muslim 771" },
            { cat: "namaz", title: "20. Sajde mein saare gunahon ki muafi", arabic: "اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ", roman: "Allahummaghfir li dhanbi kullahu, diqqahu wa jillahu, wa awwalahu wa akhirahu, wa 'alaniyatahu wa sirrah", urdu: "اے اللہ! میرے سارے گناہ بخش دے، چھوٹے بھی اور بڑے بھی، پہلے بھی اور بعد کے بھی، کھلے بھی اور چھپے بھی۔", hindi: "ऐ अल्लाह! मेरे सारे गुनाह बख़्श दे, छोटे भी और बड़े भी, पहले भी और बाद के भी, खुले भी और छिपे भी।", tafseel: "سجدہ وہ حالت ہے جب بندہ اپنے رب کے سب سے قریب ہوتا ہے۔", hawala: "Sahih Muslim 483" },
            { cat: "namaz", title: "21. Do sajdon ke darmiyan (Jalsa)", arabic: "رَبِّ اغْفِرْ لِي، رَبِّ اغْفِرْ لِي", roman: "Rabbighfir li, Rabbighfir li", urdu: "اے میرے رب! مجھے بخش دے، اے میرے رب! مجھے بخش دے۔", hindi: "ऐ मेरे रब! मुझे बख़्श दे, ऐ मेरे रब! मुझे बख़्श दे।", tafseel: "دو سجدوں کے درمیان یہ دعا پڑھی جاتی ہے۔", hawala: "Sunan Ibn Majah 897 - Sahih" },
            { cat: "namaz", title: "22. Do sajdon ke darmiyan mukammal dua", arabic: "اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاجْبُرْنِي، وَاهْدِنِي، وَارْزُقْنِي", roman: "Allahummaghfir li, warhamni, wajburni, wahdini, warzuqni", urdu: "اے اللہ! مجھے بخش دے، مجھ پر رحم فرما، میری حالت درست کر دے، مجھے ہدایت دے اور مجھے رزق عطا فرما۔", hindi: "ऐ अल्लाह! मुझे बख़्श दे, मुझ पर रहम फ़रमा, मेरी हालत दुरुस्त कर दे, मुझे हिदायत दे और मुझे रिज़्क़ अता फ़रमा।", tafseel: "نبی ﷺ دو سجدوں کے درمیان یہ دعا پڑھتے تھے۔", hawala: "Sunan at-Tirmidhi 284; Sunan Ibn Majah 898 - Sahih" },
            { cat: "namaz", title: "23. Tashahhud (At-Tahiyyat)", arabic: "التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ", roman: "At-tahiyyatu lillahi was-salawatu wat-tayyibat, as-salamu 'alayka ayyuhan-nabiyyu...", urdu: "تمام قولی، فعلی اور مالی عبادتیں اللہ کے لیے ہیں۔ اے نبی! آپ پر سلام ہو...", hindi: "तमाम क़ौली, फ़ेली और माली इबादतें अल्लाह के लिए हैं। ऐ नबी! आप पर सलाम हो...", tafseel: "یہ نماز کی قعدہ کی دعا ہے، جس کے بعد درود پڑھا جاتا ہے۔", hawala: "Sahih al-Bukhari 831; Sahih Muslim 402" },
            { cat: "namaz", title: "24. Darood Ibrahim", arabic: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ. اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ", roman: "Allahumma salli 'ala Muhammadin wa 'ala aali Muhammad, kama sallayta 'ala Ibrahima...", urdu: "اے اللہ! محمد ﷺ اور آل محمد پر رحمت نازل فرما جیسے تو نے ابراہیم اور آل ابراہیم پر رحمت نازل فرمائی...", hindi: "ऐ अल्लाह! मुहम्मद ﷺ और आले मुहम्मद पर रहमत नाज़िल फ़रमा जैसे तूने इब्राहीम और आले इब्राहीम पर रहमत नाज़िल फ़रमाई...", tafseel: "آخری قعدے میں درود پڑھنا واجب ہے۔", hawala: "Sahih al-Bukhari 3370; Sahih Muslim 406" },
            { cat: "namaz", title: "25. Jahannam, qabr aur dajjal se panah", arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ جَهَنَّمَ، وَمِنْ عَذَابِ الْقَبْرِ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ", roman: "Allahumma inni a'udhu bika min 'adhabi jahannam, wa min 'adhabil-qabr...", urdu: "اے اللہ! میں تیری پناہ مانگتا ہوں جہنم کے عذاب سے، قبر کے عذاب سے...", hindi: "ऐ अल्लाह! मैं तेरी पनाह माँगता हूँ जहन्नम के अज़ाब से, क़ब्र के अज़ाब से...", tafseel: "آخری تشہد کے بعد یہ دعا پڑھی جاتی ہے۔", hawala: "Sahih Muslim 588" },
            { cat: "namaz", title: "26. Salam se pehle (Abu Bakr RA ki dua)", arabic: "اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي، إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ", roman: "Allahumma inni zalamtu nafsi zulman kathiran, wa la yaghfirudh-dhunuba illa ant...", urdu: "اے اللہ! میں نے اپنی جان پر بہت ظلم کیا، اور گناہوں کو تیرے سوا کوئی نہیں بخش سکتا...", hindi: "ऐ अल्लाह! मैंने अपनी जान पर बहुत ज़ुल्म किया, और गुनाहों को तेरे सिवा कोई नहीं बख़्श सकता...", tafseel: "نبی ﷺ نے حضرت ابو بکر کو یہ دعا سکھائی تھی۔", hawala: "Sahih al-Bukhari 834; Sahih Muslim 2705" },
            { cat: "namaz", title: "27. Namaz khatam karne waqt salam", arabic: "السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ", roman: "As-salamu 'alaykum wa rahmatullah", urdu: "تم پر سلامتی ہو اور اللہ کی رحمت۔", hindi: "तुम पर सलामती हो और अल्लाह की रहमत।", tafseel: "نماز ختم کرتے وقت پہلے دائیں پھر بائیں طرف سلام پھیرا جاتا ہے۔", hawala: "Sahih Muslim 582" },
            { cat: "namaz", title: "28. Salam ke baad takbir", arabic: "اللَّهُ أَكْبَرُ", roman: "Allahu Akbar", urdu: "اللہ سب سے بڑا ہے۔", hindi: "अल्लाह सब से बड़ा है।", tafseel: "نماز کے خاتمے کا اعلان۔", hawala: "Sahih al-Bukhari 842; Sahih Muslim 583" },
            { cat: "namaz", title: "29. Salam ke baad Istighfar aur Salamati", arabic: "أَسْتَغْفِرُ اللَّهَ (3 بار) اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ", roman: "Astaghfirullah (3 times). Allahumma antas-salamu wa minkas-salam, tabarakta ya dhal-jalali wal-ikram.", urdu: "میں اللہ سے معافی مانگتا ہوں (3 بار)۔ اے اللہ! تو سلامتی والا ہے اور تجھ ہی سے سلامتی ہے...", hindi: "मैं अल्लाह से माफ़ी माँगता हूँ (3 बार)। ऐ अल्लाह! तू सलामती वाला है और तुझ ही से सलामती है...", tafseel: "نماز کے بعد یہ اذکار پڑھنا سنت ہے۔", hawala: "Sahih Muslim 591" },
            { cat: "namaz", title: "30. Tauheed aur Allah ke ata karne ka iqrar", arabic: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ", roman: "La ilaha illallahu wahdahu la sharika lah, lahul-mulku... Allahumma la mani'a lima a'tayt...", urdu: "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے... اے اللہ! جو تو دے اسے کوئی روکنے والا نہیں...", hindi: "अल्लाह के सिवा कोई माबूद नहीं, वो अकेला है... ऐ अल्लाह! जो तू दे उसे कोई रोकने वाला नहीं...", tafseel: "ہر فرض نماز کے بعد پڑھنا مسنون ہے۔", hawala: "Sahih al-Bukhari 844; Sahih Muslim 593" },
            { cat: "namaz", title: "31. Tasbeehat: 33+33+33 aur kalima-e-tauheed", arabic: "سُبْحَانَ اللَّهِ (33) الْحَمْدُ لِلَّهِ (33) اللَّهُ أَكْبَرُ (33) ثُمَّ: لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", roman: "Subhanallah (33), Alhamdulillah (33), Allahu Akbar (33)... phir kalima-e-tauheed", urdu: "اللہ پاک ہے (33)، سب تعریف اللہ کے لیے ہے (33)، اللہ سب سے بڑا ہے (33)... پھر توحید کا کلمہ۔", hindi: "अल्लाह पाक है (33), सब तारीफ़ अल्लाह के लिए है (33), अल्लाह सब से बड़ा है (33)... फिर तौहीद का कलिमा।", tafseel: "نماز کے بعد یہ تسبیحات گناہوں کو معاف کرواتی ہیں۔", hawala: "Sahih Muslim 597" },
            { cat: "namaz", title: "32. Mu'aqqibat: 33+33+34", arabic: "سُبْحَانَ اللَّهِ (33) الْحَمْدُ لِلَّهِ (33) اللَّهُ أَكْبَرُ (34)", roman: "Subhanallah (33), Alhamdulillah (33), Allahu Akbar (34)", urdu: "اللہ پاک ہے (33)، سب تعریف اللہ کے لیے ہے (33)، اللہ سب سے بڑا ہے (34)۔", hindi: "अल्लाह पाक है (33), सब तारीफ़ अल्लाह के लिए है (33), अल्लाह सब से बड़ा है (34)।", tafseel: "فرض نماز کے بعد یہ تسبیحات پڑھنا بہت بڑا اجر ہے۔", hawala: "Sahih Muslim 596" },
            { cat: "namaz", title: "33. Ayatul Kursi (Har namaz ke baad)", arabic: "اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ", roman: "Allahu la ilaha illa huwal-Hayyul-Qayyum. La ta'khudhuhu sinatun wa la nawm...", urdu: "اللہ کے سوا کوئی معبود نہیں، وہ زندہ ہے، سب کو تھامنے والا ہے...", hindi: "अल्लाह के सिवा कोई माबूद नहीं, वो ज़िंदा है, सब को थामने वाला है...", tafseel: "ہر فرض نماز کے بعد پڑھنے سے جنت میں داخلے سے صرف موت روکتی ہے۔", hawala: "an-Nasa'i 9848 - Sahih" },
            { cat: "namaz", title: "34. Mu'awwidhat (Teeno Qul)", arabic: "قُلْ هُوَ اللَّهُ أَحَدٌ... قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ... قُلْ أَعُوذُ بِرَبِّ النَّاسِ...", roman: "Qul huwallahu ahad... Qul a'udhu bi rabbil-falaq... Qul a'udhu bi rabbin-nas...", urdu: "کہو وہ اللہ ایک ہے... کہو میں صبح کے رب کی پناہ میں آتا ہوں... کہو میں لوگوں کے رب کی پناہ میں آتا ہوں...", hindi: "कहो वो अल्लाह एक है... कहो मैं सुबह के रब की पनाह में आता हूँ... कहो मैं लोगों के रब की पनाह में आता हूँ...", tafseel: "ہر نماز کے بعد ایک بار، فجر و مغرب میں 3 بار پڑھیں۔", hawala: "Sunan Abi Dawud 1523 - Sahih" },
            { cat: "namaz", title: "35. Zikr, Shukr aur Ibadat ki madad", arabic: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ", roman: "Allahumma a'inni 'ala dhikrika wa shukrika wa husni 'ibadatik", urdu: "اے اللہ! میری مدد فرما کہ میں تیرا ذکر کروں، تیرا شکر کروں اور بہترین طریقے سے تیری عبادت کروں۔", hindi: "ऐ अल्लाह! मेरी मदद फ़रमा कि मैं तेरा ज़िक्र करूँ, तेरा शुक्र करूँ और बेहतरीन तरीक़े से तेरी इबादत करूँ।", tafseel: "نبی ﷺ نے معاذ RA کو یہ دعا ہر نماز کے بعد کبھی نہ چھوڑنے کی وصیت کی۔", hawala: "Sunan Abi Dawud 1522 - Sahih" },
            { cat: "namaz", title: "36. Qayamat ke azab se panah", arabic: "رَبِّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ", roman: "Rabbi qini 'adhabaka yawma tab'athu 'ibadak", urdu: "اے میرے رب! مجھے اپنے عذاب سے بچا لے، جس دن تو اپنے بندوں کو اٹھائے گا۔", hindi: "ऐ मेरे रब! मुझे अपने अज़ाब से बचा ले, जिस दिन तू अपने बंदों को उठाएगा।", tafseel: "نبی ﷺ سلام کے بعد یہ دعا پڑھتے تھے۔", hawala: "Sahih Muslim 709" },
            { cat: "namaz", title: "37. Namaz ke baad in cheezon se panah", arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ", roman: "Allahumma inni a'udhu bika minal-jubn, wa a'udhu bika an uradda ila ardhalil-'umur...", urdu: "اے اللہ! میں تیری پناہ مانگتا ہوں بزدلی سے...", hindi: "ऐ अल्लाह! मैं तेरी पनाह माँगता हूँ बुज़दिली से...", tafseel: "حضرت سعد RA اپنے بچوں کو یہ دعا اس طرح سکھاتے جیسے لکھنا سکھاتے ہیں۔", hawala: "Sahih al-Bukhari 2822" },
            { cat: "namaz", title: "38. Fajr ke baad: ilm, rizq aur amal ki dua", arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا", roman: "Allahumma inni as'aluka 'ilman nafi'an, wa rizqan tayyiban, wa 'amalan mutaqabbalan", urdu: "اے اللہ! میں تجھ سے نفع بخش علم، پاکیزہ (حلال) رزق اور مقبول عمل کا سوال کرتا ہوں۔", hindi: "ऐ अल्लाह! मैं तुझसे नफ़ा बख़्श इल्म, पाकीज़ा (हलाल) रिज़्क़ और मक़बूल अमल का सवाल करता हूँ।", tafseel: "صرف فجر کی نماز کے بعد پڑھی جاتی ہے۔", hawala: "Sunan Ibn Majah 925 - Sahih" },
            { cat: "namaz", title: "39. Panj waqta farz namaz", arabic: "فَأَقِيمُوا الصَّلَاةَ...", roman: "Fajr 2, Zuhr 4, Asr 4, Maghrib 3, Isha 4", urdu: "نماز قائم کرو...", hindi: "नमाज़ क़ायम करो...", tafseel: "اسلام کا ستون۔ مردوں کے لیے مسجد میں جماعت سے پڑھنا تاکیدی ہے۔", hawala: "Sahih al-Bukhari 8; Sahih Muslim 16" },
            { cat: "namaz", title: "40. Sunnat-e-Mu'akkadah (Rawatib) - 12 rak'at", arabic: "", roman: "Fajr 2, Zuhr 4+2, Maghrib 2, Isha 2", urdu: "فرض کے علاوہ روزانہ 12 رکعت سنتیں پڑھنے والے کے لیے جنت میں گھر ہے۔", hindi: "फ़र्ज़ के अलावा रोज़ाना 12 रकअत सुन्नतें पढ़ने वाले के लिए जन्नत में घर है।", tafseel: "یہ تاکید والی سنتیں ہیں جو فرض کے ساتھ پڑھی جاتی ہیں۔", hawala: "Sahih Muslim 728; Sahih al-Bukhari 1180" },
            { cat: "namaz", title: "41. Fajr ki do sunnatein", arabic: "", roman: "Fajr ki farz se pehle 2 rak'at", urdu: "فجر کی دو سنتیں دنیا اور جو کچھ اس میں ہے اس سے بہتر ہیں۔", hindi: "फ़ज्र की दो सुन्नतें दुनिया और जो कुछ उसमें है उस से बेहतर हैं।", tafseel: "یہ بہت ہلکی اور مختصر پڑھی جاتی ہیں۔", hawala: "Sahih Muslim 725" },
            { cat: "namaz", title: "42. Witr", arabic: "", roman: "Isha ke baad se Fajr tak, 1, 3, 5, 7, 9 ya 11 rak'at", urdu: "رات کی نماز دو دو رکعت ہے، پھر ایک رکعت ملا کر وتر بنا لیں۔", hindi: "रात की नमाज़ दो दो रकअत है, फिर एक रकअत मिला कर वित्र बना लें।", tafseel: "رات کی آخری نماز۔", hawala: "Sahih al-Bukhari 990; Sahih Muslim 749" },
            { cat: "namaz", title: "43. Witr ki dua-e-Qunoot", arabic: "اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ، إِنَّكَ تَقْضِي وَلَا يُقْضَى عَلَيْكَ، وَإِنَّهُ لَا يَذِلُّ مَنْ وَالَيْتَ، وَلَا يَعِزُّ مَنْ عَادَيْتَ، تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ", roman: "Allahummahdini fiman hadayt, wa 'afini fiman 'afayt...", urdu: "اے اللہ! مجھے ان میں ہدایت دے جنہیں تو نے ہدایت دی، مجھے عافیت دے...", hindi: "ऐ अल्लाह! मुझे उनमें हिदायत दे जिन्हें तूने हिदायत दी, मुझे आफ़ियत दे...", tafseel: "وتر کی آخری رکعت میں پڑھی جاتی ہے۔", hawala: "Sunan Abi Dawud 1425 - Sahih" },
            { cat: "namaz", title: "44. Witr ke baad: Subhanal-Malikil-Quddus", arabic: "سُبْحَانَ الْمَلِكِ الْقُدُّوسِ", roman: "Subhanal-Malikil-Quddus", urdu: "پاک ہے وہ بادشاہ جو ہر عیب سے پاک ہے۔", hindi: "पाक है वो बादशाह जो हर ऐब से पाक है।", tafseel: "وتر کے سلام کے بعد 3 بار، تیسری بار آواز بلند کر کے۔", hawala: "Sunan an-Nasa'i 1700 - Sahih" },
            { cat: "namaz", title: "45. Tahajjud / Qiyam-ul-Layl", arabic: "", roman: "Raat ka aakhri hissa, 2-2 rak'at, aksar 11 rak'at (witr samet)", urdu: "فرض کے بعد سب سے افضل نماز رات کی نماز ہے۔", hindi: "फ़र्ज़ के बाद सब से अफ़ज़ल नमाज़ रात की नमाज़ है।", tafseel: "رات کے آخری تہائی حصے میں اللہ کی خاص رحمت کا وقت ہوتا ہے۔", hawala: "Sahih Muslim 1163; Sahih al-Bukhari 1145" },
            { cat: "namaz", title: "46. Tarawih (Qiyam-e-Ramadan)", arabic: "", roman: "Ramzan ki raaton mein Isha ke baad", urdu: "جو رمضان میں ایمان اور ثواب کی نیت سے قیام کرے، اس کے پچھلے گناہ معاف کر دیے جاتے ہیں۔", hindi: "जो रमज़ान में ईमान और सवाब की नीयत से क़ियाम करे, उसके पिछले गुनाह माफ़ कर दिए जाते हैं।", tafseel: "رمضان میں رات کی نماز۔", hawala: "Sahih al-Bukhari 37; Sahih Muslim 759" },
            { cat: "namaz", title: "47. Salat-ud-Duha (Chasht)", arabic: "", roman: "Suraj buland hone ke baad se zawal se pehle tak, kam az kam 2 rak'at", urdu: "ہر جوڑ کے صدقے کے بدلے دو رکعت کافی ہیں۔", hindi: "हर जोड़ के सदक़े के बदले दो रकअत काफ़ी हैं।", tafseel: "چاشت کے وقت پڑھی جاتی ہے۔", hawala: "Sahih Muslim 720" },
            { cat: "namaz", title: "48. Tahiyyat-ul-Masjid", arabic: "", roman: "Masjid mein dakhil hone par baithne se pehle 2 rak'at", urdu: "جب تم میں سے کوئی مسجد میں داخل ہو تو بیٹھنے سے پہلے دو رکعت پڑھ لے۔", hindi: "जब तुम में से कोई मस्जिद में दाख़िल हो तो बैठने से पहले दो रकअत पढ़ ले।", tafseel: "مسجد کا حق۔", hawala: "Sahih al-Bukhari 444; Sahih Muslim 714" },
            { cat: "namaz", title: "49. Tahiyyat-ul-Wudu", arabic: "", roman: "Wudu ke baad 2 rak'at", urdu: "وضو کے بعد دو رکعت پڑھنا حضرت بلال RA کا معمول تھا۔", hindi: "वुज़ू के बाद दो रकअत पढ़ना हज़रत बिलाल RA का मामूल था।", tafseel: "جس پر نبی ﷺ نے انہیں جنت کی خوشخبری دی۔", hawala: "Sahih al-Bukhari 1149; Sahih Muslim 2458" },
            { cat: "namaz", title: "50. Maghrib se pehle 2 rak'at", arabic: "", roman: "Maghrib ki azan aur iqamat ke darmiyan 2 rak'at", urdu: "مغرب سے پہلے نماز پڑھو (جو چاہے)۔", hindi: "मग़रिब से पहले नमाज़ पढ़ो (जो चाहे)।", tafseel: "یہ سنت غیر مؤکدہ ہے۔", hawala: "Sahih al-Bukhari 1183" },
            { cat: "namaz", title: "51. Salat-ut-Taubah", arabic: "", roman: "Gunah ho jane ke baad 2 rak'at", urdu: "جو گناہ کرے پھر وضو کر کے دو رکعت پڑھے اور استغفر کرے، اللہ اسے بخش دیتا ہے۔", hindi: "जो गुनाह करे फिर वुज़ू कर के दो रकअत पढ़े और इस्तग़फ़ार करे, अल्लाह उसे बख़्श देता है।", tafseel: "توبہ کی نماز۔", hawala: "Sunan Abi Dawud 1521 - Sahih" },
            { cat: "namaz", title: "52. Jumu'ah ki namaz", arabic: "", roman: "Jumu'ah ke din Zuhr ke bajaye 2 rak'at farz", urdu: "جمعہ کے دن نماز کے لیے پکارا جائے تو اللہ کے ذکر کی طرف دوڑو۔", hindi: "जुमा के दिन नमाज़ के लिए पुकारा जाए तो अल्लाह के ज़िक्र की तरफ़ दौड़ो।", tafseel: "مردوں پر فرض ہے۔", hawala: "Surah Al-Jumu'ah 62:9" },
            { cat: "namaz", title: "53. Eidain ki namaz", arabic: "", roman: "Eid ul-Fitr aur Eid ul-Adha, 2 rak'at (khutbe se pehle)", urdu: "نبی ﷺ عید کے دن عیدگاہ جاتے، پہلے نماز پڑھتے پھر خطبہ دیتے۔", hindi: "नबी ﷺ ईद के दिन ईदगाह जाते, पहले नमाज़ पढ़ते फिर खुत्बा देते।", tafseel: "عید کی نماز۔", hawala: "Sahih al-Bukhari 956; Sahih Muslim 889" },
            { cat: "namaz", title: "54. Namaz-e-Janazah", arabic: "", roman: "4 takbirat, bina ruku aur sajde ke", urdu: "جنازے کے ساتھ چلنے والے کو ایک قیراط کا ثواب ہے۔", hindi: "जनाज़े के साथ चलने वाले को एक क़ीरात का सवाब है।", tafseel: "فرض کفایہ۔", hawala: "Sahih al-Bukhari 1325; Sahih Muslim 945" },
            { cat: "namaz", title: "55. Namaz-e-Kusuf", arabic: "", roman: "Suraj/chand grahan par 2 rak'at, har rak'at mein do ruku", urdu: "سورج اور چاند اللہ کی نشانیاں ہیں، گرہن لگے تو نماز پڑھو، دعا کرو اور صدقہ دو۔", hindi: "सूरज और चाँद अल्लाह की निशानियाँ हैं, ग्रहण लगे तो नमाज़ पढ़ो, दुआ करो और सदक़ा दो।", tafseel: "گرہن کی نماز۔", hawala: "Sahih al-Bukhari 1044; Sahih Muslim 901" },
            { cat: "namaz", title: "56. Namaz-e-Istisqa", arabic: "", roman: "Khushk-sali ke waqt khule maidan mein 2 rak'at", urdu: "نبی ﷺ بارش کی دعا کے لیے میدان میں نکلے، قبلہ کی طرف منہ کیا، چادر الٹی اور دو رکعت پڑھیں۔", hindi: "नबी ﷺ बारिश की दुआ के लिए मैदान में निकले, क़िबला की तरफ़ मुँह किया, चादर उल्टी और दो रकअत पढ़ीं।", tafseel: "بارش کی نماز۔", hawala: "Sahih al-Bukhari 1012; Sahih Muslim 894" },
            { cat: "namaz", title: "57. Safar mein namaz ka qasr", arabic: "", roman: "Zuhr, Asr, Isha ki 4 rak'at ki jagah 2 rak'at", urdu: "یہ ایک صدقہ ہے جو اللہ نے تم پر کیا ہے، اسے قبول کرو۔", hindi: "ये एक सदक़ा है जो अल्लाह ने तुम पर किया है, इसे क़ुबूल करो।", tafseel: "سفر میں قصر۔", hawala: "Sahih Muslim 686" },
            { cat: "namaz", title: "58. Nafl namaz ghar mein", arabic: "", roman: "Farz ke alawa nafl ghar mein padhna afzal", urdu: "اپنے گھروں میں نماز پڑھو، کیونکہ انسان کی افضل نماز وہ ہے جو وہ اپنے گھر میں پڑھے (سوائے فرض کے)۔", hindi: "अपने घरों में नमाज़ पढ़ो, क्योंकि इंसान की अफ़ज़ल नमाज़ वो है जो वो अपने घर में पढ़े (सिवाय फ़र्ज़ के)।", tafseel: "گھر میں نفل پڑھنے کی فضیلت۔", hawala: "Sahih al-Bukhari 731; Sahih Muslim 781" },
            { cat: "namaz", title: "59. Salat-ul-Istikhara ka tareeqa", arabic: "اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ، فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ، وَتَعْلَمُ وَلَا أَعْلَمُ، وَأَنْتَ عَلَّامُ الْغُيُوبِ. اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي...", roman: "Allahumma inni astakhiruka bi 'ilmik, wa astaqdiruka bi qudratik...", urdu: "اے اللہ! میں تیرے علم کے وسیلے سے تجھ سے بھلائی طلب کرتا ہوں...", hindi: "ऐ अल्लाह! मैं तेरे इल्म के वसीले से तुझसे भलाई तलब करता हूँ...", tafseel: "کسی جائز کام کے ارادے پر 2 رکعت نفل پڑھ کر یہ دعا پڑھیں۔", hawala: "Sahih al-Bukhari 1162" },

            // --- SUBAH SHAM AZKAR ---
            { cat: "subah", title: "1. Neend se uthne ki dua", arabic: "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", roman: "Alhamdulillahil-ladhi ahyana ba'da ma amatana wa ilayhin-nushur", urdu: "تمام تعریف اللہ کے لیے ہے جس نے ہمیں (نیند کی) موت کے بعد زندہ کیا، اور اسی کی طرف اٹھ کر جانا ہے۔", hindi: "तमाम तारीफ़ अल्लाह के लिए है जिसने हमें (नींद की) मौत के बाद ज़िंदा किया, और उसी की तरफ़ उठ कर जाना है।", tafseel: "نیند کو ایک قسم کی موت کہا گیا ہے۔ صبح جاگنا ایک نئی زندگی ہے۔", hawala: "Sahih al-Bukhari 6312" },
            { cat: "subah", title: "2. Ghar se nikalte waqt", arabic: "بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", roman: "Bismillah, tawakkaltu 'alallah, wa la hawla wa la quwwata illa billah", urdu: "اللہ کے نام کے ساتھ، میں نے اللہ پر بھروسا کیا، اور گناہ سے بچنے کی کوئی طاقت اور نیکی کی کوئی قوت نہیں مگر اللہ کی مدد سے۔", hindi: "अल्लाह के नाम के साथ, मैंने अल्लाह पर भरोसा किया, और गुनाह से बचने की कोई ताकत और नेकी की कोई ताकत नहीं मगर अल्लाह की मदद से।", tafseel: "گھر سے نکلتے وقت یہ پڑھنے سے ہدایت، کفایت اور حفاظت کا وعدہ ہے۔", hawala: "Sunan Abi Dawud 5095 - Sahih" },
            { cat: "subah", title: "3. Teeno Qul (Subah + Sham 3-3 martaba)", arabic: "قُلْ هُوَ اللَّهُ أَحَدٌ... قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ... قُلْ أَعُوذُ بِرَبِّ النَّاسِ...", roman: "Qul huwallahu ahad... Qul a'udhu bi rabbil-falaq... Qul a'udhu bi rabbin-nas...", urdu: "کہو وہ اللہ ایک ہے... کہو میں صبح کے رب کی پناہ میں آتا ہوں... کہو میں لوگوں کے رب کی پناہ میں آتا ہوں...", hindi: "कहो वो अल्लाह एक है... कहो मैं सुबह के रब की पनाह में आता हूँ... कहो मैं लोगों के रब की पनाह में आता हूँ...", tafseel: "صبح و شام 3-3 بار پڑھنا ہر چیز سے کافی ہے۔", hawala: "Sunan Abi Dawud 5082 - Sahih" },
            { cat: "subah", title: "4. Din ki bhalai maangne ki dua (Asbahna...)", arabic: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدُهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدُهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", roman: "Asbahna wa asbahal-mulku lillah... Rabbi as'aluka khayra ma fi hadhal-yawm...", urdu: "ہم نے صبح کی اور بادشاہی اللہ ہی کی ہے... اے میرے رب! میں تجھ سے اس دن کی بھلائی مانگتا ہوں...", hindi: "हमने सुबह की और बादशाही अल्लाह ही की है... ऐ मेरे रब! मैं तुझसे इस दिन की भलाई माँगता हूँ...", tafseel: "شام کو 'أمسينا' (Amsayna) سے شروع کریں اور رات کا ذکر کریں۔", hawala: "Sahih Muslim 2723" },
            { cat: "subah", title: "5. Nuqsan se hifazat ki dua (3 martaba)", arabic: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", roman: "Bismillahil-ladhi la yadurru ma'asmihi shay'un fil-ardi wa la fis-sama'i wa huwas-Sami'ul-'Alim", urdu: "اللہ کے نام کے ساتھ، جس کے نام کی موجودگی میں زمین و آسمان کی کوئی چیز نقصان نہیں پہنچا سکتی...", hindi: "अल्लाह के नाम के साथ, जिसके नाम की मौजूदगी में ज़मीन व आसमान की कोई चीज़ नुक़सान नहीं पहुँचा सकती...", tafseel: "صبح و شام 3 بار پڑھنے سے کوئی چیز نقصان نہیں پہنچا سکتی۔", hawala: "Sunan Abi Dawud 5088 - Sahih" },
            { cat: "subah", title: "6. Afiyat (sehat, salamati) ki jaame dua", arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي", roman: "Allahumma inni as'alukal-'afiyata fid-dunya wal-akhirah...", urdu: "اے اللہ! میں تجھ سے دنیا و آخرت میں عافیت مانگتا ہوں...", hindi: "ऐ अल्लाह! मैं तुझसे दुनिया व आख़िरत में आफ़ियत माँगता हूँ...", tafseel: "افیت کا مطلب ہر طرح کی سلامتی ہے: جسیم، دین، مال اور گھر والوں کی۔", hawala: "Sunan Abi Dawud 5074 - Sahih" },
            { cat: "subah", title: "7. Mamlaat sanwarne ki dua (Fatima RA ki wasiyat)", arabic: "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ", roman: "Ya Hayyu ya Qayyumu bi rahmatika astaghith, aslih li sha'ni kullahu, wa la takilni ila nafsi tarfata 'ayn", urdu: "اے زندہ! اے سب کو تھامنے والے! میں تیری رحمت کے وسیلے سے فریاد کرتا ہوں، میرے سارے معاملات سنوار دے، اور مجھے پلک جھپکنے کے برابر بھی میرے نفس کے سپرد نہ کر۔", hindi: "ऐ ज़िंदा! ऐ सब को थामने वाले! मैं तेरी रहमत के वसीले से फ़रियाद करता हूँ, मेरे सारे मामलात सँवार दे, और मुझे पलक झपकने के बराबर भी मेरे नफ़्स के सुपुर्द न कर।", tafseel: "نبی ﷺ نے فاطمہ RA کو یہ صبح و شام پڑھنے کی وصیت کی۔", hawala: "an-Nasa'i fi 'Amalil-Yawm 570 - Hasan" },
            { cat: "subah", title: "8. Nafs aur shaitan ke shar se panah (Abu Bakr RA ko sikhayi)", arabic: "اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ", roman: "Allahumma 'alimal-ghaybi wash-shahadah, fatiras-samawati wal-ard...", urdu: "اے اللہ! غیب اور ظاہر کے جاننے والے، آسمانوں اور زمین کے پیدا کرنے والے...", hindi: "ऐ अल्लाह! ग़ैब और ज़ाहिर के जानने वाले, आसमानों और ज़मीन के पैदा करने वाले...", tafseel: "صبح، شام اور سونے سے پہلے پڑھیں۔", hawala: "Sunan Abi Dawud 5067 - Sahih" },
            { cat: "subah", title: "9. Iman ki tajdeed ka kalimah", arabic: "رَضِيتُ بِاللَّهِ رَبَّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ نَبِيًّا", roman: "Raditu billahi rabban, wa bil-Islami dinan, wa bi Muhammadin nabiyyan", urdu: "میں اللہ کے رب ہونے، اسلام کے دین ہونے اور محمد ﷺ کے نبی ہونے پر راضی ہوں۔", hindi: "मैं अल्लाह के रब होने, इस्लाम के दीन होने और मुहम्मद ﷺ के नबी होने पर राज़ी हूँ।", tafseel: "جو اسے دل سے مانے، اس کے لیے جنت واجب ہو جاتی ہے۔", hawala: "Sahih Muslim 1884" },
            { cat: "subah", title: "10. Subhanallah wa bihamdihi (100 martaba)", arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", roman: "Subhanallah wa bihamdihi", urdu: "اللہ پاک ہے اور میں اس کی حمد کے ساتھ اس کی تسبیح بیان کرتا ہوں۔", hindi: "अल्लाह पाक है और मैं उसकी हम्द के साथ उसकी तस्बीह बयान करता हूँ।", tafseel: "صبح و شام 100 بار پڑھنے سے گناہ معاف ہوتے ہیں۔", hawala: "Sahih Muslim 2692" },
            { cat: "subah", title: "11. La ilaha illallah (100 martaba)", arabic: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", roman: "La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamdu wa huwa 'ala kulli shay'in qadir", urdu: "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں...", hindi: "अल्लाह के सिवा कोई माबूद नहीं, वो अकेला है, उसका कोई शरीक नहीं...", tafseel: "دن میں 100 بار پڑھنے سے 10 غلام آزاد کرنے کا ثواب، 100 نیکیاں، 100 گناہ معاف اور شام تک شیطان سے حفاظت۔", hawala: "Sahih al-Bukhari 3293" },
            { cat: "subah", title: "12. Darood Shareef", arabic: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ...", roman: "Allahumma salli 'ala Muhammadin wa 'ala aali Muhammad...", urdu: "اے اللہ! محمد ﷺ اور آل محمد پر رحمت نازل فرما...", hindi: "ऐ अल्लाह! मुहम्मद ﷺ और आले मुहम्मद पर रहमत नाज़िल फ़रमा...", tafseel: "جو مجھ پر ایک بار درود بھیجے، اللہ اس پر 10 رحمتیں نازل کرتا ہے۔", hawala: "Sahih Muslim 408" },
            { cat: "subah", title: "13. Sayyidul Istighfar", arabic: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", roman: "Allahumma anta Rabbi la ilaha illa ant, khalaqtani wa ana 'abduk...", urdu: "اے اللہ! تو میرا رب ہے، تیرے سوا کوئی معبود نہیں۔ تو نے مجھے پیدا کیا اور میں تیرا بندہ ہوں...", hindi: "ऐ अल्लाह! तू मेरा रब है, तेरे सिवा कोई माबूद नहीं। तूने मुझे पैदा किया और मैं तेरा बंदा हूँ...", tafseel: "جو یقین کے ساتھ صبح یا شام پڑھے اور اسی دن مر جائے، وہ جنت میں جائے گا۔", hawala: "Sahih al-Bukhari 6306" },
            { cat: "subah", title: "14. Rasulullah ﷺ ka roz ka istighfar (100 martaba)", arabic: "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", roman: "Astaghfirullaha wa atubu ilayh", urdu: "میں اللہ سے معافی مانگتا ہوں اور اسی کی طرف توبہ کرتا ہوں۔", hindi: "मैं अल्लाह से माफ़ी माँगता हूँ और उसी की तरफ़ तौबा करता हूँ।", tafseel: "نبی ﷺ روز 100 بار استغفر کرتے تھے۔", hawala: "Sahih Muslim 2702" },
            { cat: "subah", title: "15. Gunahon ki muafi ka mukammal istighfar", arabic: "أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ", roman: "Astaghfirullahal-'Azim alladhi la ilaha illa huwal-Hayyul-Qayyumu wa atubu ilayh", urdu: "میں اللہ عظمت والے سے معافی مانگتا ہوں جس کے سوا کوئی معبود نہیں، جو زندہ اور سب کو تھامنے والا ہے...", hindi: "मैं अल्लाह अज़मत वाले से माफ़ी माँगता हूँ जिसके सिवा कोई माबूद नहीं, जो ज़िंदा और सब को थामने वाला है...", tafseel: "جو یہ کہے، اللہ اسے بخش دیتا ہے، چاہے وہ جنگ سے بھاگا ہو۔", hawala: "Sunan Abi Dawud 1517 - Sahih" },
            { cat: "subah", title: "16. Rabbi ghfir li wa tub 'alayya", arabic: "رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ", roman: "Rabbighfir li wa tub 'alayya, innaka antat-Tawwabur-Rahim", urdu: "اے میرے رب! مجھے بخش دے اور میری توبہ قبول فرما، بے شک تو ہی بہت توبہ قبول کرنے والا، نہایت رحم کرنے والا ہے۔", hindi: "ऐ मेरे रब! मुझे बख़्श दे और मेरी तौबा क़ुबूल फ़रमा, बेशक तू ही बहुत तौबा क़ुबूल करने वाला, निहायत रहम करने वाला है।", tafseel: "نبی ﷺ ایک ہی مجلس میں 100 بار یہ پڑھتے تھے۔", hawala: "Sunan Abi Dawud 1516 - Sahih" },
            { cat: "subah", title: "17. Saare gunahon ki muafi ki dua", arabic: "اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ", roman: "Allahummaghfir li dhanbi kullahu, diqqahu wa jillahu...", urdu: "اے اللہ! میرے سارے گناہ بخش دے، چھوٹے بھی اور بڑے بھی...", hindi: "ऐ अल्लाह! मेरे सारे गुनाह बख़्श दे, छोटे भी और बड़े भी...", tafseel: "سجدے میں یا ہر وقت پڑھ سکتے ہیں۔", hawala: "Sahih Muslim 483" },
            { cat: "subah", title: "18. Adam AS ki tauba ki dua", arabic: "رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ", roman: "Rabbana zalamna anfusana wa in lam taghfir lana wa tarhamna lanakunanna minal-khasirin", urdu: "اے ہمارے رب! ہم نے اپنی جانوں پر ظلم کیا، اور اگر تو نے ہمیں نہ بخشا اور ہم پر رحم نہ کیا تو ہم ضرور نقصان اٹھانے والوں میں سے ہو جائیں گے۔", hindi: "ऐ हमारे रब! हमने अपनी जानों पर ज़ुल्म किया, और अगर तूने हमें न बख़्शा और हम पर रहम न किया तो हम ज़रूर नुक़सान उठाने वालों में से हो जाएँगे।", tafseel: "یہ انسان کی پہلی توبہ ہے۔", hawala: "Surah Al-A'raf 7:23" },
            { cat: "subah", title: "19. Maafi (Afw) ki dua", arabic: "اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي", roman: "Allahumma innaka 'afuwwun tuhibbul-'afwa fa'fu 'anni", urdu: "اے اللہ! بے شک تو بہت معاف کرنے والا ہے، معافی کو پسند کرتا ہے، پس مجھے معاف فرما دے۔", hindi: "ऐ अल्लाह! बेशक तू बहुत माफ़ करने वाला है, माफ़ी को पसंद करता है, पस मुझे माफ़ फ़रमा दे।", tafseel: "خاص طور پر رمضان کی آخری راتوں میں پڑھیں۔", hawala: "Sunan at-Tirmidhi 3513 - Sahih" },

            // --- MUSHKIL & PARESHANI ---
            { cat: "mushkil", title: "1. Pareshani aur Takleef ki dua (Dua-ul-Karb)", arabic: "لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ", roman: "La ilaha illallahul-'Azimul-Halim, la ilaha illallahu Rabbul-'Arshil-'Azim...", urdu: "اللہ کے سوا کوئی معبود نہیں جو عظمت والا، بردبار ہے...", hindi: "अल्लाह के सिवा कोई माबूद नहीं जो अज़मत वाला, बुर्दबार है...", tafseel: "پریشانی کے وقت یہ پڑھنے سے دل کو سکون ملتا ہے۔", hawala: "Sahih al-Bukhari 6345" },
            { cat: "mushkil", title: "2. Bechaini mein: Allahumma rahmataka arju", arabic: "اللَّهُمَّ رَحْمَتَكَ أَرْجُو، فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ، لَا إِلَهَ إِلَّا أَنْتَ", roman: "Allahumma rahmataka arju, fala takilni ila nafsi tarfata 'aynin...", urdu: "اے اللہ! میں تیری رحمت کا امیدوار ہوں، پس مجھے پلک جھپکنے کے برابر بھی میرے نفس کے سپرد نہ کر...", hindi: "ऐ अल्लाह! मैं तेरी रहमत का उम्मीदवार हूँ, पस मुझे पलक झपकने के बराबर भी मेरे नफ़्स के सुपुर्द न कर...", tafseel: "جب انسان خود کو بے بس محسوس کرے تو یہ دعا دل کو مضبوطی دیتی ہے۔", hawala: "Sunan Abi Dawud 5090 - Hasan" },
            { cat: "mushkil", title: "3. Yunus AS ki dua", arabic: "لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", roman: "La ilaha illa anta subhanaka inni kuntu minaz-zalimin", urdu: "تیرے سوا کوئی معبود نہیں، تو پاک ہے، بے شک میں ظالموں میں سے ہوں۔", hindi: "तेरे सिवा कोई माबूद नहीं, तू पाक है, बेशक मैं ज़ालिमों में से हूँ।", tafseel: "ہر مشکل اور حاجت کے لیے پڑھی جا سکتی ہے۔", hawala: "Sunan at-Tirmidhi 3505 - Sahih" },
            { cat: "mushkil", title: "4. Gham, Fikr aur Qarz se panah", arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ", roman: "Allahumma inni a'udhu bika minal-hammi wal-hazan, wal-'ajzi wal-kasal...", urdu: "اے اللہ! میں تیری پناہ مانگتا ہوں فکر اور غم سے، عاجزی اور سستی سے...", hindi: "ऐ अल्लाह! मैं तेरी पनाह माँगता हूँ फ़िक्र और ग़म से, आजिज़ी और सुस्ती से...", tafseel: "نبی ﷺ اکثر یہ دعا پڑھتے تھے۔", hawala: "Sahih al-Bukhari 6369" },
            { cat: "mushkil", title: "5. Hasbunallah (Dushman/Khauf ke waqt)", arabic: "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ", roman: "Hasbunallahu wa ni'mal-wakil", urdu: "ہمیں اللہ کافی ہے اور وہ بہترین کارساز ہے۔", hindi: "हमें अल्लाह काफ़ी है और वो बेहतरीन कारसाज़ है।", tafseel: "ابراہیم AS نے آگ میں ڈالے جانے کے وقت یہ کہا۔", hawala: "Sahih al-Bukhari 4563" },
            { cat: "mushkil", title: "6. La hawla wa la quwwata illa billah", arabic: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", roman: "La hawla wa la quwwata illa billah", urdu: "گناہ سے بچنے کی کوئی طاقت اور نیکی کرنے کی کوئی قوت نہیں مگر اللہ کی مدد سے۔", hindi: "गुनाह से बचने की कोई ताकत और नेकी करने की कोई ताकत नहीं मगर अल्लाह की मदद से।", tafseel: "یہ جنت کے خزانوں میں سے ایک خزانہ ہے۔", hawala: "Sahih al-Bukhari 4205" },
