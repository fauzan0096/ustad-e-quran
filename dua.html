            { cat: "roz", title: "25. Shaadi par mubarakbad dene ki dua", arabic: "بَارَكَ اللَّهُ لَكَ، وَبَارَكَ عَلَيْكَ، وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ", roman: "Barakallahu laka, wa baraka 'alayka, wa jama'a baynakuma fi khayr", urdu: "اللہ تمہارے لیے برکت دے، تم پر برکت نازل کرے اور تم دونوں کو بھلائی میں جمع رکھے۔", tafseel: "نئے دولہا یا دلہن کو مبارک باد دیتے وقت یہ دعا دی جاتی ہے۔", hawala: "Abu Dawud 2130, Tirmidhi 1091 (Albani: isnad Sahih — Sahih Abi Dawud)" },
            { cat: "roz", title: "26. Qabristan mein dakhil hote waqt", arabic: "السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَاحِقُونَ، نَسْأَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ", roman: "As-salamu 'alaykum ahlad-diyari minal-mu'minina wal-muslimin, wa inna in sha'allahu bikum lahiqun, nas'alullaha lana wa lakumul-'afiyah", urdu: "اے ان گھروں کے مومن اور مسلمان باشندو! تم پر سلامتی ہو۔ اگر اللہ نے چاہا تو ہم بھی تم سے ملنے والے ہیں۔ ہم اللہ سے اپنے اور تمہارے لیے عافیت مانگتے ہیں۔", tafseel: "قبرستان جاتے وقت اہلِ قبور کو سلام کر کے ان کے لیے دعا کی جاتی ہے۔", hawala: "Sahih Muslim 975" }
        ];


        // ---------- ⭐ Favourites (har profile ki apni list) ----------
        const CAT_LABEL = { namaz: 'Namaz', subah: 'Subah-Sham', mushkil: 'Mushkil', bimari: 'Bimari', sone: 'Sone se Pehle', roz: 'Roz marra' };
        const duaId = d => d.cat + '|' + d.title;
        const byId = {}; allDuas.forEach(d => { byId[duaId(d)] = d; });
        function favStoreKey() {
            try { const p = localStorage.getItem('activeProfile'); return p ? 'p_' + p + '_duaFavs' : 'duaFavs'; } catch (e) { return 'duaFavs'; }
        }
        let favs = [];
        try { const v = JSON.parse(localStorage.getItem(favStoreKey())); if (Array.isArray(v)) favs = v.filter(id => byId[id]); } catch (e) {}
        function isFav(d) { return favs.indexOf(duaId(d)) !== -1; }
        function updateFavCount() {
            const b = document.getElementById('favNavBtn');
            if (b) b.textContent = '⭐ Favourites (' + favs.length + ')';
        }
        function saveFavs() {
            try { localStorage.setItem(favStoreKey(), JSON.stringify(favs)); } catch (e) {}
            updateFavCount();
        }
        let favToastTimer = null;
        function favToast(msg) {
            let t = document.getElementById('favToast');
            if (!t) { t = document.createElement('div'); t.id = 'favToast'; t.className = 'fav-toast'; document.body.appendChild(t); }
            t.textContent = msg; t.classList.add('show');
            clearTimeout(favToastTimer); favToastTimer = setTimeout(() => t.classList.remove('show'), 2200);
        }
        function toggleFav(d, btn) {
            const id = duaId(d), i = favs.indexOf(id), on = i === -1;
            if (on) favs.push(id); else favs.splice(i, 1);
            saveFavs();
            btn.classList.toggle('on', on); btn.textContent = on ? '★' : '☆'; btn.setAttribute('aria-pressed', on);
            favToast(on ? '⭐ Favourites mein jod diya' : 'Favourites se hata diya');
            if (currentCategory === 'fav' && !on) filterCards();      // Favourites tab mein hatate hi card gayab
        }

        // ---------- Line-wise display helpers ----------
        function splitLines(text, kind) {
            let t = (text || '').trim();
            if (kind === 'ar') t = t.replace(/(﴿[^﴾]*﴾|[،۔:]|\.)\s*/g, '$1\n');
            else if (kind === 'ur') t = t.replace(/([۔،؛!؟]|\.)\s*/g, '$1\n');
            else t = t.replace(/([.,;:?])\s+/g, '$1\n');
            const minLen = kind === 'ar' ? 16 : (kind === 'ur' ? 10 : 18);
            const out = []; let buf = '';
            t.split('\n').forEach(part => {
                part = part.trim(); if (!part) return;
                buf = buf ? buf + ' ' + part : part;
                if (buf.length >= minLen) { out.push(buf); buf = ''; }
            });
            if (buf) { if (out.length) out[out.length - 1] += ' ' + buf; else out.push(buf); }
            return out;
        }
        function linesHTML(text, kind) {
            return '<div class="lines lines-' + kind + '">' + splitLines(text, kind).map(l => '<div class="ln">' + l + '</div>').join('') + '</div>';
        }
        let textScale = parseFloat(localStorage.getItem('textScale') || '1');
        function applyScale() { document.documentElement.style.setProperty('--scale', textScale); }
        function changeScale(d) {
            textScale = Math.min(1.6, Math.max(0.8, Math.round((textScale + d) * 10) / 10));
            localStorage.setItem('textScale', textScale); applyScale();
        }
        applyScale();

        function renderDuas(filterText = "", category = "all") {
            const container = document.getElementById('duaContainer');
            container.innerHTML = '';

            const filtered = (category === 'fav' ? favs.map(id => byId[id]).filter(Boolean) : allDuas).filter(dua => {
                const matchesSearch = dua.title.toLowerCase().includes(filterText.toLowerCase()) || 
                                      dua.roman.toLowerCase().includes(filterText.toLowerCase()) || 
                                      dua.urdu.includes(filterText);
                const matchesCategory = category === 'all' || category === 'fav' || dua.cat === category;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                container.innerHTML = (category === 'fav' && !filterText)
                    ? '<div class="fav-empty">⭐ Abhi koi favourite nahi hai.<br>Jo dua baar baar padhni ho, uske card par ☆ dabayein — wo yahan aa jayegi.</div>'
                    : '<p style="text-align:center; color:gray; padding: 20px;">Koi Dua nahi mili.</p>';
                return;
            }

            filtered.forEach((dua, index) => {
                const m = dua.title.match(/^(\d+)\.\s*(.*)$/);
                const num = m ? m[1] : (index + 1);
                const ttl = m ? m[2] : dua.title;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-head">
                        <div class="num-badge">${num}</div>
                        <div class="card-title">${ttl}${(category === 'all' || category === 'fav') && CAT_LABEL[dua.cat] ? `<span class="cat-tag">${CAT_LABEL[dua.cat]}</span>` : ''}</div>
                        <button type="button" class="fav-btn${isFav(dua) ? ' on' : ''}" aria-label="Favourite" aria-pressed="${isFav(dua)}">${isFav(dua) ? '★' : '☆'}</button>
                    </div>

                    ${dua.arabic ? `<div class="sec sec-ar">
                        <span class="chip">عربی متن</span>
                        ${linesHTML(dua.arabic, 'ar')}
                        <div class="play-row"><button class="play-btn play-ar">🔊 Arabic Suno</button></div>
                    </div>` : ''}

                    <div class="sec sec-ro">
                        <span class="chip">ROMAN</span>
                        ${linesHTML(dua.roman, 'ro')}
                    </div>

                    <div class="sec sec-ur">
                        <span class="chip">اردو ترجمہ</span>
                        ${linesHTML(dua.urdu, 'ur')}
                        <div class="play-row"><button class="play-btn play-ur">🔊 Urdu Suno</button></div>
                    </div>

                    <div class="tafseel-box">
                        <span class="tafseel-title">📖 Tafseel / Faida</span>
                        <div class="tafseel-text">${dua.tafseel}</div>
                    </div>

                    <div class="hawala">📍 Hawala: ${dua.hawala}</div>
                `;
                card.querySelector('.fav-btn').onclick = function () { toggleFav(dua, this); };
                const pa = card.querySelector('.play-ar'); if (pa) pa.onclick = function () { speakText(dua.arabic, 'ar', this); };
                const pu = card.querySelector('.play-ur'); if (pu) pu.onclick = function () { speakText(dua.urdu, 'ur', this); };
                container.appendChild(card);
            });
        }

        let currentCategory = 'all';
        function filterCards() {
            const query = document.getElementById('searchInput').value;
            renderDuas(query, currentCategory);
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const query = document.getElementById('searchInput').value;
            renderDuas(query, cat);
        }

        renderDuas();
        updateFavCount();
    </script>
</body>
