<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masnoon Duaein & Azkar - Complete</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #0F4C3A; 
            --secondary: #D4AF37; 
            --bg: #F4F7F6; 
            --card-bg: #ffffff; 
            --text: #333333; 
            --text-light: #666;
            --shadow: 0 4px 15px rgba(0,0,0,0.05); 
            --border: #ddd; 
        }
        [data-theme="dark"] { 
            --primary: #1a1a2e; 
            --secondary: #6ee7b7; 
            --bg: #0f0f23; 
            --card-bg: #1e1e36; 
            --text: #eee; 
            --text-light: #aaa; 
            --shadow: 0 4px 15px rgba(0,0,0,0.3); 
            --border: #333; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        header { background-color: var(--primary); color: white; text-align: center; padding: 15px; border-bottom: 4px solid var(--secondary); position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: white; }

        .main-nav { display: flex; justify-content: flex-start; overflow-x: auto; gap: 10px; margin: 15px auto; padding: 0 15px; max-width: 1200px; scrollbar-width: none; }
        .main-nav::-webkit-scrollbar { display: none; }
        .nav-btn { padding: 8px 16px; border: none; border-radius: 20px; font-size: 14px; font-weight: 600; background: var(--card-bg); color: var(--text); box-shadow: var(--shadow); cursor: pointer; white-space: nowrap; }
        .nav-btn.active { background: var(--primary); color: #fff; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); border-left: 5px solid var(--primary); margin-bottom: 20px; }
        
        .arabic { font-family: 'Amiri', serif; font-size: 28px; color: var(--secondary); margin-bottom: 15px; direction: rtl; text-align: right; cursor: pointer; line-height: 1.8; }
        .arabic:hover { opacity: 0.8; }
        
        .roman { font-weight: 600; font-size: 15px; margin-bottom: 10px; color: var(--text); }
        .urdu { font-family: 'Noto Nastaliq Urdu', serif; font-size: 20px; color: var(--text); direction: rtl; text-align: right; margin-bottom: 15px; cursor: pointer; line-height: 2.2; }
        .hindi { font-family: 'Poppins', sans-serif; font-size: 15px; color: var(--text); margin-bottom: 15px; line-height: 1.6; background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px; }
        [data-theme="dark"] .hindi { background: rgba(255,255,255,0.05); }
        
        .tafseel-box { background: rgba(212, 175, 55, 0.1); border: 1px dashed var(--secondary); padding: 15px; border-radius: 8px; margin-top: 15px; }
        .tafseel-title { font-weight: bold; color: var(--primary); margin-bottom: 5px; display: block; font-size: 14px;}
        .tafseel-text { font-family: 'Noto Nastaliq Urdu', serif; font-size: 16px; direction: rtl; text-align: right; color: var(--text-light); line-height: 1.9; }
        .hawala { font-size: 12px; color: var(--text-light); margin-top: 10px; font-style: italic; border-top: 1px solid var(--border); padding-top: 10px; }
        
        .play-btn { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; }

        .search-box { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; margin-bottom: 20px; background: var(--card-bg); color: var(--text); outline: none; font-size: 16px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>🤲 Masnoon Duaein</h1>
            <div class="header-controls">
                <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
                <a href="index.html" style="color:white; text-decoration:none; font-size:20px;" title="Back to App">🏠</a>
            </div>
        </div>
    </header>

    <div class="container">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 Dua Search Karein..." onkeyup="filterCards()">
        
        <nav class="main-nav">
            <button class="nav-btn active" onclick="filterCategory('all', this)">Sab Kuch</button>
            <button class="nav-btn" onclick="filterCategory('namaz', this)">Namaz</button>
            <button class="nav-btn" onclick="filterCategory('subah', this)">Subah-Sham</button>
            <button class="nav-btn" onclick="filterCategory('mushkil', this)">Mushkil</button>
            <button class="nav-btn" onclick="filterCategory('bimari', this)">Bimari</button>
            <button class="nav-btn" onclick="filterCategory('sone', this)">Sone se Pehle</button>
        </nav>

        <div id="duaContainer"></div>
    </div>

    <script>
        let isDarkMode = localStorage.getItem('darkMode') === 'true';
        if (isDarkMode) document.body.setAttribute('data-theme', 'dark');
        
        function toggleTheme() {
            isDarkMode = !isDarkMode; 
            document.body.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
            document.getElementById('themeBtn').innerText = isDarkMode ? '☀️' : '🌙'; 
            localStorage.setItem('darkMode', isDarkMode);
        }
        if (isDarkMode) document.getElementById('themeBtn').innerText = '☀️';

        function speakText(text, lang) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang === 'ar' ? 'ar-SA' : (lang === 'hi' ? 'hi-IN' : 'ur-PK');
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        }

        // SAFE DATA OBJECTS
        const D = {
            wudu: "أَشْهَدُ أَن لَّ إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ",
            azan: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",
            azan_shahadat: "وَأَنَا أَشْهَدُ أَن لَّا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، رَضِيتُ بِاللَّهِ رَبَّا، وَبِمُحَمَّدٍ رَسُولًا، وَبِالْإِسْلَامِ دِينًا",
            azan_darood: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ. اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ",
            masjid_in: "اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتَكَ",
            masjid_out: "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ",
            istiftah1: "اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنِ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اللَّهُمَّ نَقِّنِي مِنَ الْخَطَايَا كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْنِي مِنْ خَطَايَايَ بِالثَّلْجِ وَالْمَاءِ وَالْبَرَدِ",
            istiftah2: "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمَكَ، وَتَعَالَى جُدُّكَ، وَلَا إِلَهَ غَيْرُكَ",
            istiftah3: "وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ، إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ، لَا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ. اللَّهُمَّ أَنْتَ الْمَلِكُ لَا إِلَهَ إِلَّا أَنْتَ...",
            taawwudh: "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ",
            fatiha: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ﴿١﴾ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ﴿٢﴾ الرَّحْمَٰنِ الرَّحِيمِ ﴿٣﴾ مَالِكِ يَوْمِ الدِّينِ ﴿٤﴾ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ﴿٥﴾ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ﴿٦﴾ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ ﴿٧﴾",
            ameen: "آمِين",
            ruku: "سُبْحَانَ رَبِّيَ الْعَظِيمِ",
            ruku_dua: "اللَّهُمَّ لَكَ رَكَعْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، خَشَعَ لَكَ سَمْعِي وَبَصَرِي وَمُخِّي وَعَظْمِي وَعَصَبِي",
            ruku_sajda_gunah: "سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي",
            subbuh: "سُبُّوحٌ قُدُّوسٌ رَبُّ الْمَلَائِكَةِ وَالرُّوحِ",
            qawmah: "سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ، رَبَّنَا وَلَكَ الْحَمْدُ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ",
            sajda: "سُبْحَانَ رَبِّيَ الْأَعْلَى",
            sajda_dua: "اللَّهُمَّ لَكَ سَجَدْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، سَجَدَ وَجْهِي لِلَّذِي خَلَقَهُ وَصَوَّرَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، تَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ",
            sajda_sab_gunah: "اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ",
            jalsa: "رَبِّ اغْفِرْ لِي، رَبِّ اغْفِرْ لِي",
            jalsa_mukammal: "اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاجْبُرْنِي، وَاهْدِنِي، وَارْزُقْنِي",
            tashahhud: "التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ",
            darood: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ. اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ",
            jahannam: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ جَهَنَّمَ، وَمِنْ عَذَابِ الْقَبْرِ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ",
            abubakr: "اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي، إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ",
            salam: "السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ",
            takbir: "اللَّهُ أَكْبَرُ",
            istighfar_salam: "أَسْتَغْفِرُ اللَّهَ (3 بار) اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ",
            tauheed_ata: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ",
            tasbeehat: "سُبْحَانَ اللَّهِ (33) الْحَمْدُ لِلَّهِ (33) اللَّهُ أَكْبَرُ (33) ثُمَّ: لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",
            muaqqibat: "سُبْحَانَ اللَّهِ (33) الْحَمْدُ لِلَّهِ (33) اللَّهُ أَكْبَرُ (34)",
            ayatul_kursi: "اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",
            muawwidhat: "قُلْ هُوَ اللَّهُ أَحَدٌ... قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ... قُلْ أَعُوذُ بِرَبِّ النَّاسِ...",
            zikr_shukr: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ",
            qayamat_azab: "رَبِّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ",

            { cat: "namaz", title: "13. Ruku ki tasbeeh", ar: D.ruku, ro: "Subhana Rabbiyal-'Azim", ur: "میرا رب پاک ہے، بہت عظمت والا۔", hi: "मेरा रब पाक है, बहुत अज़मत वाला।", ta: "رکوع میں کم از کم تین بار پڑھیں۔", ha: "Sahih Muslim 772" },
            { cat: "namaz", title: "14. Ruku ki dua (Ali RA)", ar: D.ruku_dua, ro: "Allahumma laka raka'tu wa bika amantu...", ur: "اے اللہ! میں نے تیرے لیے رکوع کیا...", hi: "ऐ अल्लाह! मैंने तेरे लिए रुकू किया...", ta: "نبی ﷺ رکوع میں یہ دعا بھی پڑھتے تھے۔", ha: "Sahih Muslim 771" },
            { cat: "namaz", title: "15. Ruku/Sajde mein gunahon ki muafi", ar: D.ruku_sajda_gunah, ro: "Subhanaka Allahumma Rabbana wa bihamdika, Allahummaghfir li", ur: "اے اللہ! اے ہمارے رب! تو پاک ہے اور تیری ہی حمد ہے...", hi: "ऐ अल्लाह! ऐ हमारे रब! तू पाक है और तेरी ही हम्द है...", ta: "نبی ﷺ رکوع اور سجدے میں یہ دعا پڑھتے تھے۔", ha: "Sahih al-Bukhari 817; Sahih Muslim 484" },
            { cat: "namaz", title: "16. Ruku/Sajde mein Subbuhun Quddus", ar: D.subbuh, ro: "Subbuhun Quddusun Rabbul-mala'ikati war-ruh", ur: "بہت پاک، بہت مقدس، فرشتوں اور جبریل کا رب۔", hi: "बहुत पाक, बहुत मुक़द्दस, फ़रिश्तों और जिब्रील का रब।", ta: "نبی ﷺ رکوع اور سجدے میں یہ بھی کہتے تھے۔", ha: "Sahih Muslim 487" },
            { cat: "namaz", title: "17. Ruku se uthte hue (Qawmah)", ar: D.qawmah, ro: "Sami'allahu liman hamidah, Rabbana wa lakal-hamdu...", ur: "اللہ نے اس کی سن لی جس نے اس کی حمد کی...", hi: "अल्लाह ने उसकी सुन ली जिसने उसकी हम्द की...", ta: "ایک صحابی نے یہ پڑھا تو نبی ﷺ نے فرمایا کہ 30 سے زائد فرشتے اسے لکھنے میں جلدی کر رہے تھے۔", ha: "Sahih al-Bukhari 799" },
            { cat: "namaz", title: "18. Sajde ki tasbeeh", ar: D.sajda, ro: "Subhana Rabbiyal-A'la", ur: "میرا رب پاک ہے، سب سے بلند۔", hi: "मेरा रब पाक है, सब से बुलंद।", ta: "سجدے میں کم از کم تین بار پڑھیں۔", ha: "Sahih Muslim 772" },
            { cat: "namaz", title: "19. Sajde ki dua (Ali RA)", ar: D.sajda_dua, ro: "Allahumma laka sajadtu wa bika amantu...", ur: "اے اللہ! میں نے تیرے لیے سجدہ کیا...", hi: "ऐ अल्लाह! मैंने तेरे लिए सजदा किया...", ta: "نبی ﷺ سجدے میں یہ دعا پڑھتے تھے۔", ha: "Sahih Muslim 771" },
            { cat: "namaz", title: "20. Sajde mein saare gunahon ki muafi", ar: D.sajda_sab_gunah, ro: "Allahummaghfir li dhanbi kullahu, diqqahu wa jillahu...", ur: "اے اللہ! میرے سارے گناہ بخش دے...", hi: "ऐ अल्लाह! मेरे सारे गुनाह बख़्श दे...", ta: "سجدہ وہ حالت ہے جب بندہ اپنے رب کے سب سے قریب ہوتا ہے۔", ha: "Sahih Muslim 483" },
            { cat: "namaz", title: "21. Do sajdon ke darmiyan (Jalsa)", ar: D.jalsa, ro: "Rabbighfir li, Rabbighfir li", ur: "اے میرے رب! مجھے بخش دے، اے میرے رب! مجھے بخش دے۔", hi: "ऐ मेरे रब! मुझे बख़्श दे, ऐ मेरे रब! मुझे बख़्श दे।", ta: "دو سجدوں کے درمیان یہ دعا پڑھی جاتی ہے۔", ha: "Sunan Ibn Majah 897 - Sahih" },
            { cat: "namaz", title: "22. Do sajdon ke darmiyan mukammal dua", ar: D.jalsa_mukammal, ro: "Allahummaghfir li, warhamni, wajburni, wahdini, warzuqni", ur: "اے اللہ! مجھے بخش دے، مجھ پر رحم فرما...", hi: "ऐ अल्लाह! मुझे बख़्श दे, मुझ पर रहम फ़रमा...", ta: "نبی ﷺ دو سجدوں کے درمیان یہ دعا پڑھتے تھے۔", ha: "Sunan at-Tirmidhi 284 - Sahih" },
            { cat: "namaz", title: "23. Tashahhud (At-Tahiyyat)", ar: D.tashahhud, ro: "At-tahiyyatu lillahi was-salawatu wat-tayyibat...", ur: "تمام قولی، فعلی اور مالی عبادتیں اللہ کے لیے ہیں...", hi: "तमाम क़ौली, फ़ेली और माली इबादतें अल्लाह के लिए हैं...", ta: "یہ نماز کی قعدہ کی دعا ہے، جس کے بعد درود پڑھا جاتا ہے۔", ha: "Sahih al-Bukhari 831; Sahih Muslim 402" },
            { cat: "namaz", title: "24. Darood Ibrahim", ar: D.darood, ro: "Allahumma salli 'ala Muhammadin wa 'ala aali Muhammad...", ur: "اے اللہ! محمد ﷺ اور آل محمد پر رحمت نازل فرما...", hi: "ऐ अल्लाह! मुहम्मद ﷺ और आले मुहम्मद पर रहमत नाज़िल फ़रमा...", ta: "آخری قعدے میں درود پڑھنا واجب ہے۔", ha: "Sahih al-Bukhari 3370; Sahih Muslim 406" },
            { cat: "namaz", title: "25. Jahannam, qabr aur dajjal se panah", ar: D.jahannam, ro: "Allahumma inni a'udhu bika min 'adhabi jahannam...", ur: "اے اللہ! میں تیری پناہ مانگتا ہوں جہنم کے عذاب سے...", hi: "ऐ अल्लाह! मैं तेरी पनाह माँगता हूँ जहन्नम के अज़ाब से...", ta: "آخری تشہد کے بعد یہ دعا پڑھی جاتی ہے۔", ha: "Sahih Muslim 588" },
            { cat: "namaz", title: "26. Salam se pehle (Abu Bakr RA ki dua)", ar: D.abubakr, ro: "Allahumma inni zalamtu nafsi zulman kathiran...", ur: "اے اللہ! میں نے اپنی جان پر بہت ظلم کیا...", hi: "ऐ अल्लाह! मैंने अपनी जान पर बहुत ज़ुल्म किया...", ta: "نبی ﷺ نے حضرت ابو بکر کو یہ دعا سکھائی تھی۔", ha: "Sahih al-Bukhari 834; Sahih Muslim 2705" },
            { cat: "namaz", title: "27. Namaz khatam karne waqt salam", ar: D.salam, ro: "As-salamu 'alaykum wa rahmatullah", ur: "تم پر سلامتی ہو اور اللہ کی رحمت۔", hi: "तुम पर सलामती हो और अल्लाह की रहमत।", ta: "نماز ختم کرتے وقت پہلے دائیں پھر بائیں طرف سلام پھیرا جاتا ہے۔", ha: "Sahih Muslim 582" },
            { cat: "namaz", title: "28. Salam ke baad takbir", ar: D.takbir, ro: "Allahu Akbar", ur: "اللہ سب سے بڑا ہے۔", hi: "अल्लाह सब से बड़ा है।", ta: "نماز کے خاتمے کا اعلان۔", ha: "Sahih al-Bukhari 842; Sahih Muslim 583" },
            { cat: "namaz", title: "29. Salam ke baad Istighfar aur Salamati", ar: D.istighfar_salam, ro: "Astaghfirullah (3 times). Allahumma antas-salamu wa minkas-salam...", ur: "میں اللہ سے معافی مانگتا ہوں (3 بار)...", hi: "मैं अल्लाह से माफ़ी माँगता हूँ (3 बार)...", ta: "نماز کے بعد یہ اذکار پڑھنا سنت ہے۔", ha: "Sahih Muslim 591" },
            { cat: "namaz", title: "30. Tauheed aur Allah ke ata karne ka iqrar", ar: D.tauheed_ata, ro: "La ilaha illallahu wahdahu la sharika lah...", ur: "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے...", hi: "अल्लाह के सिवा कोई माबूद नहीं, वो अकेला है...", ta: "ہر فرض نماز کے بعد پڑھنا مسنون ہے۔", ha: "Sahih al-Bukhari 844; Sahih Muslim 593" },
            { cat: "namaz", title: "31. Tasbeehat: 33+33+33 aur kalima-e-tauheed", ar: D.tasbeehat, ro: "Subhanallah (33), Alhamdulillah (33), Allahu Akbar (33)...", ur: "اللہ پاک ہے (33)، سب تعریف اللہ کے لیے ہے (33)...", hi: "अल्लाह पाक है (33), सब तारीफ़ अल्लाह के लिए है (33)...", ta: "نماز کے بعد یہ تسبیحات گناہوں کو معاف کرواتی ہیں۔", ha: "Sahih Muslim 597" },
            { cat: "namaz", title: "32. Mu'aqqibat: 33+33+34", ar: D.muaqqibat, ro: "Subhanallah (33), Alhamdulillah (33), Allahu Akbar (34)", ur: "اللہ پاک ہے (33)، سب تعریف اللہ کے لیے ہے (33)، اللہ سب سے بڑا ہے (34)۔", hi: "अल्लाह पाक है (33), सब तारीफ़ अल्लाह के लिए है (33), अल्लाह सब से बड़ा है (34)।", ta: "فرض نماز کے بعد یہ تسبیحات پڑھنا بہت بڑا اجر ہے۔", ha: "Sahih Muslim 596" },
            { cat: "namaz", title: "33. Ayatul Kursi (Har namaz ke baad)", ar: D.ayatul_kursi, ro: "Allahu la ilaha illa huwal-Hayyul-Qayyum...", ur: "اللہ کے سوا کوئی معبود نہیں، وہ زندہ ہے...", hi: "अल्लाह के सिवा कोई माबूद नहीं, वो ज़िंदा है...", ta: "ہر فرض نماز کے بعد پڑھنے سے جنت میں داخلے سے صرف موت روکتی ہے۔", ha: "an-Nasa'i 9848 - Sahih" },
            { cat: "namaz", title: "34. Mu'awwidhat (Teeno Qul)", ar: D.muawwidhat, ro: "Qul huwallahu ahad... Qul a'udhu bi rabbil-falaq...", ur: "کہو وہ اللہ ایک ہے... کہو میں صبح کے رب کی پناہ میں آتا ہوں...", hi: "कहो वो अल्लाह एक है... कहो मैं सुबह के रब की पनाह में आता हूँ...", ta: "ہر نماز کے بعد ایک بار، فجر و مغرب میں 3 بار پڑھیں۔", ha: "Sunan Abi Dawud 1523 - Sahih" },
            { cat: "namaz", title: "35. Zikr, Shukr aur Ibadat ki madad", ar: D.zikr_shukr, ro: "Allahumma a'inni 'ala dhikrika wa shukrika wa husni 'ibadatik", ur: "اے اللہ! میری مدد فرما کہ میں تیرا ذکر کروں...", hi: "ऐ अल्लाह! मेरी मदद फ़रमा कि मैं तेरा ज़िक्र करूँ...", ta: "نبی ﷺ نے معاذ RA کو یہ دعا ہر نماز کے بعد کبھی نہ چھوڑنے کی وصیت کی۔", ha: "Sunan Abi Dawud 1522 - Sahih" },
            { cat: "namaz", title: "36. Qayamat ke azab se panah", ar: D.qayamat_azab, ro: "Rabbi qini 'adhabaka yawma tab'athu 'ibadak", ur: "اے میرے رب! مجھے اپنے عذاب سے بچا لے...", hi: "ऐ मेरे रब! मुझे अपने अज़ाब से बचा ले...", ta: "نبی ﷺ سلام کے بعد یہ دعا پڑھتے تھے۔", ha: "Sahih Muslim 709" },
            { cat: "namaz", title: "37. Namaz ke baad in cheezon se panah", ar: D.namaz_panah, ro: "Allahumma inni a'udhu bika minal-jubn...", ur: "اے اللہ! میں تیری پناہ مانگتا ہوں بزدلی سے...", hi: "ऐ अल्लाह! मैं तेरी पनाह माँगता हूँ बुज़दिली से...", ta: "حضرت سعد RA اپنے بچوں کو یہ دعا اس طرح سکھاتے جیسے لکھنا سکھاتے ہیں۔", ha: "Sahih al-Bukhari 2822" },
            { cat: "namaz", title: "38. Fajr ke baad: ilm, rizq aur amal ki dua", ar: D.fajr_ilm, ro: "Allahumma inni as'aluka 'ilman nafi'an...", ur: "اے اللہ! میں تجھ سے نفع بخش علم...", hi: "ऐ अल्लाह! मैं तुझसे नफ़ा बख़्श इल्म...", ta: "صرف فجر کی نماز کے بعد پڑھی جاتی ہے۔", ha: "Sunan Ibn Majah 925 - Sahih" },
            { cat: "namaz", title: "39. Panj waqta farz namaz", ar: "", ro: "Fajr 2, Zuhr 4, Asr 4, Maghrib 3, Isha 4", ur: "نماز قائم کرو...", hi: "नमाज़ क़ायम करो...", ta: "اسلام کا ستون۔", ha: "Sahih al-Bukhari 8; Sahih Muslim 16" },
            { cat: "namaz", title: "40. Sunnat-e-Mu'akkadah (Rawatib) - 12 rak'at", ar: "", ro: "Fajr 2, Zuhr 4+2, Maghrib 2, Isha 2", ur: "فرض کے علاوہ روزانہ 12 رکعت سنتیں...", hi: "फ़र्ज़ के अलावा रोज़ाना 12 रकअत सुन्नतें...", ta: "یہ تاکید والی سنتیں ہیں۔", ha: "Sahih Muslim 728; Sahih al-Bukhari 1180" },
            { cat: "namaz", title: "41. Fajr ki do sunnatein", ar: "", ro: "Fajr ki farz se pehle 2 rak'at", ur: "فجر کی دو سنتیں دنیا اور جو کچھ اس میں ہے اس سے بہتر ہیں۔", hi: "फ़ज्र की दो सुन्नतें दुनिया और जो कुछ उसमें है उस से बेहतर हैं।", ta: "یہ بہت ہلکی اور مختصر پڑھی جاتی ہیں۔", ha: "Sahih Muslim 725" },
            { cat: "namaz", title: "42. Witr", ar: "", ro: "Isha ke baad se Fajr tak, 1, 3, 5, 7, 9 ya 11 rak'at", ur: "رات کی نماز دو دو رکعت ہے، پھر ایک رکعت ملا کر وتر بنا لیں۔", hi: "रात की नमाज़ दो दो रकअत है, फिर एक रकअत मिला कर वित्र बना लें।", ta: "رات کی آخری نماز۔", ha: "Sahih al-Bukhari 990; Sahih Muslim 749" },
            { cat: "namaz", title: "43. Witr ki dua-e-Qunoot", ar: D.qunoot, ro: "Allahummahdini fiman hadayt, wa 'afini fiman 'afayt...", ur: "اے اللہ! مجھے ان میں ہدایت دے جنہیں تو نے ہدایت دی...", hi: "ऐ अल्लाह! मुझे उनमें हिदायत दे जिन्हें तूने हिदायत दी...", ta: "وتر کی آخری رکعت میں پڑھی جاتی ہے۔", ha: "Sunan Abi Dawud 1425 - Sahih" },
            { cat: "namaz", title: "44. Witr ke baad: Subhanal-Malikil-Quddus", ar: D.subhan_malik, ro: "Subhanal-Malikil-Quddus", ur: "پاک ہے وہ بادشاہ جو ہر عیب سے پاک ہے۔", hi: "पाक है वो बादशाह जो हर ऐब से पाक है।", ta: "وتر کے سلام کے بعد 3 بار، تیسری بار آواز بلند کر کے۔", ha: "Sunan an-Nasa'i 1700 - Sahih" },
            { cat: "namaz", title: "45. Tahajjud / Qiyam-ul-Layl", ar: "", ro: "Raat ka aakhri hissa, 2-2 rak'at, aksar 11 rak'at", ur: "فرض کے بعد سب سے افضل نماز رات کی نماز ہے۔", hi: "फ़र्ज़ के बाद सब से अफ़ज़ल नमाज़ रात की नमाज़ है।", ta: "رات کے آخری تہائی حصے میں اللہ کی خاص رحمت کا وقت ہوتا ہے۔", ha: "Sahih Muslim 1163; Sahih al-Bukhari 1145" },
            { cat: "namaz", title: "46. Tarawih (Qiyam-e-Ramadan)", ar: "", ro: "Ramzan ki raaton mein Isha ke baad", ur: "جو رمضان میں ایمان اور ثواب کی نیت سے قیام کرے...", hi: "जो रमज़ान में ईमान और सवाब की नीयत से क़ियाम करे...", ta: "رمضان میں رات کی نماز۔", ha: "Sahih al-Bukhari 37; Sahih Muslim 759" },
            { cat: "namaz", title: "47. Salat-ud-Duha (Chasht)", ar: "", ro: "Suraj buland hone ke baad se zawal se pehle tak, kam az kam 2 rak'at", ur: "ہر جوڑ کے صدقے کے بدلے دو رکعت کافی ہیں۔", hi: "हर जोड़ के सदक़े के बदले दो रकअत काफ़ी हैं।", ta: "چاشت کے وقت پڑھی جاتی ہے۔", ha: "Sahih Muslim 720" },
            { cat: "namaz", title: "48. Tahiyyat-ul-Masjid", ar: "", ro: "Masjid mein dakhil hone par baithne se pehle 2 rak'at", ur: "جب تم میں سے کوئی مسجد میں داخل ہو تو بیٹھنے سے پہلے دو رکعت پڑھ لے۔", hi: "जब तुम में से कोई मस्जिद में दाख़िल हो तो बैठने से पहले दो रकअत पढ़ ले।", ta: "مسجد کا حق۔", ha: "Sahih al-Bukhari 444; Sahih Muslim 714" },
            { cat: "namaz", title: "49. Tahiyyat-ul-Wudu", ar: "", ro: "Wudu ke baad 2 rak'at", ur: "وضو کے بعد دو رکعت پڑھنا حضرت بلال RA کا معمول تھا۔", hi: "वुज़ू के बाद दो रकअत पढ़ना हज़रत बिलाल RA का मामूल था।", ta: "جس پر نبی ﷺ نے انہیں جنت کی خوشخبری دی۔", ha: "Sahih al-Bukhari 1149; Sahih Muslim 2458" },
            { cat: "namaz", title: "50. Maghrib se pehle 2 rak'at", ar: "", ro: "Maghrib ki azan aur iqamat ke darmiyan 2 rak'at", ur: "مغرب سے پہلے نماز پڑھو (جو چاہے)۔", hi: "मग़रिब से पहले नमाज़ पढ़ो (जो चाहे)।", ta: "یہ سنت غیر مؤکدہ ہے۔", ha: "Sahih al-Bukhari 1183" },
            { cat: "namaz", title: "51. Salat-ut-Taubah", ar: "", ro: "Gunah ho jane ke baad 2 rak'at", ur: "جو گناہ کرے پھر وضو کر کے دو رکعت پڑھے اور استغفر کرے...", hi: "जो गुनाह करे फिर वुज़ू कर के दो रकअत पढ़े और इस्तग़फ़ार करे...", ta: "توبہ کی نماز۔", ha: "Sunan Abi Dawud 1521 - Sahih" },
            { cat: "namaz", title: "52. Jumu'ah ki namaz", ar: "", ro: "Jumu'ah ke din Zuhr ke bajaye 2 rak'at farz", ur: "جمعہ کے دن نماز کے لیے پکارا جائے تو اللہ کے ذکر کی طرف دوڑو۔", hi: "जुमा के दिन नमाज़ के लिए पुकारा जाए तो अल्लाह के ज़िक्र की तरफ़ दौड़ो।", ta: "مردوں پر فرض ہے۔", ha: "Surah Al-Jumu'ah 62:9" },
            { cat: "namaz", title: "53. Eidain ki namaz", ar: "", ro: "Eid ul-Fitr aur Eid ul-Adha, 2 rak'at (khutbe se pehle)", ur: "نبی ﷺ عید کے دن عیدگاہ جاتے، پہلے نماز پڑھتے پھر خطبہ دیتے۔", hi: "नबी ﷺ ईद के दिन ईदगाह जाते, पहले नमाज़ पढ़ते फिर खुत्बा देते।", ta: "عید کی نماز۔", ha: "Sahih al-Bukhari 956; Sahih Muslim 889" },
            { cat: "namaz", title: "54. Namaz-e-Janazah", ar: "", ro: "4 takbirat, bina ruku aur sajde ke", ur: "جنازے کے ساتھ چلنے والے کو ایک قیراط کا ثواب ہے۔", hi: "जनाज़े के साथ चलने वाले को एक क़ीरात का सवाब है।", ta: "فرض کفایہ۔", ha: "Sahih al-Bukhari 1325; Sahih Muslim 945" },
            { cat: "namaz", title: "55. Namaz-e-Kusuf", ar: "", ro: "Suraj/chand grahan par 2 rak'at, har rak'at mein do ruku", ur: "سورج اور چاند اللہ کی نشانیاں ہیں، گرہن لگے تو نماز پڑھو...", hi: "सूरज और चाँद अल्लाह की निशानियाँ हैं, ग्रहण लगे तो नमाज़ पढ़ो...", ta: "گرہن کی نماز۔", ha: "Sahih al-Bukhari 1044; Sahih Muslim 901" },
            { cat: "namaz", title: "56. Namaz-e-Istisqa", ar: "", ro: "Khushk-sali ke waqt khule maidan mein 2 rak'at", ur: "نبی ﷺ بارش کی دعا کے لیے میدان میں نکلے...", hi: "नबी ﷺ बारिश की दुआ के लिए मैदान में निकले...", ta: "بارش کی نماز۔", ha: "Sahih al-Bukhari 1012; Sahih Muslim 894" },
            { cat: "namaz", title: "57. Safar mein namaz ka qasr", ar: "", ro: "Zuhr, Asr, Isha ki 4 rak'at ki jagah 2 rak'at", ur: "یہ ایک صدقہ ہے جو اللہ نے تم پر کیا ہے، اسے قبول کرو۔", hi: "ये एक सदक़ा है जो अल्लाह ने तुम पर किया है, इसे क़ुबूल करो।", ta: "سفر میں قصر۔", ha: "Sahih Muslim 686" },
            { cat: "namaz", title: "58. Nafl namaz ghar mein", ar: "", ro: "Farz ke alawa nafl ghar mein padhna afzal", ur: "اپنے گھروں میں نماز پڑھو...", hi: "अपने घरों में नमाज़ पढ़ो...", ta: "گھر میں نفل پڑھنے کی فضیلت۔", ha: "Sahih al-Bukhari 731; Sahih Muslim 781" },
            { cat: "namaz", title: "59. Salat-ul-Istikhara ka tareeqa", ar: D.istikhara, ro: "Allahumma inni astakhiruka bi 'ilmik...", ur: "اے اللہ! میں تیرے علم کے وسیلے سے تجھ سے بھلائی طلب کرتا ہوں...", hi: "ऐ अल्लाह! मैं तेरे इल्म के वसीले से तुझसे भलाई तलब करता हूँ...", ta: "کسی جائز کام کے ارادے پر 2 رکعت نفل پڑھ کر یہ دعا پڑھیں۔", ha: "Sahih al-Bukhari 1162" },

            // SUBAH SHAM
            { cat: "subah", title: "1. Neend se uthne ki dua", ar: D.uthna, ro: "Alhamdulillahil-ladhi ahyana ba'da ma amatana...", ur: "تمام تعریف اللہ کے لیے ہے جس نے ہمیں موت کے بعد زندہ کیا...", hi: "तमाम तारीफ़ अल्लाह के लिए है जिसने हमें मौत के बाद ज़िंदा किया...", ta: "نیند کو ایک قسم کی موت کہا گیا ہے۔", ha: "Sahih al-Bukhari 6312" },
            { cat: "subah", title: "2. Ghar se nikalte waqt", ar: D.ghar_nikalna, ro: "Bismillah, tawakkaltu 'alallah, wa la hawla...", ur: "اللہ کے نام کے ساتھ، میں نے اللہ پر بھروسا کیا...", hi: "अल्लाह के नाम के साथ, मैंने अल्लाह पर भरोसा किया...", ta: "گھر سے نکلتے وقت یہ پڑھنے سے ہدایت، کفایت اور حفاظت کا وعدہ ہے۔", ha: "Sunan Abi Dawud 5095 - Sahih" },
            { cat: "subah", title: "3. Teeno Qul (3 martaba)", ar: D.muawwidhat, ro: "Qul huwallahu ahad... Qul a'udhu bi rabbil-falaq...", ur: "کہو وہ اللہ ایک ہے... کہو میں صبح کے رب کی پناہ میں آتا ہوں...", hi: "कहो वो अल्लाह एक है... कहो मैं सुबह के रब की पनाह में आता हूँ...", ta: "صبح و شام 3-3 بار پڑھنا ہر چیز سے کافی ہے۔", ha: "Sunan Abi Dawud 5082 - Sahih" },
            { cat: "subah", title: "4. Din ki bhalai maangne ki dua (Asbahna)", ar: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ...", ro: "Asbahna wa asbahal-mulku lillah...", ur: "ہم نے صبح کی اور بادشاہی اللہ ہی کی ہے...", hi: "हमने सुबह की और बादशाही अल्लाह ही की है...", ta: "شام کو 'أمسينا' سے شروع کریں۔", ha: "Sahih Muslim 2723" },
            { cat: "subah", title: "5. Nuqsan se hifazat ki dua (3 martaba)", ar: D.hifazat, ro: "Bismillahil-ladhi la yadurru ma'asmihi shay'un...", ur: "اللہ کے نام کے ساتھ، جس کے نام کی موجودگی میں...", hi: "अल्लाह के नाम के साथ, जिसके नाम की मौजूदगी में...", ta: "صبح و شام 3 بار پڑھنے سے کوئی چیز نقصان نہیں پہنچا سکتی۔", ha: "Sunan Abi Dawud 5088 - Sahih" },
            { cat: "subah", title: "6. Afiyat ki jaame dua", ar: D.afiyat, ro: "Allahumma inni as'alukal-'afiyata fid-dunya wal-akhirah...", ur: "اے اللہ! میں تجھ سے دنیا و آخرت میں عافیت مانگتا ہوں...", hi: "ऐ अल्लाह! मैं तुझसे दुनिया व आख़िरत में आफ़ियत माँगता हूँ...", ta: "افیت کا مطلب ہر طرح کی سلامتی ہے۔", ha: "Sunan Abi Dawud 5074 - Sahih" },
            { cat: "subah", title: "7. Mamlaat sanwarne ki dua (Fatima RA)", ar: D.mamlaat, ro: "Ya Hayyu ya Qayyumu bi rahmatika astaghith...", ur: "اے زندہ! اے سب کو تھامنے والے! میں تیری رحمت کے وسیلے سے فریاد کرتا ہوں...", hi: "ऐ ज़िंदा! ऐ सब को थामने वाले! मैं तेरी रहमत के वसीले से फ़रियाद करता हूँ...", ta: "نبی ﷺ نے فاطمہ RA کو یہ صبح و شام پڑھنے کی وصیت کی۔", ha: "an-Nasa'i fi 'Amalil-Yawm 570 - Hasan" },
            { cat: "subah", title: "8. Nafs aur shaitan ke shar se panah", ar: D.nafs_shaitan, ro: "Allahumma 'alimal-ghaybi wash-shahadah...", ur: "اے اللہ! غیب اور ظاہر کے جاننے والے...", hi: "ऐ अल्लाह! ग़ैब और ज़ाहिर के जानने वाले...", ta: "صبح، شام اور سونے سے پہلے پڑھیں۔", ha: "Sunan Abi Dawud 5067 - Sahih" },
            { cat: "subah", title: "9. Iman ki tajdeed ka kalimah", ar: D.iman_tajdeed, ro: "Raditu billahi rabban, wa bil-Islami dinan...", ur: "میں اللہ کے رب ہونے، اسلام کے دین ہونے...", hi: "मैं अल्लाह के रब होने, इस्लाम के दीन होने...", ta: "جو اسے دل سے مانے، اس کے لیے جنت واجب ہو جاتی ہے۔", ha: "Sahih Muslim 1884" },
            { cat: "subah", title: "10. Subhanallah wa bihamdihi (100 martaba)", ar: D.subhan100, ro: "Subhanallah wa bihamdihi", ur: "اللہ پاک ہے اور میں اس کی حمد کے ساتھ اس کی تسبیح بیان کرتا ہوں۔", hi: "अल्लाह पाक है और मैं उसकी हम्द के साथ उसकी तस्बीह बयान करता हूँ।", ta: "صبح و شام 100 بار پڑھنے سے گناہ معاف ہوتے ہیں۔", ha: "Sahih Muslim 2692" },
            { cat: "subah", title: "11. La ilaha illallah (100 martaba)", ar: D.lailaha100, ro: "La ilaha illallahu wahdahu la sharika lah...", ur: "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے...", hi: "अल्लाह के सिवा कोई माबूद नहीं, वो अकेला है...", ta: "دن میں 100 بار پڑھنے سے 10 غلام آزاد کرنے کا ثواب...", ha: "Sahih al-Bukhari 3293" },
            { cat: "subah", title: "12. Darood Shareef", ar: D.darood, ro: "Allahumma salli 'ala Muhammadin wa 'ala aali Muhammad...", ur: "اے اللہ! محمد ﷺ اور آل محمد پر رحمت نازل فرما...", hi: "ऐ अल्लाह! मुहम्मद ﷺ और आले मुहम्मद पर रहमत नाज़िल फ़रमा...", ta: "جو مجھ پر ایک بار درود بھیجے، اللہ اس پر 10 رحمتیں نازل کرتا ہے۔", ha: "Sahih Muslim 408" },
            { cat: "subah", title: "13. Sayyidul Istighfar", ar: D.sayyidul, ro: "Allahumma anta Rabbi la ilaha illa ant...", ur: "اے اللہ! تو میرا رب ہے، تیرے سوا کوئی معبود نہیں...", hi: "ऐ अल्लाह! तू मेरा रब है, तेरे सिवा कोई माबूद नहीं...", ta: "جو یقین کے ساتھ صبح یا شام پڑھے اور اسی دن مر جائے، وہ جنت میں جائے گا۔", ha: "Sahih al-Bukhari 6306" },
            { cat: "subah", title: "14. Roz ka istighfar (100 martaba)", ar: D.astaghfir, ro: "Astaghfirullaha wa atubu ilayh", ur: "میں اللہ سے معافی مانگتا ہوں اور اسی کی طرف توبہ کرتا ہوں۔", hi: "मैं अल्लाह से माफ़ी माँगता हूँ और उसी की तरफ़ तौबा करता हूँ।", ta: "نبی ﷺ روز 100 بار استغفر کرتے تھے۔", ha: "Sahih Muslim 2702" },
            { cat: "subah", title: "15. Gunahon ki muafi ka mukammal istighfar", ar: D.astaghfir_azim, ro: "Astaghfirullahal-'Azim alladhi la ilaha illa huwal-Hayyul-Qayyum...", ur: "میں اللہ عظمت والے سے معافی مانگتا ہوں...", hi: "मैं अल्लाह अज़मत वाले से माफ़ी माँगता हूँ...", ta: "جو یہ کہے، اللہ اسے بخش دیتا ہے، چاہے وہ جنگ سے بھاگا ہو۔", ha: "Sunan Abi Dawud 1517 - Sahih" },
            { cat: "subah", title: "16. Rabbi ghfir li wa tub 'alayya", ar: D.rabbighfir, ro: "Rabbighfir li wa tub 'alayya, innaka antat-Tawwabur-Rahim", ur: "اے میرے رب! مجھے بخش دے اور میری توبہ قبول فرما...", hi: "ऐ मेरे रब! मुझे बख़्श दे और मेरी तौबा क़ुबूल फ़रमा...", ta: "نبی ﷺ ایک ہی مجلس میں 100 بار یہ پڑھتے تھے۔", ha: "Sunan Abi Dawud 1516 - Sahih" },
            { cat: "subah", title: "17. Saare gunahon ki muafi ki dua", ar: D.sajda_sab_gunah, ro: "Allahummaghfir li dhanbi kullahu, diqqahu wa jillahu...", ur: "اے اللہ! میرے سارے گناہ بخش دے...", hi: "ऐ अल्लाह! मेरे सारे गुनाह बख़्श दे...", ta: "سجدے میں یا ہر وقت پڑھ سکتے ہیں۔", ha: "Sahih Muslim 483" },
            { cat: "subah", title: "18. Adam AS ki tauba ki dua", ar: "رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ", ro: "Rabbana zalamna anfusana wa in lam taghfir lana...", ur: "اے ہمارے رب! ہم نے اپنی جانوں پر ظلم کیا...", hi: "ऐ हमारे रब! हमने अपनी जानों पर ज़ुल्म किया...", ta: "یہ انسان کی پہلی توبہ ہے۔", ha: "Surah Al-A'raf 7:23" },
            { cat: "subah", title: "19. Maafi (Afw) ki dua", ar: D.afw, ro: "Allahumma innaka 'afuwwun tuhibbul-'afwa fa'fu 'anni", ur: "اے اللہ! بے شک تو بہت معاف کرنے والا ہے...", hi: "ऐ अल्लाह! बेशक तू बहुत माफ़ करने वाला है...", ta: "خاص طور پر رمضان کی آخری راتوں میں پڑھیں۔", ha: "Sunan at-Tirmidhi 3513 - Sahih" },

            // MUSHKIL
            { cat: "mushkil", title: "1. Pareshani aur Takleef ki dua (Dua-ul-Karb)", ar: D.karb, ro: "La ilaha illallahul-'Azimul-Halim...", ur: "اللہ کے سوا کوئی معبود نہیں جو عظمت والا، بردبار ہے...", hi: "अल्लाह के सिवा कोई माबूद नहीं जो अज़मत वाला, बुर्दबार है...", ta: "پریشانی کے وقت یہ پڑھنے سے دل کو سکون ملتا ہے۔", ha: "Sahih al-Bukhari 6345" },
            { cat: "mushkil", title: "2. Bechaini mein: Allahumma rahmataka arju", ar: D.bechaini, ro: "Allahumma rahmataka arju, fala takilni ila nafsi...", ur: "اے اللہ! میں تیری رحمت کا امیدوار ہوں...", hi: "ऐ अल्लाह! मैं तेरी रहमत का उम्मीदवार हूँ...", ta: "جب انسان خود کو بے بس محسوس کرے تو یہ دعا دل کو مضبوطی دیتی ہے۔", ha: "Sunan Abi Dawud 5090 - Hasan" },
            { cat: "mushkil", title: "3. Yunus AS ki dua", ar: D.yunus, ro: "La ilaha illa anta subhanaka inni kuntu minaz-zalimin", ur: "تیرے سوا کوئی معبود نہیں، تو پاک ہے...", hi: "तेरे सिवा कोई माबूद नहीं, तू पाक है...", ta: "ہر مشکل اور حاجت کے لیے پڑھی جا سکتی ہے۔", ha: "Sunan at-Tirmidhi 3505 - Sahih" },
            { cat: "mushkil", title: "4. Gham, Fikr aur Qarz se panah", ar: D.gham, ro: "Allahumma inni a'udhu bika minal-hammi wal-hazan...", ur: "اے اللہ! میں تیری پناہ مانگتا ہوں فکر اور غم سے...", hi: "ऐ अल्लाह! मैं तेरी पनाह माँगता हूँ फ़िक्र और ग़म से...", ta: "نبی ﷺ اکثر یہ دعا پڑھتے تھے۔", ha: "Sahih al-Bukhari 6369" },

        function renderDuas(filterText = "", category = "all") {
            const container = document.getElementById('duaContainer');
            container.innerHTML = '';

            const filtered = allDuas.filter(dua => {
                const matchesSearch = dua.title.toLowerCase().includes(filterText.toLowerCase()) || 
                                      dua.ro.toLowerCase().includes(filterText.toLowerCase()) || 
                                      dua.ur.includes(filterText) ||
                                      dua.hi.includes(filterText);
                const matchesCategory = category === 'all' || dua.cat === category;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:gray; padding: 20px;">Koi Dua nahi mili.</p>';
                return;
            }

            filtered.forEach((dua, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3 style="color: var(--primary); margin-bottom: 10px;">${dua.title}</h3>
                    
                    ${dua.ar ? `<div class="arabic" onclick="speakText('${dua.ar.replace(/'/g, "\\'")}', 'ar')">
                        ${dua.ar}
                        <button class="play-btn">🔊 AI Awaz</button>
                    </div>` : ''}
                    
                    <div class="roman">${dua.ro}</div>
                    
                    <div class="urdu" onclick="speakText('${dua.ur.replace(/'/g, "\\'")}', 'ur')">
                        ${dua.ur}
                        <button class="play-btn">🔊 AI Awaz</button>
                    </div>

                    <div class="hindi">
                        <b>Hindi:</b> ${dua.hi}
                    </div>
                    
                    <div class="tafseel-box">
                        <span class="tafseel-title">📖 Tafseel / Faida:</span>
                        <div class="tafseel-text">${dua.ta}</div>
                    </div>
                    
                    <div class="hawala">📍 Hawala: ${dua.ha}</div>
                `;
                container.appendChild(card);
            });
        }

        let currentCategory = 'all';
        function filterCards() {
            const query = document.getElementById('searchInput').value;
            renderDuas(query, currentCategory);
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const query = document.getElementById('searchInput').value;
            renderDuas(query, cat);
        }

        renderDuas();
    </script>
